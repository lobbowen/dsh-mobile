<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DSH 容器宿主帧</title>
    <style>
      /* 宿主帧：本身不渲染业务 UI，只做「内核面板 iframe + 更新请求转发」。
         由内核 API 同源托管于 /__host —— 与面板同源，故内核的 Origin 闸(api/index.js
         originAllowed 闸②)放行，面板的写操作不再 403。 */
      html, body { margin: 0; padding: 0; height: 100%; width: 100%; background: #0b0e14; }
      #kernel { display: block; width: 100%; height: 100%; border: 0; }
    </style>
    <!-- CSP（内核 serveStatic 施加）：script-src 'self' 禁止内联脚本 → 逻辑必须外链 -->
    <script src="/host-frame.js" defer></script>
  </head>
  <body>
    <!-- 面板同源相对路径：满足 window.parent !== window（hasHostBridge 为真），且与宿主页同源 -->
    <iframe id="kernel" src="/" title="dsh-supervisor"></iframe>
  </body>
</html>
