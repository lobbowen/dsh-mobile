name: Build & Sign Program OTA Bundle

# ============================================================================
#  **Program（L1 载荷）版本流的唯一发布链**。全仓每条版本流恰好一条链（投递只由人打的带版本号 tag 决定）；唯一的例外是能力件那条 pin-capabilities.yml —— 它的身份是内容指纹、入口是 dispatch（ADR-0011 §5）。，见
#  docs/adr/0011-one-release-chain-per-stream.md 与 ci.yml 头部那张表。
#
#  构建并签名「可热更新的 Program（L1）」OTA 包：对齐 docs/contracts/base-spec.md §5 通道一（构建期签名）。
#
#  双信任根：本工作流用 CI secret OTA_PRIVATE_KEY_PEM（ed25519 私钥）签名 Program 包；
#  设备端用焊死在 APK 的 container/app/src/main/assets/ota-public.pem 验签 —— 私钥绝不进 APK。
#
#  两个身份，一条链：
#    · workflow_dispatch = **只构建校验**（产物留在 Actions 构件里，什么都不会改动线上通道）。
#      可给的输入：program_repo / program_ref（跨仓构建才填）、version、abi、url_base、
#      channel、rollout_percent —— 这些在这一身份下只影响"这次校验构建长什么样"。
#    · 推 tag `program-ota-<channel>-<version>`（channel ∈ canary|stable）= **投递这一版**。
#      ADR-0004：Program 版本**不可复用**，所以版本号写在 tag 名里，且必须与
#      programs/console/package.json 现读出来的那一个逐字相符才动手。
#    旧形态里的 `publish` 布尔输入随归一删除：它让「同一次 dispatch 可以顺手投一下」成为可能，
#    而那条路正是 ADR-0004 说的「内容变了、版本号没说谎」的入口 —— 设备判「没有更新」，
#    静默不生效，且无任何报错。
#
#  放量百分比在 tag 轮恒为 100：灰度这件事由**通道**承担（先发 canary、真机验过，
#  再用同一个版本号打 stable 的 tag 提升），而不是由「同一版本改一次通道 manifest」承担 ——
#  后者是一次不涨版本的通道改写，正是这次归一要删掉的形状。
#
#  产物：release/program-<version>.zip + release/program-manifest.json（作为 artifact / Release 下载）。
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      program_repo:
        description: 'Program 源码仓 (owner/repo)'
        required: false
        default: ''
      program_ref:
        description: 'Program 仓 ref（分支/tag/sha）'
        required: false
        default: 'main'
      version:
        # ⚠ 默认必须为空：留空才会从单一事实源 programs/console/package.json 解析（ADR-0004）。
        # 原先默认 '1.0.0'，与 package.json 构成两个源 —— 实测它就静默产出了 version=1.0.0
        # 的 manifest（Program 真实为 0.1.0-android.11）。注释写着「已修」，但默认值一直没改。
        description: 'Program 版本号（留空 = 从 programs/console/package.json 解析）'
        required: false
        default: ''
      abi:
        description: 'abi 标签'
        required: false
        default: 'node24-arm64-android35'
      url_base:
        description: 'OTA 下载基址（结尾不带 /）'
        required: false
        default: ''
      rollout_percent:
        description: '灰度放量百分比（0-100；100=全量）。**只对校验轮生效**，tag 轮恒为 100'
        required: false
        default: '100'
      channel:
        description: '通道：canary=灰度测试（先发这里真机验证），stable=生产。仅校验轮；tag 轮的通道写在 tag 名里'
        type: choice
        options:
          - canary
          - stable
        required: false
        default: canary
  push:
    tags:
      - 'program-ota-*'

permissions:
  contents: write

jobs:
  build-program:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PROGRAM_REPO: ${{ github.event.inputs.program_repo }}
      PROGRAM_REF: ${{ github.event.inputs.program_ref || 'main' }}
      # 版本号**不写死**：留空时由下一步从 Program 的单一事实源（programs/console/package.json）解析。
      # 原先这里默认 '1.0.0'，与 programs/console/package.json 的版本是两个源 —— 会静默分叉（ADR-0004）。
      PROGRAM_VER: ${{ github.event.inputs.version || '' }}
      PROGRAM_ABI: ${{ github.event.inputs.abi || 'node24-arm64-android35' }}
      # 通道只在下面的 Resolve 步骤里定一次（校验轮取输入、投递轮取 tag 名），
      # 不在这里给缺省：job 级 env 与 GITHUB_ENV 同名时的优先级不该留给猜测。
      OTA_URL_BASE: ${{ github.event.inputs.url_base || '' }}
    steps:
      - name: Checkout container repo
        uses: actions/checkout@v4

      - name: Resolve program version + channel + requiresProtocol
        id: resolve
        run: |
          set -euo pipefail
          SRC_VER="$(node -p "require('./programs/console/package.json').version")"
          case "${GITHUB_REF:-}" in
            refs/tags/program-ota-*)
              # 投递轮：**版本与通道都由 tag 名决定**，且必须与事实源逐字相符。
              # 为什么要比：tag 是「人要发这一版」的唯一凭据，而包是从 ref 检出的工作树构建的。
              # 若有人对旧 ref 打新 tag（或先打 tag 再改 package.json），发出去的东西与
              # tag 说的不是同一版 —— 而设备只认版本号，A/B 两个内容会共用同一个身份。
              REST="${GITHUB_REF_NAME#program-ota-}"
              case "$REST" in
                canary-*) CHANNEL=canary; V="${REST#canary-}" ;;
                stable-*) CHANNEL=stable; V="${REST#stable-}" ;;
                *)
                  echo "::error title=发布 tag 形状不符::tag 是 ${GITHUB_REF_NAME}，要形如 program-ota-<canary|stable>-<version>。"
                  echo "::error::通道写在 tag 名里，因为「发哪个通道」和「发哪一版」一样是不可事后推断的决定。"
                  exit 1 ;;
              esac
              if [ "$V" != "$SRC_VER" ]; then
                echo "::error title=发布 tag 与版本事实源不符::tag 说 $V，而 programs/console/package.json 现读出来是 $SRC_VER。"
                echo "::error::要么重打一个与事实源相符的 tag，要么先改 package.json 再打 tag —— 本次不投递。"
                exit 1
              fi
              echo "[version] 投递轮：tag=${GITHUB_REF_NAME} → channel=$CHANNEL version=$V（与事实源一致）"
              ;;
            *)
              # 校验轮：什么都不会投递，所以允许显式指定版本去试打。
              CHANNEL="${{ github.event.inputs.channel || 'canary' }}"
              V="${{ github.event.inputs.version }}"
              if [ -z "$V" ]; then
                V="$SRC_VER"
                echo "[version] Program 版本（来自 programs/console/package.json）: $V"
              else
                echo "[version] Program 版本（显式指定，仅本次校验构建）: $V"
              fi
              ;;
          esac
          echo "PROGRAM_VER=$V" >> "$GITHUB_ENV"
          echo "PROGRAM_CHANNEL=$CHANNEL" >> "$GITHUB_ENV"
          P="$(node -p "require('./programs/console/package.json').lobos.requiresProtocol || 0")"
          echo "LOBOS_PROGRAM_REQUIRES_PROTOCOL=$P" >> "$GITHUB_ENV"
          echo "[version] Program 要求的最低桥协议: $P"
          echo "[channel] channel=$CHANNEL"

      - name: Restore signing private key from secret
        env:
          OTA_PRIVATE_KEY_PEM: ${{ secrets.OTA_PRIVATE_KEY_PEM }}
        run: |
          if [ -z "$OTA_PRIVATE_KEY_PEM" ]; then
            echo "::error::secrets.OTA_PRIVATE_KEY_PEM 未配置（ed25519 私钥，用于签名 Program 包）"
            exit 1
          fi
          mkdir -p keys
          printf '%s' "$OTA_PRIVATE_KEY_PEM" > keys/ota-private.pem
          chmod 600 keys/ota-private.pem
          echo "private key restored -> keys/ota-private.pem"

      - name: Verify OTA public key anchor matches the signing private key
        # 这条是 P2b-e 的落点：此前这一步只查「锚点文件在不在 + 多少字节」。于是
        # 私钥轮换后重焊了 APK 公钥却忘了改 secrets.OTA_PRIVATE_KEY_PEM（或反过来）
        # 会一路绿到底 —— 签出的每个包在所有设备上判 signature-invalid，OTA 静默死亡，
        # 取证却要一轮真机。只有这条链拿得到私钥，所以配对判据在这里执行。
        # 判据实现唯一：scripts/verify-ota-anchor.sh（build-apk 那边同调、只缺 --private）。
        run: |
          set -euo pipefail
          bash scripts/ensure-tool.sh openssl openssl
          bash scripts/verify-ota-anchor.sh \
            --anchor container/app/src/main/assets/ota-public.pem \
            --private keys/ota-private.pem

      - name: Stage program source
        # 单仓默认：Program 源码就是同仓 programs/console/ 子目录，无需跨仓检出。
        # 只有显式传了 program_repo（fork / 试验分支）才去 clone 外部仓。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$PROGRAM_REPO" ]; then
            git clone --depth 1 --branch "$PROGRAM_REF" \
              "https://x-access-token:${GH_TOKEN}@github.com/$PROGRAM_REPO.git" program-src
          else
            cp -a programs/console program-src
          fi

      - name: Build panel UI (ui/dist)
        # ui/dist 被 .gitignore 排除，但 Program 包运行期必需 —— 检出里没有，
        # 不现场构建就会打出「能启动但打不开控制面板」的残缺包
        # （program-bundle.js 特意在排除表旁注了"注意保留 ui/dist"）。
        run: |
          set -euo pipefail
          cd program-src/ui
          npm ci --no-audit --no-fund
          npm run build

      - name: Build & sign program bundle
        # 输出目录必须显式给：build-program-bundle.js 的默认值是「脚本所在仓的三层之上」(../..)，
        #   在 CI 上等于 /home/runner/work/release —— 而本工作流后面按仓内 release/ 读它，
        #   于是 sign 步骤 ENOENT（实测：program-ota-0.1.0-android.37 首次发布即因此红）。
        #   脚本本来就留了 LOBOS_BUNDLE_OUT_DIR 这个口子，这里显式钉成仓内 release/。
        env:
          LOBOS_BUNDLE_OUT_DIR: ${{ github.workspace }}/release
        run: |
          chmod +x scripts/build-program-bundle.sh
          ./scripts/build-program-bundle.sh "$PWD/program-src" "$PROGRAM_VER" "$PROGRAM_ABI" "$OTA_URL_BASE"

      - name: Sign feed manifest (freshness + signature)
        # ADR-0005 C3：manifest 是**先被读**的那一个，必须自带新鲜度与签名 ——
        # sequence 单调（防重放/冻结）、expires 过期即拒、signature 供设备端校验。
        #
        # sequence 由脚本内部取**时间戳**，不再依赖"上一份 Release 的 sequence + 1"。
        # 那个做法在 Release 被删除/重建时会**倒退**，而设备把水位持久化在自己身上 ——
        # 会把倒退后的 sequence 判为重放并拒绝，导致设备**永久卡住**（实测撞到过）。
        # 因此这里不再需要下载上一份 manifest，步骤也少一个失败点。
        run: |
          set -euo pipefail
          node scripts/sign-program-manifest.js release/program-manifest.json keys/ota-private.pem "${{ github.event.inputs.rollout_percent || 100 }}"

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: program-ota-${{ env.PROGRAM_VER }}
          path: |
            release/program-${{ env.PROGRAM_VER }}.zip
            release/program-manifest.json
          if-no-files-found: error

      - name: Publish to Release
        if: ${{ startsWith(github.ref, 'refs/tags/program-ota-') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ls -la release/

          # 发布说明写到文件再 --notes-file 读入。
          # 不直接写 --notes "多行"：多行字符串在 YAML 块标量里必须整体缩进，
          # 而缩进一破 YAML 就断（这里真实踩过 —— validate-workflow.py 立刻报
          # "could not find expected ':'"）。写文件既避开缩进问题，
          # 也让这段中文说明不必挤在缩进层级里。
          cat > /tmp/notes.md <<'NOTES'
          Signed Program OTA bundle. Verify with the welded APK public key.

          ## 设备如何拿到（OTA，唯一路径 —— ADR-0005）

          设备启动时读该**通道**的 manifest 并自动安装/升级：
          ```
          <baseUrl>/program-<channel>/program-manifest.json
          <baseUrl>/program-<channel>/program-<version>.zip
          ```
          通道 = `canary`（灰度真机验证）或 `stable`（生产）；设备侧在
          `container/app/src/main/assets/program-feed.json` 里选通道。
          本地 feed（adb 投放）与 APK 内置基线均已删除 —— 只有一个安装来源。

          ## 生效方式

          下次启动时由 OS 原生（`OsHost`/`OsInit`）自动发现并安装。
          安装**必须**验签通过；未签名或签名不匹配的包会被拒绝 ——
          设备只安装已签名 Program，不生产 Program。
          NOTES

          # ── 通道（灰度）：canary = 灰度真机验证；stable = 生产 ──────────────
          # 为什么必须有：Program 推送**必须先在灰度通道真实跑过**，否则只能靠祈祷。
          # 设备端读 <base>/<rolling>/program-manifest.json，rolling = program-<channel>。
          ROLL="program-$PROGRAM_CHANNEL"
          echo "[channel] channel=$PROGRAM_CHANNEL rolling=$ROLL"

          # ── 版本门禁（**按通道**比较；同一通道同号即红）─────────────────────────
          # 发布一个"不大于本通道已发布"的版本 = 该通道设备永远不更新且无报错。
          # 按通道而非全局：canary 可以领先 stable；用同一个版本号打 stable 的 tag 提升时，
          # 比的是**目标通道**的读数，仍要求前进。
          # 同版本对同一通道重发以前是**放行**的（理由="修投递/重传/补签都在版本没变时发生"），
          # 现在判红：ADR-0004 说的就是这一件事 —— 同号换内容，设备判「没有更新」，
          # 静默不生效且无任何报错。投递坏了的正确反应是 bump 版本号，不是让同一个版本号
          # 指向另一批字节。
          # 「该通道还没有 manifest」与「取不到 manifest」是两种结局，分类只住
          # scripts/read-release-asset.sh（APK 侧读 version.json 用的是同一处）。
          # 旧写法把「取不到」降成 ::warning 然后照发，还把「取到了但读不出 version」
          # 也当成空 —— 两者都是把「看不清」当成「没有」，正是 release.md §3 定过的那类罪。
          TMPD="$(mktemp -d)"
          FEEDRC=0
          bash scripts/read-release-asset.sh program-channel-manifest "$ROLL" program-manifest.json "$TMPD" || FEEDRC=$?
          CUR=""
          if [ "$FEEDRC" = "0" ]; then
            CUR="$(node -p "require('$TMPD/program-manifest.json').version || ''" 2>/dev/null || true)"
            if [ -z "$CUR" ]; then
              echo "::error title=Program 版本门禁::$ROLL 的 manifest 取到了却读不出 version 字段 —— 通道状态坏了，先修它再发。"
              exit 1
            fi
          elif [ "$FEEDRC" = "10" ]; then
            echo "[version] $ROLL 上没有 manifest —— 该通道首次发布，跳过前进检查"
          else
            echo "::error title=Program 版本门禁::读 $ROLL 的已发布 manifest 失败（原因见上一条）—— 看不清通道状态就不许发。"
            exit 1
          fi
          if [ -n "$CUR" ]; then
            echo "[version] $ROLL 已发布=$CUR，本次=$PROGRAM_VER"
            if [ "$PROGRAM_VER" = "$CUR" ]; then
              echo "::error title=Program 版本复用::$ROLL 上已经是 $CUR —— 同号再发一次，设备判「没有更新」，内容换了也没人知道。"
              echo "::error::请递增 programs/console/package.json 的 version 再打 tag。跨通道提升（canary→stable）比的是目标通道的读数，不受这条约束。"
              exit 1
            fi
            node -e "const {isNewer}=require('./container/engine/src/program-version'); if(isNewer(process.argv[1],process.argv[2])){process.exit(1)}" "$CUR" "$PROGRAM_VER" \
              || { echo "::error title=Program 版本回退::$ROLL 上本次 $PROGRAM_VER 低于已发布 $CUR —— 设备有版本下限，会拒绝安装；且该通道设备也判为无更新。请递增 programs/console/package.json 的 version。"; exit 1; }
            echo "[ok] 版本前进（$CUR → $PROGRAM_VER）"
          fi

          # ── 版本化归档：一个版本号只允许一批字节 ────────────────────────────
          # program-<version> 只建一次：这条**政策**用宿主的 --skip-existing 表达
          # （提升到新通道时不重建归档），而「读线上 → 创建 → 覆盖 → 回读确认」的判据
          # 仍只住 scripts/gh-release-upload.sh 一份。
          # 但「跳过创建」不等于「跳过核对」：提升到新通道时，本轮**重新构建**出来的 zip
          # 若与归档那份不是同一批字节，两个通道的设备就用同一个版本号装着两个不同的
          # Program —— 与 ADR-0004 禁止的那件事只差"分布在两个通道"。所以归档在位时先比
          # sha256（manifest 里那一格是构建脚本对落盘 zip 现算的，build-program-bundle.js:62）。
          ADIR="$(mktemp -d)"
          ARCRC=0
          bash scripts/read-release-asset.sh program-archive-manifest "program-$PROGRAM_VER" program-manifest.json "$ADIR" || ARCRC=$?
          case "$ARCRC" in
            0)
              OLD_SHA="$(node -p "require('$ADIR/program-manifest.json').sha256 || ''" 2>/dev/null || true)"
              NEW_SHA="$(node -p "require('./release/program-manifest.json').sha256 || ''" 2>/dev/null || true)"
              if [ -z "$OLD_SHA" ] || [ -z "$NEW_SHA" ]; then
                echo "::error title=Program 字节对账::归档读到 sha256=${OLD_SHA:-空}、本轮算出 sha256=${NEW_SHA:-空} —— 看不清就不许把同号发出去。"
                exit 1
              fi
              if [ "$OLD_SHA" != "$NEW_SHA" ]; then
                echo "::error title=同版本内容已变::program-$PROGRAM_VER 的归档 zip 是 $OLD_SHA，本轮构建出来的是 $NEW_SHA。"
                echo "::error::同号换字节正是设备「永不更新」的那个形状。请提升 programs/console/package.json 的 version 后重打 tag。"
                exit 1
              fi
              echo "[ok] 归档在位且字节一致（${NEW_SHA:0:12}…）—— 本次只切通道指针"
              ;;
            10) echo "[archive] program-$PROGRAM_VER 还不存在 —— 本次建归档" ;;
            *) echo "::error title=Program 字节对账::读归档 manifest 失败（原因见上一条）—— 看不清线上那份 zip 就不许发。"; exit 1 ;;
          esac

          # ── 版本化归档（全局唯一一次）────────────────────────────────────
          # program-<version> 只创建一次。**从 canary 提升到 stable 时不再重建** ——
          # 提升是标准动作，若把"同版本第二次发布"判为错误，就无法提升。
          # 「已存在就整步跳过」这条政策用宿主的 --skip-existing 表达，判据本身
          # （读线上、创建、覆盖、回读确认）只住 scripts/gh-release-upload.sh 一份。
          bash scripts/gh-release-upload.sh "program-${{ env.PROGRAM_VER }}" \
            --skip-existing \
            --title "Program OTA ${{ env.PROGRAM_VER }}" \
            --notes-file /tmp/notes.md \
            "release/program-${{ env.PROGRAM_VER }}.zip" release/program-manifest.json

          # ---- 通道滚动归档：发布方不必追着 program-<version> 的 tag 找当前版本 ----
          # 设备端读的是对象存储的 <base>/program-<channel>/（下一步），GitHub 这一份
          # 只做归档与本 workflow 的版本前进门禁 —— github.com 在目标网络不可达。
          # --prune 让通道 feed 只保留**本次**的 zip（否则会随每次发布无限堆积历史包）；
          # 本次刚传上去的资产名由宿主自动列入保留名单，不会被自己清掉。
          bash scripts/gh-release-upload.sh "$ROLL" \
            --title "Program OTA channel $PROGRAM_CHANNEL" \
            --notes "通道 feed（$PROGRAM_CHANNEL）：设备端读 $ROLL/program-manifest.json 判断是否有更新。" \
            --prune '^program-[0-9]' \
            release/program-manifest.json "release/program-${{ env.PROGRAM_VER }}.zip"

      - name: Publish to Qiniu (the channel devices actually read)
        # 为什么必须有这一步：**GitHub 在目标网络不可达**（实测 github.com / raw.githubusercontent.com
        # 均失败），所以 Release 只能当**归档**，设备端真正读的是对象存储。
        # 缺配置就**硬失败** —— 发一个设备读不到的包，等于假装发布成功。
        if: ${{ startsWith(github.ref, 'refs/tags/program-ota-') }}
        env:
          QINIU_AK: ${{ secrets.QINIU_AK }}
          QINIU_SK: ${{ secrets.QINIU_SK }}
          QINIU_BUCKET: ${{ secrets.QINIU_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "${QINIU_AK:-}" ] || [ -z "${QINIU_SK:-}" ] || [ -z "${QINIU_BUCKET:-}" ]; then
            echo "::error title=对象存储未配置::需要 secrets QINIU_AK / QINIU_SK / QINIU_BUCKET。设备端只从对象存储取 Program（GitHub 在目标网络不可达，已实测）。"
            exit 1
          fi
          CH="program-$PROGRAM_CHANNEL"
          # 回读锚 = 设备侧 OTA 配置的基址（随 APK 发的 assets/program-feed.json）。
          # 上传后的回读比对住在 scripts/upload-qiniu.js：没有它就不许打印「已更新」。
          export QINIU_PUBLIC_BASE="$(node -p "require('./container/app/src/main/assets/program-feed.json').baseUrl")"
          # manifest 短缓存（否则设备永远读到旧 manifest，表现为"发了没更新"）；
          # Program 包长缓存（文件名带版本号，内容不可变）。
          node scripts/upload-qiniu.js release/program-manifest.json "$CH/program-manifest.json" --cache-control=60
          node scripts/upload-qiniu.js "release/program-$PROGRAM_VER.zip" "$CH/program-$PROGRAM_VER.zip" --cache-control=31536000
          echo "[qiniu] 通道 $CH 已更新：$PROGRAM_VER"


