name: CI (gates)

# 统一门禁：容器引擎（契约/对账/原生资产/桥）+ 内核回归 + 面板前端。
# 单一事实源与红线见 docs/STORAGE-STANDARD.md、docs/runbook/testing-standard.md。
# 出包（APK/内核 OTA）不在这里，见 apk-fast / apk-full / kernel-ota。

on:
  push:
    branches: [main, master]
    tags: ['v*']
    paths:
      - 'container/**'
      - 'kernel/**'
      - 'docs/contracts/**'
      - 'scripts/**'
      - '.github/native-assets.txt'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'container/**'
      - 'kernel/**'
      - 'docs/contracts/**'
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch: {}

jobs:
  # ══════════════════════════════════════════════════════════════════════════
  # container：L0 引擎全量逻辑门禁（含契约对账 / 目录对账 / 分层依赖 / 原生资产单一事实源）
  # ══════════════════════════════════════════════════════════════════════════
  container:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: container/engine
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate workflow files (YAML)
        # 门禁流程自己也要能拦住"workflow 写坏"：解析失败时 GitHub 的表现是
        # **0 个 job**（看起来像"没触发"），所以必须在这里显式校验。
        working-directory: .
        run: python3 scripts/validate-workflows.py

      - name: Gate — native asset manifest is generated from the registry
        # 单一事实源：.github/native-assets.txt 必须等于生成器的输出。
        working-directory: .
        run: |
          set -euo pipefail
          node scripts/gen-native-assets.js
          git diff --exit-code -- .github/native-assets.txt

      - name: Validate cross-layer version sources
        # 各层版本的单一事实源必须齐全/合法；CI 同时把聚合清单打进日志供评审。
        # 刻意**不**生成进 git 的清单文件 —— 那会要求"本地先跑生成器"，违反 testing-standard 红线。
        working-directory: .
        run: |
          set -euo pipefail
          node scripts/gen-version.js --check
          node scripts/gen-version.js

      - name: Container engine tests (logic)
        run: |
          set -euo pipefail
          npm run test:logic 2>&1 | tee /tmp/engine-test.log
          echo
          echo "=== 容器引擎逻辑测试汇总 ==="
          echo "$(grep -c '^PASS' /tmp/engine-test.log || true) 个 PASS，$(grep -c '^FAIL' /tmp/engine-test.log || true) 个 FAIL"

  # ══════════════════════════════════════════════════════════════════════════
  # kernel：L1 内核回归（安卓路径）+ 面板前端门禁
  # ══════════════════════════════════════════════════════════════════════════
  kernel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kernel
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 把 npm 钉到设备上那份
        # 原生件供给门禁靠 `npm install --dry-run --os/--cpu` 造差集；runner 自带的 npm（setup-node 22
        # → 10.9.3）会**静默忽略**这两个配置，实测两份计划各 575 项、差集为空。版本来自供给表的
        # probe.npm.version（= 设备 node 24.21.0 捆绑的那份），门禁自己会再核对一次并当场红。
        run: |
          set -euo pipefail
          echo "runner 自带 npm: $(npm --version)"
          NPMV="$(node -p "require('./kernel/src/guard/native/supply-table.json').probe.npm.version")"
          npm install -g "npm@$NPMV"
          echo "探针用 npm: $(npm --version)"

      - name: 内核回归测试（安卓路径 · DSH_ANDROID=1）
        env:
          DSH_ANDROID: '1'
        run: npm test

      - name: 前端门禁（typecheck + lint + test + build）
        working-directory: kernel/ui
        run: |
          npm install --no-audit --no-fund
          npm run verify

      - name: 上传前端构建产物
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: kernel/ui/dist
          if-no-files-found: error

  # ══════════════════════════════════════════════════════════════════════════
  # kernel-release：tag 触发，把面板产物作为 OTA 资源挂到 Release（不发布 npm）
  # ══════════════════════════════════════════════════════════════════════════
  kernel-release:
    needs: kernel
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui-dist
      - name: 打包面板产物（OTA 资源）
        shell: bash
        run: |
          set -euo pipefail
          VER="$(node -p "require('./kernel/package.json').version")"
          echo "  版本: $VER"
          if [ -z "$(ls -A ui-dist 2>/dev/null)" ]; then
            echo "::error::未生成任何 UI 构建产物"; exit 1
          fi
          tar -czf "dsh-android-kernel-panel-$VER.tar.gz" -C ui-dist .
          ls -lh "dsh-android-kernel-panel-$VER.tar.gz"
      - name: 附加到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dsh-android-kernel-panel-*.tar.gz
          generate_release_notes: true

  # ══════════════════════════════════════════════════════════════════════════
  # app-tests：Android 侧 JVM 单元测试（纯逻辑，不需要模拟器）
  # ══════════════════════════════════════════════════════════════════════════
  # 为什么单独一个 job：它需要 JDK + Android SDK，比上面两个 Node job 重得多；
  # 但两者互不依赖 —— 并行跑，Node 侧仍能秒级给出快速反馈。
  #
  # 为什么必须有：内核下载器（ResumableDownloader）这类**纯 JVM 逻辑**此前完全没有夹具，
  # 「断点续传 / 416 / 提前断 / sha256 不符」这些分支只能靠真机碰运气。
  # 现在用 JUnit + JDK 自带的 com.sun.net.httpserver 起本地 HTTP 服务逐分支验证。
  #
  # 刻意**不**用第三方 setup-android action（实测它会装已不存在的 tools 包而失败，
  # 见 fast-apk.yml 的注释）；runner 自带的 Android SDK 够用。
  app-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install SDK packages
        run: |
          set -o pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --version 2>&1 | tail -1
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" 2>&1 | tail -3

      - name: 单元测试（:app:testDebugUnitTest）
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest
          # BUILD SUCCESSFUL 不等于「跑了测试」：一个测试都没匹配上时 Gradle 照样绿。
          # 因此从 XML 结果实名核对执行计数与本波新增的判据用例，改名/删测试必须连同这里一起改。
          RES="container/app/build/test-results/testDebugUnitTest"
          ls "$RES"/*.xml >/dev/null || { echo "FAIL: 没有任何单测结果 XML（$RES）"; exit 1; }
          TOTAL=$(grep -ho 'tests="[0-9]*"' "$RES"/*.xml | grep -o '[0-9]\+' | awk '{s+=$1} END {print s+0}')
          echo "单测执行数：$TOTAL"
          [ "$TOTAL" -ge 8 ] || { echo "FAIL: 单测执行数 $TOTAL 低于地板 8，说明测试被静默跳过"; exit 1; }
          for T in 保活锚从登记表推导_不是手写第二张清单 冲刺首项必须是必要项_其余不得挡在前面 需要人点的待选项仍然要问; do
            grep -rq "$T" "$RES" || { echo "FAIL: 单测「$T」没有执行记录"; exit 1; }
          done

      - name: 上传测试报告（仅失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-unit-test-report
          path: container/app/build/reports/tests/
          if-no-files-found: ignore
