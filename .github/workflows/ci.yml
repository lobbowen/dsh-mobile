name: CI (gates)

# 统一门禁：容器引擎（契约/对账/原生资产/桥）+ 内核回归 + 面板前端。
# 单一事实源与红线见 docs/STORAGE-STANDARD.md、docs/runbook/testing-standard.md。
# 出包（APK/内核 OTA）不在这里，见 apk-fast / apk-full / kernel-ota。

on:
  push:
    branches: [main, master]
    tags: ['v*']
    paths:
      - 'container/**'
      - 'kernel/**'
      - 'docs/contracts/**'
      - 'scripts/**'
      - '.github/native-assets.txt'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'container/**'
      - 'kernel/**'
      - 'docs/contracts/**'
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch: {}

jobs:
  # ══════════════════════════════════════════════════════════════════════════
  # container：L0 引擎全量逻辑门禁（含契约对账 / 目录对账 / 分层依赖 / 原生资产单一事实源）
  # ══════════════════════════════════════════════════════════════════════════
  container:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: container/engine
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Gate — native asset manifest is generated from the registry
        # 单一事实源：.github/native-assets.txt 必须等于生成器的输出。
        working-directory: .
        run: |
          set -euo pipefail
          node scripts/gen-native-assets.js
          git diff --exit-code -- .github/native-assets.txt

      - name: Validate cross-layer version sources
        # 各层版本的单一事实源必须齐全/合法；CI 同时把聚合清单打进日志供评审。
        # 刻意**不**生成进 git 的清单文件 —— 那会要求"本地先跑生成器"，违反 testing-standard 红线。
        working-directory: .
        run: |
          set -euo pipefail
          node scripts/gen-version.js --check
          node scripts/gen-version.js

      - name: Container engine tests (logic)
        run: |
          set -euo pipefail
          npm run test:logic 2>&1 | tee /tmp/engine-test.log
          echo
          echo "=== 容器引擎逻辑测试汇总 ==="
          echo "$(grep -c '^PASS' /tmp/engine-test.log || true) 个 PASS，$(grep -c '^FAIL' /tmp/engine-test.log || true) 个 FAIL"

  # ══════════════════════════════════════════════════════════════════════════
  # kernel：L1 内核回归（安卓路径）+ 面板前端门禁
  # ══════════════════════════════════════════════════════════════════════════
  kernel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kernel
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 内核回归测试（安卓路径 · DSH_ANDROID=1）
        env:
          DSH_ANDROID: '1'
        run: npm test

      - name: 前端门禁（typecheck + lint + test + build）
        working-directory: kernel/ui
        run: |
          npm install --no-audit --no-fund
          npm run verify

      - name: 上传前端构建产物
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: kernel/ui/dist
          if-no-files-found: error

  # ══════════════════════════════════════════════════════════════════════════
  # kernel-release：tag 触发，把面板产物作为 OTA 资源挂到 Release（不发布 npm）
  # ══════════════════════════════════════════════════════════════════════════
  kernel-release:
    needs: kernel
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui-dist
      - name: 打包面板产物（OTA 资源）
        shell: bash
        run: |
          set -euo pipefail
          VER="$(node -p "require('./kernel/package.json').version")"
          echo "  版本: $VER"
          if [ -z "$(ls -A ui-dist 2>/dev/null)" ]; then
            echo "::error::未生成任何 UI 构建产物"; exit 1
          fi
          tar -czf "dsh-android-kernel-panel-$VER.tar.gz" -C ui-dist .
          ls -lh "dsh-android-kernel-panel-$VER.tar.gz"
      - name: 附加到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dsh-android-kernel-panel-*.tar.gz
          generate_release_notes: true
