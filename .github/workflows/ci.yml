name: CI (gates)

# 统一门禁：容器引擎（契约/对账/原生资产/桥）+ Program 回归 + 面板前端。
# 单一事实源与红线见 docs/standards/storage.md、docs/standards/testing.md。
# 出包（APK/Program OTA）不在这里，见 fast-apk / build-apk / program-ota。

on:
  push:
    branches: [main, master]
    tags: ['v*']
    paths:
      - 'container/**'
      - 'programs/**'
      - '.github/gate-policy.json'
      - 'THIRD-PARTY.md'
      - 'scripts/gate-scan.js'
      # doc-gate 扫的是**全部** docs（死链、旧身份措辞、判据表归口），debt-gate 读 docs/plans 债表；
      # 白名单只写 docs/contracts/** 等于「改了 ADR/runbook/债表不必过门」，与门禁实际覆盖面不符。
      - 'docs/**'
      - 'scripts/**'
      - '.github/native-assets.txt'
      - '.github/workflows/**'
      # version.json 是壳分发身份的单一事实源（versionName / versionCode / bridgeProtocol），
      # 也是 container job 里 gen-version.js --check 的输入。它原先不在白名单 —— 于是
      # 「只改版本清单」的提交触发不了任何 CI，那道对账变成"只在别的文件碰巧改动时才跑"。
      - 'version.json'
  pull_request:
    paths:
      - 'container/**'
      - 'programs/**'
      - 'docs/**'
      - 'scripts/**'
      # 与 push 侧**逐字对称**（同上条理由）：gate-policy.json 是禁词门唯一的**输入**，
      # 只改它就能让一条规则从能红变成空转 —— PR 侧不触发等于「尺子被改短」没人查。
      - '.github/gate-policy.json'
      - 'THIRD-PARTY.md'
      # 与上面 push 的清单**必须对称**：.github/native-assets.txt 是 NativeAssetRegistry 的投影，
      # container job 会重跑 gen-native-assets.js 并 `git diff --exit-code` 它。只改这一份清单的 PR
      # 若被 paths 挡在门外，等于「线上下载清单被人改错」这条路只能等合进 main 才第一次被检查。
      - '.github/native-assets.txt'
      - '.github/workflows/**'
      # 与上面 push 的清单**保持逐字对称**（本文件注释已要求两侧一致）。
      - 'version.json'
  workflow_dispatch: {}

jobs:

  # ══════════════════════════════════════════════════════════════════════════
  # gate：命名/品牌/结构门禁（Lob OS）
  #   gate-scan 已是强制模式（.github/gate-policy.json enforce=true）；doc-gate / debt-gate 目前为**报告模式**，
  #   收口后可用 --strict 转强制。三份报告随 artifact 上传。
  # ══════════════════════════════════════════════════════════════════════════
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gate — naming/brand/structure scan
        run: node scripts/gate-scan.js
      - name: Gate — docs links + file:line citations (strict)
        # 死链一直强制。引用核验（债表 AUD-G48）：反引号里的代码文件必须真实存在、`:NN` 不许越界。
        # 转强制只圈**规范面**（contracts/standards/runbook/README，范围住在 gate-policy.citations）：
        # 本次接入时那一面存量=0，红只可能来自新写的假引用。ADR 与迁移对照表指名旧模块是历史证据，
        # 扫进强制只会逼人改写记录，所以那部分数字留在报告里（doc-gate-report.txt）。
        run: node scripts/doc-gate.js --strict --strict-cites
      - name: Gate — debt registry (report mode)
        run: node scripts/debt-gate.js
      - name: Gate — delivery surface read from CDN (strict)
        # 交付面门禁：输入是**线上读数**，不是仓内镜像。此前所有门禁读的都是我们自己写的文件，
        # 于是「仓内已改名」与「线上仍是废止身份」能同时为真而无人变红（债 INT8/INT16/EXEC-G1）。
        # 2026-09-29 收口：E3.1 真投放跑通后接入 —— 三处声明键（C 清单 + 其签名 + Program 清单）
        # 必须现读 200、version 读得出来、内容不含废止身份词。读不到就是红，不解释成「还没发而已」。
        run: node scripts/delivery-gate.js
      - name: Upload gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-reports
          path: |
            brand-scan-report.txt
            doc-gate-report.txt
            debt-gate-report.txt
          if-no-files-found: ignore
  # ══════════════════════════════════════════════════════════════════════════
  # container：L0 引擎全量逻辑门禁（含契约对账 / 目录对账 / 分层依赖 / 原生资产单一事实源）
  # ══════════════════════════════════════════════════════════════════════════
  container:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: container/engine
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate workflow files (YAML)
        # 门禁流程自己也要能拦住"workflow 写坏"：解析失败时 GitHub 的表现是
        # **0 个 job**（看起来像"没触发"），所以必须在这里显式校验。
        # 判据用严格版唯一宿主（重复 key / on.push 覆盖 / 事件名白名单…），
        # 与 fast-apk / build-apk 同源 —— 宽松 safe_load 那份已删。
        working-directory: .
        run: python3 scripts/validate-workflow.py

      - name: Gate — native asset manifests are generated from the registry
        # 单一事实源：.github/native-assets.txt（大件）与 .github/native-capabilities.txt
        # （小件能力件，含失败语义档位）都必须逐字等于生成器的输出 —— 两份都是
        # NativeAssetRegistry.kt 的投影，手改必红。
        working-directory: .
        run: |
          set -euo pipefail
          node scripts/gen-native-assets.js
          git diff --exit-code -- .github/native-assets.txt .github/native-capabilities.txt

      - name: Validate cross-layer version sources
        # 各层版本的单一事实源必须齐全/合法；CI 同时把聚合清单打进日志供评审。
        # 刻意**不**生成进 git 的清单文件 —— 那会要求"本地先跑生成器"，违反 testing-standard 红线。
        working-directory: .
        run: |
          set -euo pipefail
          node scripts/gen-version.js --check
          node scripts/gen-version.js

      - name: Container engine tests (logic)
        run: |
          set -euo pipefail
          # 步骤体唯一宿主：scripts/run-engine-tests.sh —— 它内含「先装 readelf/openssl、
          # 不许因缺工具而跳过测试」的纪律。此前本文件与 build-apk.yml 各写一份，
          # 且 build-apk 那份漏装了工具，已收口到一处。
          bash ../../scripts/run-engine-tests.sh

  # ══════════════════════════════════════════════════════════════════════════
  # console：console Program 回归（安卓路径）+ 面板前端门禁
  # ══════════════════════════════════════════════════════════════════════════
  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: programs/console
    steps:
      - uses: actions/checkout@v4

      - name: 读设备那份 node 版本
        id: device-node
        # 原生件供给门禁要答「设备上 npm 会装出什么」，而 npm 的 engines 检查吃的是 process.version，
        # 所以本 Program job 的 node 必须与设备同源。版本事实源是 assets/node-versions.json 的 default
        # （fast-apk 出包时读同一格）；读取口唯一：scripts/read-node-versions.sh。
        # 门禁会核对现场 process.version 并当场红。
        working-directory: .
        run: |
          V="$(bash scripts/read-node-versions.sh default)"
          echo "设备 node = $V"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.device-node.outputs.version }}

      - name: 把 npm 钉到设备上那份
        # 设备上的 npm 与 runner 上跑探针的 npm 必须同源，否则「装出来的计划」是两个宇宙的：
        # npm 的 engines 检查吃 process.version，而 runner 自带 npm 10 会**静默忽略** --os/--cpu
        # （实测两份计划各 575 项、两侧差集皆空 —— 静默 ≠ 正确）。
        # 版本事实源唯一：assets/node-versions.json 的 npm 字段，读取口唯一：
        # scripts/read-node-versions.sh（build-userland-npm.sh 出 C 层那颗时读的就是同一格）。
        # 路径按**仓根**读，因为本 job 默认工作目录是 programs/console。
        working-directory: .
        run: |
          set -euo pipefail
          echo "runner 自带 npm: $(npm --version)"
          NPMV="$(bash scripts/read-node-versions.sh npm)"
          npm install -g "npm@$NPMV"
          echo "探针用 npm: $(npm --version)"

      - name: Program 回归测试（安卓路径 · LOBOS_ANDROID=1）
        env:
          LOBOS_ANDROID: '1'
        run: npm test

      - name: 前端门禁（typecheck + lint + test + build）
        working-directory: programs/console/ui
        run: |
          npm ci --no-audit --no-fund
          npm run verify

      - name: 上传前端构建产物
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: programs/console/ui/dist
          if-no-files-found: error

  # ══════════════════════════════════════════════════════════════════════════
  # console-release：tag 触发，把面板产物作为 OTA 资源挂到 Release（不发布 npm）
  # ══════════════════════════════════════════════════════════════════════════
  console-release:
    needs: console
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui-dist
      - name: 打包面板产物（OTA 资源）
        shell: bash
        run: |
          set -euo pipefail
          VER="$(node -p "require('./programs/console/package.json').version")"
          echo "  版本: $VER"
          if [ -z "$(ls -A ui-dist 2>/dev/null)" ]; then
            echo "::error::未生成任何 UI 构建产物"; exit 1
          fi
          tar -czf "lobos-console-panel-$VER.tar.gz" -C ui-dist .
          ls -lh "lobos-console-panel-$VER.tar.gz"
      - name: 附加到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: lobos-console-panel-*.tar.gz
          generate_release_notes: true

  # ══════════════════════════════════════════════════════════════════════════
  # app-tests：Android 侧 JVM 单元测试（纯逻辑，不需要模拟器）
  # ══════════════════════════════════════════════════════════════════════════
  # 为什么单独一个 job：它需要 JDK + Android SDK，比上面两个 Node job 重得多；
  # 但两者互不依赖 —— 并行跑，Node 侧仍能秒级给出快速反馈。
  #
  # 为什么必须有：Program 下载器（ResumableDownloader）这类**纯 JVM 逻辑**此前完全没有夹具，
  # 「断点续传 / 416 / 提前断 / sha256 不符」这些分支只能靠真机碰运气。
  # 现在用 JUnit + JDK 自带的 com.sun.net.httpserver 起本地 HTTP 服务逐分支验证。
  #
  # 刻意**不**用第三方 setup-android action（实测它会装已不存在的 tools 包而失败，
  # 见 fast-apk.yml 的注释）；runner 自带的 Android SDK 够用。
  app-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install SDK packages
        run: |
          set -o pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --version 2>&1 | tail -1
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" 2>&1 | tail -3

      - name: 单元测试（:app:testDebugUnitTest）
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest
          # BUILD SUCCESSFUL 不等于「跑了测试」：一个测试都没匹配上时 Gradle 照样绿。
          # 因此从 XML 结果实名核对执行计数与**已定罪的判据用例**；清单见 .github/convicted-cases.txt。
          RES="container/app/build/test-results/testDebugUnitTest"
          ls "$RES"/*.xml >/dev/null || { echo "FAIL: 没有任何单测结果 XML（$RES）"; exit 1; }
          TOTAL=$(grep -ho 'tests="[0-9]*"' "$RES"/*.xml | grep -o '[0-9]\+' | awk '{s+=$1} END {print s+0}')
          echo "单测执行数：$TOTAL"
          # 定罪用例清单是**数据**（.github/convicted-cases.txt），不写在本文件里。
          # 加一条定罪用例 = 往清单加一行；改名/删测试会让下面这圈立刻红（判据不许静默消失）。
          CASES=.github/convicted-cases.txt
          FLOOR=$(grep -vE '^[[:space:]]*(#|$)' "$CASES" | wc -l)
          [ "$TOTAL" -ge "$FLOOR" ] || { echo "FAIL: 单测执行数 $TOTAL 低于地板 $FLOOR（= 定罪清单条目数），说明测试被静默跳过"; exit 1; }
          while IFS= read -r T; do
            case "$T" in ''|'#'*) continue ;; esac
            grep -rq -- "$T" "$RES" || { echo "FAIL: 单测「$T」没有执行记录"; exit 1; }
          done < "$CASES"

      - name: 上传测试报告（仅失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-unit-test-report
          path: container/app/build/reports/tests/
          if-no-files-found: ignore
