name: Build Userland (C 层工具供给)

# C 层（共享开发环境）里「上游没有 android 变体」的工具：由本仓交叉编译成 **动态链接** 的
# bionic aarch64 产物，发到对象存储；再由本 workflow 的 manifest 作业汇成 **C 自己的内容清单**
# （对原始字节签名）发到对象存储。
#
# 内核只持有 **通道锚 + 信任根**，按清单取件并核验 —— 因此**加件/升级只发清单，内核不动**；
# 工具随内核启动投放上机，**不需要重装 APK**。
#
# 为什么必须动态：容器全部 Linux 语义（link(2)/tmp/祖先目录）靠 libdshposix 经 LD_PRELOAD 落地，
# 静态件会绕过整层（2026-09-27 对 bash/rg 的真机定罪）。verify-artifact 把这条钉住。

on:
  workflow_dispatch:
    inputs:
      publish:
        description: '发布到对象存储（设备真正读的那条）'
        type: string
        default: 'false'
      channel:
        description: 'C 的通道（清单与件都挂在 userland-<channel>/ 下）'
        type: string
        default: 'canary'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-userland.yml'
      - 'scripts/build-userland-*.sh'
      - 'scripts/verify-userland-artifact.sh'
      - 'scripts/package-userland.sh'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # C 层工具供给批次：逐件补齐。已供给的追加到这一行即可。
        tool: [sqlite3, jq, git, curl]
    steps:
      - uses: actions/checkout@v4
      - name: 定位 NDK
        run: |
          set -euo pipefail
          NDK="${ANDROID_NDK_LATEST_HOME:-}"
          [ -d "$NDK" ] || { echo "::error title=无 NDK::runner 上没有 ANDROID_NDK_LATEST_HOME"; exit 1; }
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          [ -x "$TC/aarch64-linux-android21-clang" ] || { echo "::error title=无 clang::缺 $TC/aarch64-linux-android21-clang"; exit 1; }
          { echo "CC=$TC/aarch64-linux-android21-clang"; echo "LLVM_STRIP=$TC/llvm-strip"; } >> "$GITHUB_ENV"
      - name: 编译 ${{ matrix.tool }}
        run: bash scripts/build-userland-${{ matrix.tool }}.sh
      - name: 核对产物形态（aarch64 + 动态）
        run: bash scripts/verify-userland-artifact.sh ${{ matrix.tool }}
      - name: 打包 + sha256
        run: bash scripts/package-userland.sh ${{ matrix.tool }}
      - uses: actions/upload-artifact@v4
        with:
          name: userland-${{ matrix.tool }}
          path: dist/
      - name: 发布到对象存储（设备真正读的那条）
        if: ${{ github.event.inputs.publish == 'true' }}
        env:
          QINIU_AK: ${{ secrets.QINIU_AK }}
          QINIU_SK: ${{ secrets.QINIU_SK }}
          QINIU_BUCKET: ${{ secrets.QINIU_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "${QINIU_AK:-}" ] || [ -z "${QINIU_SK:-}" ] || [ -z "${QINIU_BUCKET:-}" ]; then
            echo "::error title=对象存储未配置::需要 secrets QINIU_AK / QINIU_SK / QINIU_BUCKET（GitHub 在目标网络不可达，设备只从对象存储取件）"
            exit 1
          fi
          for f in dist/*.zip; do
            B=$(basename "$f")
            node scripts/upload-qiniu.js "$f" "userland/$B" --cache-control=31536000
          done
          echo "[qiniu] userland/${{ matrix.tool }} 已发布"
      # 刻意**不**归档到 GitHub Release：设备读的是对象存储（GitHub 在目标网络不可达），归档没有投递价值；
      # 而 gh-release-upload.sh 在本仓被钉死为「只许五条链路调用」（门禁在册），多一条就是第六个调用方 ——
      # 与其为一个无投递价值的动作去改那条不变量，不如不做。产物由 actions/upload-artifact 留存。

  # C 的**内容清单**：把本次构建的件 + 外部件（npm 投放那类）汇成一份、对**原始字节**签名、
  # 发到对象存储。内核只持通道锚 + 信任根，于是加件/升级只发清单 —— **内核不动**。
  manifest:
    needs: build
    if: ${{ github.event.inputs.publish == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 组装并签名清单（发前用 APK 焊死的公钥自检）
        env:
          OTA_PRIVATE_KEY_PEM: ${{ secrets.OTA_PRIVATE_KEY_PEM }}
        run: |
          set -euo pipefail
          if [ -z "${OTA_PRIVATE_KEY_PEM:-}" ]; then
            echo "::error title=签名私钥未配置::需要 secrets.OTA_PRIVATE_KEY_PEM（与内核 OTA 同一把，公钥焊在 APK）"
            exit 1
          fi
          mkdir -p keys release
          printf '%s' "$OTA_PRIVATE_KEY_PEM" > keys/ota-private.pem
          chmod 600 keys/ota-private.pem
          node scripts/publish-userland-manifest.js dist release keys/ota-private.pem "${{ github.event.inputs.channel || 'canary' }}"
      - name: 发布清单到对象存储
        env:
          QINIU_AK: ${{ secrets.QINIU_AK }}
          QINIU_SK: ${{ secrets.QINIU_SK }}
          QINIU_BUCKET: ${{ secrets.QINIU_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "${QINIU_AK:-}" ] || [ -z "${QINIU_SK:-}" ] || [ -z "${QINIU_BUCKET:-}" ]; then
            echo "::error title=对象存储未配置::需要 secrets QINIU_AK / QINIU_SK / QINIU_BUCKET"
            exit 1
          fi
          CH="userland-${{ github.event.inputs.channel || 'canary' }}"
          # 清单对象键与 APK 里 assets/supply/channel.json 的 manifestName **必须一致**（锚驱动）。
          #   换键的理由见该文件 $comment：旧键被长 TTL 缓存钉死，新上传不作废旧条目。
          MAN=$(node -e "console.log(require('./container/app/src/main/assets/supply/channel.json').manifestName)")
          SIG=$(node -e "console.log(require('./container/app/src/main/assets/supply/channel.json').sigName)")
          # 清单短缓存（否则设备永远读到旧的，表现为「发了没更新」）；件本体长缓存（文件名带版本号）。
          echo "[qiniu] 目标键: $CH/$MAN 与 $CH/$SIG"
          node scripts/upload-qiniu.js release/userland-manifest.json "$CH/$MAN" --cache-control=60
          node scripts/upload-qiniu.js release/userland-manifest.json.sig "$CH/$SIG" --cache-control=60
          # CI 自证：上传后立刻从 CDN 回读该键 —— 区分「传上去了但 CDN 不认」与「没传到那个键」。
          BASE2="${USERLAND_BASE_URL:-https://hubcdn.zll.ink}"
          BASE2="${BASE2%/}"
          CODE=$(curl -s -o /tmp/m.json -w "%{http_code}" "$BASE2/$CH/$MAN?ts=$(date +%s)")
          echo "[readback] $BASE2/$CH/$MAN → HTTP $CODE"
          if [ "$CODE" = "200" ]; then node -e "const j=require('/tmp/m.json'); console.log('[readback] version=' + j.version + ' tools=' + j.tools.length)"; else echo "[readback] 内容前 200 字节: $(head -c 200 /tmp/m.json)"; fi
          echo "[qiniu] $CH 已更新"
