name: Build Userland (C 层工具供给)

# C 层（共享开发环境）的工具：由本仓产出 **动态链接** 的 bionic aarch64 件，发到对象存储；
# 再由本 workflow 的 manifest 作业汇成 **C 自己的内容清单**（对原始字节签名）发到对象存储。
# 三类件走同一条出口：上游没有 android 变体的（sqlite3/jq/git/curl）在本仓交叉编译；上游已发
# android 变体的（pnpm）只取不编；上游只发 JS 的（npm）取 tarball、剪掉本容器跑不动的面后整棵树投放。
# **都必须经打包投到对象存储**，设备取件的唯一口就是它（目标网络到不了 GitHub 与 npm registry），
# 所以不存在「只在清单里声明上游包名」的供给形状。
#
# Program 只持有 **通道锚 + 信任根**，按清单取件并核验 —— 因此**加件/升级只发清单，Program 不动**；
# 工具随 Program 启动投放上机，**不需要重装 APK**。
#
# 为什么原生件必须动态：容器全部 Linux 语义（link(2)/tmp/祖先目录）靠 liblobosposix 经 LD_PRELOAD 落地，
# 静态件会绕过整层（2026-09-27 对 bash/rg 的真机定罪）。verify-artifact 把这条钉住。
# 另一类允许形状是 shebang 脚本（解释器按调用方 PATH 由 D1 兑现）—— 同一把尺子的两个分支，
# 判据只在 scripts/verify-userland-artifact.sh 一处，入口路径由 scripts/userland-verify.json 声明。
#
# ── C 层的唯一发布链（docs/adr/0011）────────────────────────────────────────
# **发哪一版写在 ref 名里**：推 tag `userland-<channel>-<revision>` 才投递，revision 是正整数。
# 旧形状是一个 `publish` 布尔输入 + 一个 `channel` 输入 —— 那等于「任何一次 dispatch 都能发，
# 而发出去的东西没有身份」：同一份内容可以被点两次、两次结果不同，事后说不出发的是哪一次。
# 现在一条链只有三种轮：
#   · `push: tags: userland-*`   → 构建 + 闸门 + 投件 + 投清单 + 与线上对账
#   · `push: main`（paths 命中） → 只构建校验，并拿线上清单对账 ⇒ **改了声明却没发就是这道红**（ENV-26）
#   · `workflow_dispatch`        → 只构建校验（与 push 校验轮同一条路，点它不会发东西）
# `revision` 落进清单的 `revision` 格：它是 C 层唯一的单调判据，也是发布前那道闸（--immutable）
# 唯一比的那一格。设备侧只读 tools[].name/url/sha256/entry/aliases（SupplyProvisioner），
# 所以加这一格对壳与 Program 都是中性的 —— 归一发布连不需要动上机的代码。

on:
  # ⚠️ 一个 workflow 的 on.push 只能出现【一次】：写成两个 push: 块时后一个会在 YAML 里覆盖前一个，
  #    触发条件变得不可预期（fast-apk.yml 踩过这条坑，注释还在）。所有 push 条件合进同一个块。
  push:
    # 校验轮：改了「声明怎么算」或「设备读哪两个键」却没发清单，就是下面 drift 那道红。
    branches: [main]
    paths:
      - '.github/workflows/build-userland.yml'
      - 'scripts/build-userland-*.sh'
      - 'scripts/verify-userland-artifact.sh'
      - 'scripts/package-userland.sh'
      # 清单发布器与它读的那格入口（2026-09-30 定罪 ENV-26）：aliases 的读写代码合进了 main，
      #   但这两个文件不在 paths 里 ⇒ **没有任何 job 会因为「声明怎么算」变了而动**，线上清单停在
      #   旧格上、CI 全绿、设备上 npx 调不到。改发布器必须重跑，配合下面的 drift 才算真能红。
      - 'scripts/publish-userland-manifest.js'
      - 'scripts/read-userland-entry.sh'
      - 'scripts/check-userland-manifest-drift.js'
      # 钉值表与唯一的取数口（2026-10-01 定罪）：**改了「用哪批源码」就等于改了件的字节**，
      #   而件不可复现时线上清单与仓内声明会从此指向两批源码 ⇒ drift 必红。这两颗不在 paths 里
      #   就是 ENV-26 那个形状的另一个宿主：改了声明、CI 全绿、线上没人重发。
      - 'scripts/userland-sources.json'
      - 'scripts/fetch-pinned.sh'
      # 这份声明同时决定**入口路径**（形状门禁判哪颗）与随件下发的能力判据：改它却不重跑构建，
      #   就是「仓内声明」与「线上件」再次分家的入口（与下面 channel.json 同一条教训）。
      - 'scripts/userland-verify.json'
      # 设备读的是**这两个文件声明的对象键**。键改了却不触发任何东西，就是「仓内声明」与
      # 「线上内容」变成两个宇宙的入口（2026-09-29 定罪 D02：新键声明后从未投过）。
      - 'container/app/src/main/assets/supply/channel.json'
      - 'container/app/src/main/assets/program-feed.json'
    # 发布轮。**官方语义：Path filters are not evaluated for pushes of tags** ⇒ tag 轮完全不受
    #   上面 paths 的影响。这条对本链是必需的，不是便利：清单带着 expiresEpochMs TTL，到期就要
    #   重签重投，而那一轮常常一个文件都没改 —— 若 paths 也管 tag，「重发一份救命清单」这件事
    #   根本点不动，判据兑现不了（docs/adr/0011）。
    tags:
      - 'userland-*'
  # 只构建校验。刻意【不】留任何「要不要发」的输入：投递只由 tag 名决定（见文件头）。
  workflow_dispatch:

# 同一个 ref 上只允许一个在跑：交叉编译六个工具是要抢机器的。
concurrency:
  group: build-userland-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # 通道与版本号**只在这一处**从 ref 名里解出来，下面的 job 全读它的 outputs。
  # 理由与其余三条链一致：两处各自解析同一个 ref，就可能对同一个 tag 给出两个结论。
  resolve:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.ref.outputs.channel }}
      revision: ${{ steps.ref.outputs.revision }}
      publish: ${{ steps.ref.outputs.publish }}
    steps:
      - name: 解出本轮的通道与清单版本号
        id: ref
        run: |
          set -euo pipefail
          # 通道集合与 program-ota.yml 的 channel 选项一致：canary / stable。
          if [[ "${GITHUB_REF_NAME}" =~ ^userland-(canary|stable)-([1-9][0-9]*)$ ]]; then
            echo "发布轮：ref=${GITHUB_REF_NAME} → 通道 ${BASH_REMATCH[1]}，清单 revision ${BASH_REMATCH[2]}"
            { echo "channel=${BASH_REMATCH[1]}"; echo "revision=${BASH_REMATCH[2]}"; echo "publish=true"; } >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/userland-* ]]; then
            # 走到这里就是 `userland-*` 被上面的 tag 过滤器放进来、但形状不合格。
            # 必须判红而不是退回校验轮：tag 名就是发布凭据，认不出它就不能当「没想发」。
            echo "::error title=发布 tag 的形状非法::${GITHUB_REF_NAME} —— 要形如 userland-<channel>-<revision>，" \
              && echo "::error::channel 取 canary|stable，revision 取正整数（它落进清单的 revision 格，是 C 层唯一的单调判据）。本次不投递。"
            exit 1
          else
            echo "channel=canary" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "[resolve] 校验轮（ref=${GITHUB_REF}）：只构建与对账，不投递"
          fi

  build:
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # C 层工具供给批次：逐件补齐。已供给的追加到这一行即可。
        tool: [sqlite3, jq, git, curl, pnpm, npm]
    steps:
      - uses: actions/checkout@v4
      - name: 定位 NDK
        run: |
          set -euo pipefail
          NDK="${ANDROID_NDK_LATEST_HOME:-}"
          [ -d "$NDK" ] || { echo "::error title=无 NDK::runner 上没有 ANDROID_NDK_LATEST_HOME"; exit 1; }
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          [ -x "$TC/aarch64-linux-android21-clang" ] || { echo "::error title=无 clang::缺 $TC/aarch64-linux-android21-clang"; exit 1; }
          { echo "CC=$TC/aarch64-linux-android21-clang"; echo "LLVM_STRIP=$TC/llvm-strip"; } >> "$GITHUB_ENV"
      - name: 产出 ${{ matrix.tool }} 件
        run: bash scripts/build-userland-${{ matrix.tool }}.sh
      - name: 核对产物形态（ELF=aarch64+动态，或 shebang 脚本按 PATH 兑现）
        run: bash scripts/verify-userland-artifact.sh ${{ matrix.tool }}
      - name: 打包 + sha256
        run: bash scripts/package-userland.sh ${{ matrix.tool }}
      - uses: actions/upload-artifact@v4
        with:
          name: userland-${{ matrix.tool }}
          path: dist/
          # 下游组装步只读【本轮】的件（download-artifact 不带 name 即本 run 全量），
          # 设备侧真正读的供给走七牛 —— 跨 run 的这份没有任何读者。
          # 留一天只为事后取证，此前不设上限=默认 90 天，四个工具轮轮叠加。
          retention-days: 1
      - name: 发布到对象存储（设备真正读的那条）
        if: ${{ needs.resolve.outputs.publish == 'true' }}
        env:
          QINIU_AK: ${{ secrets.QINIU_AK }}
          QINIU_SK: ${{ secrets.QINIU_SK }}
          QINIU_BUCKET: ${{ secrets.QINIU_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "${QINIU_AK:-}" ] || [ -z "${QINIU_SK:-}" ] || [ -z "${QINIU_BUCKET:-}" ]; then
            echo "::error title=对象存储未配置::需要 secrets QINIU_AK / QINIU_SK / QINIU_BUCKET（GitHub 在目标网络不可达，设备只从对象存储取件）"
            exit 1
          fi
          for f in dist/*.zip; do
            B=$(basename "$f")
            # 回读锚取自 APK 随包的 channel.json（设备侧读的就是它）：另写一个域名就是第二个事实源。
            QINIU_PUBLIC_BASE="$(node -p "JSON.parse(require('fs').readFileSync('container/app/src/main/assets/supply/channel.json','utf8')).baseUrl")" \
            node scripts/upload-qiniu.js "$f" "userland/$B" --cache-control=31536000
          done
          echo "[qiniu] userland/${{ matrix.tool }} 已发布"
      # 刻意**不**归档到 GitHub Release：设备读的是对象存储（GitHub 在目标网络不可达），归档没有投递价值；
      # 而 gh-release-upload.sh 在本仓被钉死为「只许少数链路调用」（门禁在册），多一条就是又一个调用方 ——
      # 与其为一个无投递价值的动作去改那条不变量，不如不做。产物由 actions/upload-artifact 留存。

  # C 的**内容清单**：把本轮构建出的件汇成一份、对**原始字节**签名、
  # 发到对象存储。Program 只持通道锚 + 信任根，于是加件/升级只发清单 —— **Program 不动**。
  manifest:
    needs: [resolve, build]
    if: ${{ needs.resolve.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 组装并签名清单（发前用 APK 焊死的公钥自检）
        env:
          OTA_PRIVATE_KEY_PEM: ${{ secrets.OTA_PRIVATE_KEY_PEM }}
          LOBOS_USERLAND_REVISION: ${{ needs.resolve.outputs.revision }}
        run: |
          set -euo pipefail
          if [ -z "${OTA_PRIVATE_KEY_PEM:-}" ]; then
            echo "::error title=签名私钥未配置::需要 secrets.OTA_PRIVATE_KEY_PEM（与 Program OTA 同一把，公钥焊在 APK）"
            exit 1
          fi
          mkdir -p keys release
          printf '%s' "$OTA_PRIVATE_KEY_PEM" > keys/ota-private.pem
          chmod 600 keys/ota-private.pem
          # revision 从 tag 经 outputs 到这里，中间没有缺省值：不填就抛错，「不写版本号也能发」这条路被封。
          node scripts/publish-userland-manifest.js dist release keys/ota-private.pem "${{ needs.resolve.outputs.channel }}"
      - name: 发布前闸门 —— revision 必须严格单调，同 name@version 不许换字节
        run: |
          set -euo pipefail
          # 为什么排在上传之前：这一格判的是「即将发出去的这份清单能不能被发」，
          # 发完再红就等于已经把设备指向了没有身份的内容。
          # 顺序上的已知缺口：件本体在 build 轮已经投出去了，所以本步判红时对象存储上
          # 可能已存在被覆盖的旧 URL —— 这不是本步能撤销的动作，它的职责是**不再让清单把
          # 这份覆盖合法化**，并把缺口留在 CI 上看得见（同号重发的正确处置是提升件的版本）。
          node scripts/check-userland-manifest-drift.js --immutable release/userland-manifest.json "${{ needs.resolve.outputs.channel }}"
      - name: 发布清单到对象存储
        env:
          QINIU_AK: ${{ secrets.QINIU_AK }}
          QINIU_SK: ${{ secrets.QINIU_SK }}
          QINIU_BUCKET: ${{ secrets.QINIU_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "${QINIU_AK:-}" ] || [ -z "${QINIU_SK:-}" ] || [ -z "${QINIU_BUCKET:-}" ]; then
            echo "::error title=对象存储未配置::需要 secrets QINIU_AK / QINIU_SK / QINIU_BUCKET"
            exit 1
          fi
          CH="userland-${{ needs.resolve.outputs.channel }}"
          # 清单对象键与 APK 里 assets/supply/channel.json 的 manifestName **必须一致**（锚驱动）。
          #   换键的理由见该文件 $comment：旧键被长 TTL 缓存钉死，新上传不作废旧条目。
          ANCHOR=./container/app/src/main/assets/supply/channel.json
          MAN=$(node -p "require('$ANCHOR').manifestName")
          SIG=$(node -p "require('$ANCHOR').sigName")
          # 回读锚与件表同源。这里【不再】自己 curl 自证：原先那段只打印不判红，
          # 线上 404 也照样走到「已更新」；现在每个键的回读比对住在 scripts/upload-qiniu.js，
          # 对不上就退 1，两条投放口（件与清单）都躲不过。
          export QINIU_PUBLIC_BASE="$(node -p "require('$ANCHOR').baseUrl")"
          # 清单短缓存（否则设备永远读到旧的，表现为「发了没更新」）；件本体长缓存（文件名带版本号）。
          echo "[qiniu] 目标键: $CH/$MAN 与 $CH/$SIG（清单 revision ${{ needs.resolve.outputs.revision }}）"
          node scripts/upload-qiniu.js release/userland-manifest.json "$CH/$MAN" --cache-control=60
          node scripts/upload-qiniu.js release/userland-manifest.json.sig "$CH/$SIG" --cache-control=60
          echo "[qiniu] $CH 已更新（两个键都已从 $QINIU_PUBLIC_BASE 回读并逐字节比对）"

  # 线上清单 vs 本轮构建算出的声明，逐格对账（不需要任何凭据 —— 只读线上、只比内容格）。
  # 为什么排在这里：manifest 在校验轮是 skipped，`needs: [build, manifest]` 会把本 job
  # 一起带走 ⇒ 门禁空转。用 always() 把 skipped 放回来：发布轮它在发布之后跑（应一致），
  # push 校验轮 manifest 没跑，本 job 就是「改了声明却没发」的那道红。
  drift:
    needs: [resolve, build, manifest]
    if: ${{ always() && needs.build.result == 'success' && (needs.manifest.result == 'success' || needs.manifest.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 算出本代码声明的 tools 投影（--project 不签名、不读私钥）
        run: |
          set -euo pipefail
          mkdir -p work
          node scripts/publish-userland-manifest.js dist --project > work/declared.json
          node -p "'[declared] ' + require('./work/declared.json').map(t => t.name + '@' + t.version + ' 入口 ' + t.entry + ' 别名 ' + (t.aliases||[]).map(a=>a.name).join('+')).join(' | ')"
      - name: 与线上清单逐格对账（缺一格就红）
        run: node scripts/check-userland-manifest-drift.js work/declared.json "${{ needs.resolve.outputs.channel }}"
