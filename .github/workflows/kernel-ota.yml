name: Build & Sign Kernel OTA Bundle

# 构建并签名「可热更新的内核（L1）」OTA 包：对齐 docs/BASE_SPEC.md §5 通道一（构建期签名）。
#
# 双信任根：本工作流用 CI secret OTA_PRIVATE_KEY_PEM（ed25519 私钥）签名内核包；
# 设备端用焊死在 APK 的 container/app/src/main/assets/ota-public.pem 验签 —— 私钥绝不进 APK。
#
# 用法（手动 Run workflow）：
#   - kernel_repo : 内核源码仓（**留空 = 单仓内的 kernel/ 子目录**；
#                   仅在需要从 fork/其他仓构建时才填 owner/repo）
#   - kernel_ref  : 跨仓构建时的内核仓 ref（分支/tag/sha）；留空走单仓，此项无效
#   - version     : 内核版本号（写进 kernel.json / 包名）
#   - abi         : 默认 node24-arm64-android35
#   - url_base    : OTA 下载基址（如 https://cdn.example.com/ota）；留空则不写 url
#   - publish     : 是否把产物发到 Release
#
# 产物：release/kernel-<version>.zip + release/kernel-manifest.json（作为 artifact / Release 下载）。

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: '内核源码仓 (owner/repo)'
        required: false
        default: ''
      kernel_ref:
        description: '内核仓 ref（分支/tag/sha）'
        required: false
        default: 'main'
      version:
        description: '内核版本号'
        required: true
        default: '1.0.0'
      abi:
        description: 'abi 标签'
        required: false
        default: 'node24-arm64-android35'
      url_base:
        description: 'OTA 下载基址（结尾不带 /）'
        required: false
        default: ''
      publish:
        description: '发布到 Release'
        type: boolean
        required: false
        default: false
      rollout_percent:
        description: '灰度放量百分比（0-100；100=全量）。设备按 安装ID+版本 确定性分桶'
        required: false
        default: '100'
      channel:
        description: '发布通道：canary=灰度测试（先发这里真机验证），stable=生产'
        type: choice
        options:
          - canary
          - stable
        required: false
        default: canary
  push:
    tags:
      - 'kernel-ota-*'

permissions:
  contents: write

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KERNEL_REPO: ${{ github.event.inputs.kernel_repo }}
      KERNEL_REF: ${{ github.event.inputs.kernel_ref || 'main' }}
      # 版本号**不写死**：留空时由下一步从内核的单一事实源（kernel/package.json）解析。
      # 原先这里默认 '1.0.0'，与 kernel/package.json 的版本是两个源 —— 会静默分叉（ADR-0004）。
      KERNEL_VER: ${{ github.event.inputs.version || '' }}
      KERNEL_ABI: ${{ github.event.inputs.abi || 'node24-arm64-android35' }}
      # 通道：默认 canary —— 内核推送必须先在灰度真机跑过，再提升到 stable。
      KERNEL_CHANNEL: ${{ github.event.inputs.channel || 'canary' }}
      OTA_URL_BASE: ${{ github.event.inputs.url_base || '' }}
    steps:
      - name: Checkout container repo
        uses: actions/checkout@v4

      - name: Resolve kernel version + requiresProtocol from kernel/package.json
        run: |
          set -euo pipefail
          V="${{ github.event.inputs.version }}"
          if [ -z "$V" ]; then
            V="$(node -p "require('./kernel/package.json').version")"
            echo "[version] 内核版本（来自 kernel/package.json）: $V"
          else
            echo "[version] 内核版本（显式指定）: $V"
          fi
          echo "KERNEL_VER=$V" >> "$GITHUB_ENV"
          P="$(node -p "require('./kernel/package.json').dsh.requiresProtocol || 0")"
          echo "DSH_KERNEL_REQUIRES_PROTOCOL=$P" >> "$GITHUB_ENV"
          echo "[version] 内核要求的最低桥协议: $P"

      - name: Restore signing private key from secret
        env:
          OTA_PRIVATE_KEY_PEM: ${{ secrets.OTA_PRIVATE_KEY_PEM }}
        run: |
          if [ -z "$OTA_PRIVATE_KEY_PEM" ]; then
            echo "::error::secrets.OTA_PRIVATE_KEY_PEM 未配置（ed25519 私钥，用于签名内核包）"
            exit 1
          fi
          mkdir -p keys
          printf '%s' "$OTA_PRIVATE_KEY_PEM" > keys/ota-private.pem
          chmod 600 keys/ota-private.pem
          echo "private key restored -> keys/ota-private.pem"

      - name: Verify welded public key anchor present
        run: |
          ANCHOR=container/app/src/main/assets/ota-public.pem
          [ -f "$ANCHOR" ] || { echo "::error::缺少 $ANCHOR（设备端验签公钥锚点）"; exit 1; }
          echo "anchor present: $(wc -c < "$ANCHOR") bytes"

      - name: Stage kernel source
        # 单仓默认：内核源码就是同仓 kernel/ 子目录，无需跨仓检出。
        # 只有显式传了 kernel_repo（fork / 试验分支）才去 clone 外部仓。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$KERNEL_REPO" ]; then
            git clone --depth 1 --branch "$KERNEL_REF" \
              "https://x-access-token:${GH_TOKEN}@github.com/$KERNEL_REPO.git" kernel-src
          else
            cp -a kernel kernel-src
          fi

      - name: Build panel UI (ui/dist)
        # ui/dist 被 .gitignore 排除，但内核包运行期必需 —— 检出里没有，
        # 不现场构建就会打出「能启动但打不开控制面板」的残缺包
        # （kernel-bundle.js 特意在排除表旁注了"注意保留 ui/dist"）。
        run: |
          set -euo pipefail
          cd kernel-src/ui
          npm ci --no-audit --no-fund
          npm run build

      - name: Build & sign kernel bundle
        run: |
          chmod +x scripts/build-kernel-bundle.sh
          ./scripts/build-kernel-bundle.sh "$PWD/kernel-src" "$KERNEL_VER" "$KERNEL_ABI" "$OTA_URL_BASE"

      - name: Sign feed manifest (freshness + signature)
        # ADR-0005 C3：manifest 是**先被读**的那一个，必须自带新鲜度与签名 ——
        # sequence 单调（防重放/冻结）、expires 过期即拒、signature 供设备端校验。
        #
        # 说明：S1 删除了设备端的"本地 feed 目录"路径，因此原先的
        # "Assemble device-consumable feed"（调 scripts/build-kernel-feed.sh）已无消费者，
        # 一并删除；这里只对 release/kernel-manifest.json 做签发。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ROLL="kernel-$KERNEL_CHANNEL"
          BASE=0
          if gh release view "$ROLL" --repo '${{ github.repository }}' >/dev/null 2>&1; then
            TMPD="$(mktemp -d)"
            if gh release download "$ROLL" -p kernel-manifest.json -O "$TMPD/prev.json" --repo '${{ github.repository }}' 2>/dev/null; then
              BASE="$(node -p "require('$TMPD/prev.json').sequence || 0" 2>/dev/null || echo 0)"
            else
              echo "::warning title=sequence 基线未知::未取到 $ROLL 的上一份 manifest，sequence 从 1 起"
            fi
          fi
          echo "[manifest] 上一份 sequence=$BASE"
          DSH_MANIFEST_SEQUENCE_BASE="$BASE" \
            node scripts/sign-kernel-manifest.js release/kernel-manifest.json keys/ota-private.pem "${{ github.event.inputs.rollout_percent || 100 }}"

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-ota-${{ env.KERNEL_VER }}
          path: |
            release/kernel-${{ env.KERNEL_VER }}.zip
            release/kernel-manifest.json
          if-no-files-found: error

      - name: Publish to Release
        if: ${{ github.event.inputs.publish == 'true' || startsWith(github.ref, 'refs/tags/kernel-ota-') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la release/

          # 发布说明写到文件再 --notes-file 读入。
          # 不直接写 --notes "多行"：多行字符串在 YAML 块标量里必须整体缩进，
          # 而缩进一破 YAML 就断（这里真实踩过 —— validate-workflow.py 立刻报
          # "could not find expected ':'"）。写文件既避开缩进问题，
          # 也让这段中文说明不必挤在缩进层级里。
          cat > /tmp/notes.md <<'NOTES'
          Signed kernel OTA bundle. Verify with the welded APK public key.

          ## 设备如何拿到（OTA，唯一路径 —— ADR-0005）

          设备启动时读该**通道**的 manifest 并自动安装/升级：
          ```
          <baseUrl>/kernel-<channel>/kernel-manifest.json
          <baseUrl>/kernel-<channel>/kernel-<version>.zip
          ```
          通道 = `canary`（灰度真机验证）或 `stable`（生产）；设备侧在
          `container/app/src/main/assets/kernel-feed.json` 里选通道。
          本地 feed（adb 投放）与 APK 内置基线均已删除 —— 只有一个安装来源。

          ## 生效方式

          下次启动容器时自动发现并安装（`NodeRuntimeService` 步骤 0b）。
          安装**必须**验签通过；未签名或签名不匹配的包会被拒绝 ——
          设备只安装已签名内核，不生产内核。
          NOTES

          # ── 通道（灰度）：canary = 灰度真机验证；stable = 生产 ──────────────
          # 为什么必须有：内核推送**必须先在灰度通道真实跑过**，否则只能靠祈祷。
          # 设备端读 <base>/<rolling>/kernel-manifest.json，rolling = kernel-<channel>。
          ROLL="kernel-$KERNEL_CHANNEL"
          echo "[channel] channel=$KERNEL_CHANNEL rolling=$ROLL"

          # ── 版本前进门禁（**按通道**比较）────────────────────────────────
          # 发布一个"不大于本通道已发布"的版本 = 该通道设备永远不更新且无报错。
          # 按通道而非全局：canary 可以领先 stable；提升(promote)到 stable 时对 stable 仍需前进。
          CUR=""
          if gh release view "$ROLL" --repo '${{ github.repository }}' >/dev/null 2>&1; then
            TMPD="$(mktemp -d)"
            if gh release download "$ROLL" -p kernel-manifest.json -O "$TMPD/m.json" --repo '${{ github.repository }}' 2>/dev/null; then
              CUR="$(node -p "require('$TMPD/m.json').version || ''" 2>/dev/null || true)"
            else
              echo "::warning title=feed 读取失败::未取到 $ROLL 的 manifest，本次跳过版本前进检查"
            fi
          fi
          if [ -n "$CUR" ]; then
            echo "[version] $ROLL 已发布=$CUR，本次=$KERNEL_VER"
            # 门禁只拦**回退**，放行**同版本重发**（与 APK 侧 versionCode 门禁同一策略）。
            # 为什么同版本必须放行：修投递通道、重传、补签，都发生在"版本没变"的时候；
            # 若判成错误，这些修复就永远落不了地。而且同版本重发不会让设备"看起来有更新"
            # ——它本来就不会更新（版本相等），这只是把同一份产物重新送到目标位置。
            if [ "$KERNEL_VER" = "$CUR" ]; then
              echo "[ok] 同版本重发（$CUR）：允许，用于修复投递/重传"
            else
              node -e "const {isNewer}=require('./container/engine/src/kernel-version'); if(isNewer(process.argv[1],process.argv[2])){process.exit(1)}" "$CUR" "$KERNEL_VER" \
                || { echo "::error title=内核版本回退::$ROLL 上本次 $KERNEL_VER 低于已发布 $CUR —— 设备有版本下限，会拒绝安装；且该通道设备也判为无更新。请递增 kernel/package.json 的 version。"; exit 1; }
              echo "[ok] 版本前进（$CUR → $KERNEL_VER）"
            fi
          fi

          # ── 版本化归档（全局唯一一次）────────────────────────────────────
          # kernel-<version> 只创建一次。**从 canary 提升到 stable 时不再重建** ——
          # 提升是标准动作，若把"同版本第二次发布"判为错误，就无法提升。
          if gh release view "kernel-${{ env.KERNEL_VER }}" --repo '${{ github.repository }}' >/dev/null 2>&1; then
            echo "[promote] kernel-${{ env.KERNEL_VER }} 已存在（灰度→生产提升），跳过归档创建"
          else
            gh release create "kernel-${{ env.KERNEL_VER }}" \
              release/kernel-${{ env.KERNEL_VER }}.zip \
              release/kernel-manifest.json \
              --title "Kernel OTA ${{ env.KERNEL_VER }}" \
              --notes-file /tmp/notes.md
          fi

          # ---- 滚动 feed：设备端只认一个**不动**的入口 ----
          # 每次发布的 tag 是 kernel-<version>，设备端不该追着版本号跑。
          # 所以额外把 manifest（+ 本次 zip）挂到一个固定 tag 上：
          #   <baseUrl>/kernel-latest/kernel-manifest.json
          # 与 apk-latest 同一个思路：版本化资产用于追溯，latest 用于稳定入口。
          if gh release view "$ROLL" --repo '${{ github.repository }}' >/dev/null 2>&1; then
            gh release upload "$ROLL" release/kernel-manifest.json \
              --repo '${{ github.repository }}' --clobber
            gh release upload "$ROLL" "release/kernel-${{ env.KERNEL_VER }}.zip" \
              --repo '${{ github.repository }}' --clobber
            # 清理：通道 feed 只保留**本次**的 zip（否则会随每次发布无限堆积历史包）。
            KEEP="kernel-${{ env.KERNEL_VER }}.zip"
            gh api "repos/${{ github.repository }}/releases/tags/$ROLL" \
              --jq ".assets[] | select(.name | test(\"^kernel-[0-9]\")) | select(.name != \"$KEEP\") | .id" 2>/dev/null \
              | while read -r id; do
                  [ -n "$id" ] && gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$id"
                done || true
          else
            gh release create "$ROLL" \
              release/kernel-manifest.json \
              "release/kernel-${{ env.KERNEL_VER }}.zip" \
              --repo '${{ github.repository }}' \
              --title "Kernel OTA channel $KERNEL_CHANNEL" \
              --notes "通道 feed（$KERNEL_CHANNEL）：设备端读 $ROLL/kernel-manifest.json 判断是否有更新。"
          fi

      - name: Publish to Qiniu (the channel devices actually read)
        # 为什么必须有这一步：**GitHub 在目标网络不可达**（实测 github.com / raw.githubusercontent.com
        # 均失败），所以 Release 只能当**归档**，设备端真正读的是对象存储。
        # 缺配置就**硬失败** —— 发一个设备读不到的包，等于假装发布成功。
        if: ${{ github.event.inputs.publish == 'true' || startsWith(github.ref, 'refs/tags/kernel-ota-') }}
        env:
          QINIU_AK: ${{ secrets.QINIU_AK }}
          QINIU_SK: ${{ secrets.QINIU_SK }}
          QINIU_BUCKET: ${{ secrets.QINIU_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "${QINIU_AK:-}" ] || [ -z "${QINIU_SK:-}" ] || [ -z "${QINIU_BUCKET:-}" ]; then
            echo "::error title=对象存储未配置::需要 secrets QINIU_AK / QINIU_SK / QINIU_BUCKET。设备端只从对象存储取内核（GitHub 在目标网络不可达，已实测）。"
            exit 1
          fi
          CH="kernel-$KERNEL_CHANNEL"
          # manifest 短缓存（否则设备永远读到旧 manifest，表现为"发了没更新"）；
          # 内核包长缓存（文件名带版本号，内容不可变）。
          node scripts/upload-qiniu.js release/kernel-manifest.json "$CH/kernel-manifest.json" --cache-control=60
          node scripts/upload-qiniu.js "release/kernel-$KERNEL_VER.zip" "$CH/kernel-$KERNEL_VER.zip" --cache-control=31536000
          echo "[qiniu] 通道 $CH 已更新：$KERNEL_VER"


