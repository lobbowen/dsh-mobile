name: Fast APK (no Node rebuild)

# ============================================================================
#  日常出包入口。**不编译 Node** —— 这是本项目效率的核心。
#
#  背景：Node 交叉编译要跑两份 V8（host x64 + target aarch64），
#  在 GitHub 免费 runner 上耗时 2~3 小时。而绝大多数开发改动
#  （Kotlin 代码、assets 里的 JS、布局、gradle 配置）**完全不影响
#  Node 二进制** —— 为它们重编一次纯属浪费，这也是"改一行代码等三小时"
#  这个痛点的根源。
#
#  本 workflow 的做法：
#    从固定 Release（node-runtime-<version>-<abi>）下载预编译的
#    libnode.so + libc++_shared.so → 校验 sha256 → 放进 jniLibs/
#    → 直接 gradle assembleDebug → 审计 → 发布。
#    全程分钟级。
#
#  什么时候该用 build-apk.yml（全量 Node 编译，手动触发）而不是这条：
#    · 改了 scripts/build-node-android.sh
#    · 要换 Node 版本
#    这两类改动才需要真正重编，编完用 release-admin 的 pin 模式固化
#    （tag: pin-node-*），之后本 workflow 自动用上新版本。
#
#  决策表见 docs/architecture.md 第 8 节。
# ============================================================================

on:
  # ⚠️ 一个 workflow 的 on.push 只能出现【一次】。写成两个 push: 块时，
  #    YAML 里后一个会覆盖前一个（重复 key），触发条件就变得不可预期 ——
  #    本文件就踩过这个坑：branches/paths 被 tags 覆盖，导致推任意 tag
  #    都可能意外跑起来。所有 push 条件必须合并到同一个块里。
  push:
    branches: [main, master]
    # 只在【真正影响 APK 内容】的路径变更时触发。
    # 用 paths 白名单（而非 build-apk.yml 的 paths-ignore 黑名单）：
    # 白名单的默认语义是"不匹配就不跑"，对日常出包这条高频路径，
    # 宁可漏跑（可手动/ tag 触发）也不要因新增目录而莫名跑起来。
    paths:
      - 'container/app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      # 原生资产清单 —— 它决定 APK 里装哪些 .so、CI 下载校验哪些资产、
      # 以及 gradle 的 keepDebugSymbols。改它就等于改了 APK 内容。
      - '.github/native-assets.txt'
      # native/ 下的 C 源（flock/publish/ptyprobe 等）现场编译进 jniLibs ——
      # 改源码同样等于改 APK 内容（tag 触发不受 paths 限制，但 push 直出也要能触发）。
      - 'container/native/**'
      # 小件能力件的**构建实现**。它直接决定 APK 里装哪些 .so、怎么编出来的 ——
      # 改了它就等于改了 APK 内容，必须在本白名单里（与上面的 C 源同理）。
      - 'scripts/build-native-capabilities.sh'
      # version.json 决定 APK 的分发身份（versionName / versionCode）。改它 = 改产物身份，
      # 而本 workflow 的版本门禁正是拿它比较 —— 原先不在白名单，会出现
      # 「改了版本却不触发构建 / 只改版本时无人验证」。
      - 'version.json'
      # 注意【不】包含 kernel/**：ADR-0005 后内核不随 APK 分发（下面有专门断言），
      # 内核改动走 kernel-ota.yml 出 OTA 包 —— 让 fast-apk 监听它只会白烧机时。
    # 额外的 tag 触发：推 fast-<任意> 即可手动跑一次，不必改代码。
    # 维护环境（沙箱）无法操作网页、workflow_dispatch 点不了，
    # tag 是最干净的显式触发手段。
    tags:
      - 'fast-*'
  workflow_dispatch:
    inputs:
      node_version:
        description: '用作运行时的 Node 版本（须已有对应的 pinned release）'
        required: false
        default: ''          # 留空 = 从 assets/node-versions.json 读（单一事实源）
      abi:
        description: '目标 ABI'
        required: false
        default: 'arm64-v8a'

# 同一个 ref 上只允许一个在跑。日常出包很快，取消旧的没有损失。
concurrency:
  group: fast-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write     # 建 Release / 传资产
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    # 不编 Node，gradle 也就几分钟。给 40 分钟余量（含依赖下载）。
    timeout-minutes: 40

    env:
      # 不在这里写死版本/ABI：下面的 Resolve 步骤会从 assets/node-versions.json 读
      # 并通过 GITHUB_ENV 覆盖；这里只在显式传入时有值（门禁法②：清单禁手维护）。
      NODE_VERSION: ${{ inputs.node_version }}
      ABI: ${{ inputs.abi }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Node runtime version
        id: nodever
        run: |
          set -euo pipefail
          # 优先用显式传入的 input（workflow_dispatch 时）；tag 触发或 push 触发
          # 时 inputs 为空，则从 assets 清单里读 —— 这样"清单说用什么版本"
          # 与"实际下载哪份运行时"永远一致，不会出现两处硬编码各自漂移。
          # 读取口唯一：scripts/read-node-versions.sh（ci.yml 内核 job 同源，门禁法①）。
          V="${{ inputs.node_version }}"
          if [ -z "$V" ]; then
            V="$(bash scripts/read-node-versions.sh default)"
            echo "从 assets/node-versions.json 读到版本: $V"
          else
            echo "使用显式指定的版本: $V"
          fi
          A="${{ inputs.abi }}"
          if [ -z "$A" ]; then
            A="$(bash scripts/read-node-versions.sh abi)"
            echo "从 assets/node-versions.json 读到 ABI: $A"
          else
            echo "使用显式指定的 ABI: $A"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "abi=$A"     >> "$GITHUB_OUTPUT"
          echo "NODE_VERSION=$V" >> "$GITHUB_ENV"
          echo "ABI=$A"          >> "$GITHUB_ENV"

      - name: Validate workflow files (fail fast on YAML/syntax errors)
        # 唯一实现：scripts/validate-workflow.py（严格版，默认扫全部 workflow；ci.yml 同调。
        # 原先严格版只挂在 build-apk 这条几小时一跑的链上，日常链拿的是 safe_load 宽松判据 ——
        # 重复 key / on.push 覆盖这类坑要等出包链才第一次被看住，发现成本倒挂。）
        run: python3 scripts/validate-workflow.py

      # 注意：引擎门禁与「原生资产清单生成」门禁已迁到 ci.yml（统一门禁）。
      # 本 workflow 只负责出包，不再重复跑测试。
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          # 缓存 ~/.gradle（Gradle 发行包 + 依赖 jar + transform 结果）。
          # 全新 runner 每次都要重下 gradle 发行包，这几乎是零成本的白赚。
          cache: gradle

      # 说明：不用第三方 setup-android action。
      # ubuntu-latest runner 自带 Android SDK（ANDROID_SDK_ROOT 已设置），
      # 自己装需要的包即可。用 setup-android@v3 实测会失败：
      #   Warning: Failed to find package 'tools'
      #   sdkmanager failed with exit code 1
      # 它默认要装的 'tools' 包在新版 SDK 仓库里已不存在（被 cmdline-tools 取代）。
      # build-apk.yml 当初也是因为类似原因弃用了该 action，这里遵循同样的做法。
      - name: Show Android SDK env
        run: |
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<unset>}"
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
          ls "$ANDROID_SDK_ROOT" 2>/dev/null || true

      - name: Install SDK packages
        run: |
          set -o pipefail
          # 不显式设置 ANDROID_HOME/ANDROID_SDK_ROOT：runner 镜像自带的才是对的。
          # 曾经写成 ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}，而 workflow 级没定义
          # 该变量 → 展开为空 → 反而把 runner 自带的值覆盖成空。
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          echo "== sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --version 2>&1 | tail -1

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          # compileSdk 必须 >= 35：androidx.core 1.15.0 / core-ktx 1.15.0 的
          # AAR metadata 明确要求依赖方 compileSdk >= 35，否则 gradle 在
          # :app:checkDebugAarMetadata 阶段直接失败。
          echo "== 安装 platform-tools / platforms;android-35 / build-tools;35.0.0"
          if ! "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" 2>&1 | tail -5; then
            echo "[error] sdkmanager 安装失败"
            exit 1
          fi
          echo "== 已安装的 platforms:"
          ls "$ANDROID_SDK_ROOT/platforms" 2>/dev/null | sed 's/^/    /'

      # ----------------------------------------------------------------------
      # 关键步骤：把预编译的 Node 运行时取回来，替代"现场编译 2~3 小时"。
      # ----------------------------------------------------------------------
      - name: Fetch prebuilt Node runtime from pinned release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="node-runtime-${NODE_VERSION}-${ABI}"
          echo "== 从 Release 获取预编译运行时: $TAG =="

          rm -rf /tmp/rt && mkdir -p /tmp/rt

          # 若该 tag 不存在，给出可操作的指引而不是一个含糊的 404。
          if ! gh release view "$TAG" --repo '${{ github.repository }}' >/dev/null 2>&1; then
            echo "[error] 找不到 Release: $TAG"
            echo
            echo "说明预编译运行时尚未固化。请先执行一次："
            echo "  Actions → 'Admin (cancel / status)' → Run workflow，mode 选 pin"
            echo "  或推送 tag: pin-node-latest"
            echo
            echo "（固化会从最近一次成功的 build-apk 运行里提取并校验两个 .so）"
            exit 1
          fi

          # 资产清单来自 .github/native-assets.txt（NativeAssetRegistry 的投影）。
          # 这样加新二进制时只需改注册表 + 这份清单，不用再回来改 workflow。
          # 清单为空或读不到即中止 —— 静默降级会让 APK 悄悄少装东西。
          ASSETS_FILE=".github/native-assets.txt"
          [ -f "$ASSETS_FILE" ] || { echo "[error] 找不到 $ASSETS_FILE"; exit 1; }
          ASSETS="$({ grep -v '^[[:space:]]*#' "$ASSETS_FILE" | grep -v '^[[:space:]]*$' || true; } | tr -d '\r')"
          [ -n "$ASSETS" ] || { echo "[error] $ASSETS_FILE 里没有任何资产"; exit 1; }
          echo "== 资产清单（取自 $ASSETS_FILE）=="
          echo "$ASSETS" | sed 's/^/  /'

          PATTERNS=""
          for a in $ASSETS; do PATTERNS="$PATTERNS --pattern $a"; done

          # shellcheck disable=SC2086
          gh release download "$TAG" \
            --repo '${{ github.repository }}' \
            --dir /tmp/rt \
            $PATTERNS --pattern 'manifest.json'

          echo "== 下载内容 =="
          ls -la /tmp/rt/

          # ---- 校验 sha256 ----
          # 必须校验。运行时是"外部输入的二进制"，不校验就等于把
          # "APK 里装了什么"交给运气；出问题时会极难定位。
          echo
          echo "== 校验 sha256 =="
          python3 - <<'PY'
          import json, hashlib, sys, pathlib
          m = json.load(open('/tmp/rt/manifest.json'))
          print(f"  manifest: version={m['version']} abi={m['abi']} from run {m.get('source_run')}")
          ok = True
          for name, meta in m['files'].items():
              p = pathlib.Path('/tmp/rt') / name
              if not p.exists():
                  print(f"  [MISSING] {name}"); ok = False; continue
              h = hashlib.sha256(p.read_bytes()).hexdigest()
              good = h == meta['sha256']
              print(f"  [{'ok' if good else 'MISMATCH'}] {name}  {p.stat().st_size} 字节")
              if not good:
                  print(f"      期望 {meta['sha256']}")
                  print(f"      实际 {h}")
                  ok = False
          sys.exit(0 if ok else 1)
          PY

          # ---- 放进 jniLibs ----
          # 文件名必须是 lib*.so：否则 AGP 不会把它当 native lib 处理，
          # 也就不会在安装时解压到可执行的 nativeLibraryDir（W^X 约束）。
          mkdir -p "container/app/src/main/jniLibs/${ABI}"
          for a in $ASSETS; do
            if [ ! -f "/tmp/rt/$a" ]; then
              echo "[error] Release 里没有 $a（清单要求它随包）"
              exit 1
            fi
            cp -f "/tmp/rt/$a" "container/app/src/main/jniLibs/${ABI}/$a"
            chmod +x "container/app/src/main/jniLibs/${ABI}/$a"
          done

          echo
          echo "== jniLibs 就位 =="
          ls -la "container/app/src/main/jniLibs/${ABI}/"

          # 记录用了哪份运行时 —— 出问题时能一眼看出 APK 里装的是哪次固化的产物。
          echo "runtime-tag=$TAG" >> "$GITHUB_ENV"

      - name: Gate — verify runtime is in place before gradle
        run: |
          set -euo pipefail
          D="container/app/src/main/jniLibs/${ABI}"
          # 清单驱动，与上面同一份文件；加资产不用改这里。
          ASSETS="$({ grep -v '^[[:space:]]*#' .github/native-assets.txt | grep -v '^[[:space:]]*$' || true; } | tr -d '\r')"
          [ -n "$ASSETS" ] || { echo "[error] .github/native-assets.txt 里没有任何资产 —— 下面的清单循环会一条都不检查就放行。"; exit 1; }
          for f in $ASSETS; do
            if [ ! -f "$D/$f" ]; then
              echo "[error] $D/$f 缺失 —— 打包会产出真机跑不起来的 APK，中止。"
              exit 1
            fi
            SIZE=$(stat -c%s "$D/$f")
            if [ "$SIZE" -lt 1000000 ]; then
              echo "[error] $D/$f 只有 $SIZE 字节，明显不是有效产物，中止。"
              exit 1
            fi
            echo "[ok] $f  $SIZE 字节"
          done

          # 依赖自解析门禁：目录里每个 .so 若 DT_NEEDED 了同目录的随包库，它必须自带
          # 含 $ORIGIN 的 DT_RUNPATH。不查这一条就会放行「只有靠调用方补
          # LD_LIBRARY_PATH 才跑得起来」的产物 —— 而 dsh run_code 清空环境，那条路
          # 在真机上必然 CANNOT LINK。判据与 NativePreparer.probe 的裸环境探针同形。
          # readelf 由 binutils 提供；"工具没装"和"产物不合格"是两回事，缺就先装
          # （唯一宿主 scripts/ensure-tool.sh，判据本身只住 verify-runtime-elf.sh）。
          bash scripts/ensure-tool.sh readelf binutils
          bash scripts/verify-runtime-elf.sh "$D"

      - name: Gate — verify OTA public key anchor is weldable
        run: |
          set -euo pipefail
          # 本链出的包就是设备上那个**唯一验签信任源**的载体（assets/ota-public.pem）。
          # 判据只住 scripts/verify-ota-anchor.sh（build-apk 与 kernel-ota 同调；配对那一问
          # 在 kernel-ota，因为只有它拿得到私钥）。这里缺的是「锚点本身能不能用」这一问：
          # 焊一把解析不了的、或算法不是 ed25519 的公钥进 APK，此后每个内核包在所有设备上
          # 都判 signature-invalid，而这在打包期完全看不出来。
          bash scripts/ensure-tool.sh openssl openssl
          bash scripts/verify-ota-anchor.sh \
            --anchor container/app/src/main/assets/ota-public.pem

      - name: Build capability binaries (小件原生件)
        # 唯一实现：scripts/build-native-capabilities.sh —— 由本文件原样抽出（含设计注释）。
        # 抽出来的目的：固化（pin）job 能调同一份实现把产物发成不可变 Release；
        # 之后本步骤会改为「下载 + 校验 sha256」，不再每次现场编译。
        # 失败语义：bash / rg / PTY 探针为硬性必需（$PREFIX 依赖，无回退）；
        #          node-pty 走上游配方，软失败（终端降级，不陪葬其它能力）。
        run: bash scripts/build-native-capabilities.sh

      - name: Stage pinned npm into APK assets
        # npm 是**基础环境**的一部分（与 Node 版本锁死、几乎不变）⇒ 进 APK 而非内核包。
        # 版本/sha512 双钉与理由见 scripts/stage-npm-assets.sh 头部注释。
        run: |
          set -euo pipefail
          ./scripts/stage-npm-assets.sh

      # ADR-0005：内核**不随 APK 分发**。这里刻意**什么都不做** —— 曾经这一步会现场拉内核源码、
      # 签名、把 baseline.zip 塞进 APK，后果是"内核一改就要重出 APK"。现在内核只从 OTA 源安装
      # （见 kernel-ota.yml）。若有人把内核塞回 assets/kernel/，下面这条断言会直接红。
      - name: Assert the APK carries NO kernel assets
        run: |
          set -euo pipefail
          KD=container/app/src/main/assets/kernel
          if [ -d "$KD" ] && [ -n "$(ls -A "$KD" 2>/dev/null)" ]; then
            echo "::error title=APK 含内核资产::ADR-0005 规定内核不随 APK 分发；assets/kernel/ 必须为空或不存在。"
            ls -la "$KD"
            exit 1
          fi
          echo "[ok] APK 不含内核资产（内核只从 OTA 源安装）"

      - name: Inject release keystore (optional, for stable signing)
        id: signing
        # 「设备能否自我升级 APK」的唯一开关。判据只有一份实现：
        # scripts/inject-apk-keystore.sh（三档退出语义写在那份脚本的头部，这里不复述）。
        # 本链路的【政策】是日常出档：退 10（没配密钥）可继续 —— 包本身可用，
        # 只是不能覆盖安装到既有设备上，这件事由后面的签名门禁打 ::warning:: 说清；
        # 退 2（配了却用不成）必须当场红，等 20 分钟后在签名步骤才炸会把真因
        # （base64 残缺）伪装成「密码/别名不对」。
        #
        # secret 命名复用 release-admin repack 那一组，不另立一套；与 OTA 内核签名
        # （ed25519）是两条独立信任根 —— 辨析见 scripts/keygen-android-keystore.sh 头注释。
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -uo pipefail
          rc=0
          bash scripts/inject-apk-keystore.sh || rc=$?
          if [ "$rc" = 2 ]; then
            echo "::error title=keystore 注入失败::ANDROID_KEYSTORE_BASE64 已配置但用不成（原因见上方 [error] 行）—— 不许带着坏配置继续构建。"
            exit 1
          fi
          [ "$rc" = 0 ] || echo "[dsh-signing] 按「未配置密钥」档继续：本次产物是 debug 签名包（不可覆盖安装到既有设备）。"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Gate — verify APK signing identity（稳定签名）
        # 判据的唯一实现是 scripts/verify-apk-signing.sh（三档语义与动机见脚本头注释）。
        # 本链路是日常出包：允许 debug 档（脚本自己打 ::warning::），但锚点在就必须逐指纹
        # 比对 —— 「配了 keystore 却签成别的 key」以前查不出来。
        run: |
          set -euo pipefail
          APK="$(bash scripts/pick.sh apk-debug container/app/build/outputs/apk/debug -name '*.apk' -type f)"
          ARGS=()
          [ -z "${DSH_APK_CERT_FILE:-}" ] || ARGS=(--cert "$DSH_APK_CERT_FILE")
          bash scripts/verify-apk-signing.sh "$APK" "${ARGS[@]}"

      - name: Audit APK contents
        # 判据的唯一实现是 scripts/verify-apk-native.sh（与 build-apk 同调，
        # 缺件/内核资产/npm/adb-client 逐条硬红，动机见脚本头注释）。
        run: |
          set -euo pipefail
          APK="$(bash scripts/pick.sh apk-debug container/app/build/outputs/apk/debug -name '*.apk' -type f)"
          bash scripts/verify-apk-native.sh "$APK" "$ABI"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-node-container-apk
          path: container/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK="$(bash scripts/pick.sh apk-debug container/app/build/outputs/apk/debug -name '*.apk' -type f)"
          TAG="apk-latest"
          VN="$(node -p "require('./version.json').shell.versionName")"
          VC="$(node -p "require('./version.json').shell.versionCode")"
          VAPK="app-debug-${VN}+${VC}.apk"
          echo "[version] 本次发布 $VN (versionCode=$VC) → $VAPK"

          # 先改名再交出去：gh 的资产名取 file 的 basename（`#` 后面只是 label，不改名），
          # 所以"版本化资产名"只能靠这份临时目录里的副本实现。
          VDIR="$(mktemp -d)"
          cp "$APK" "$VDIR/$VAPK"

          # ── 版本门禁（VERSION-GATE 1/4：判据 scripts/verify-apk-version-gate.sh，取数外壳
          #    scripts/check-apk-release-version.sh）─────────────────────────────
          # 通道怎么定：只有「合并到分支后自动出包」是 auto —— 那条路没人看着，最能把
          # 「改了 APK 却没 bump 版本」咽下去。`fast-*` tag 与人点的 workflow_dispatch 都是
          # explicit（显式要求原地重传，正当用途是「投递本身坏了」）。
          # 注意 dispatch 不一定给出 tag 形态的 GITHUB_REF_TYPE（它跟着被选中的 ref），
          # 所以先按 event_name 判，再看 ref_type —— 与 release-admin 里 `${GITHUB_REF_TYPE} = tag`
          # 只在 tag 触发时成立是同一条事实（那里靠它解析 publish-<run_id>）。
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            VCHANNEL=explicit
          else
            VCHANNEL=auto
          fi
          bash scripts/check-apk-release-version.sh version.json "$TAG" "$VCHANNEL"

          # ── 覆盖上传（含孤立资产回退 + 发布后逐字节确认）────────────────────
          # 判据只住 scripts/gh-release-upload.sh：同名资产记录还在、后端对象却孤立时
          # --clobber 会 404（2026-09-23 实证），回退成「按名字删旧记录再普通上传」；
          # 上传命令退 0 也不算数，宿主会回读清单比对字节数才报 [ok]。
          # latest 下载网址要稳定，所以固定 tag、每轮覆盖。
          bash scripts/gh-release-upload.sh "$TAG" \
            --title "DSH Mobile APK (latest)" \
            --notes "Android 原生 Node 容器 APK（由 fast-apk 构建，运行时来自 ${{ env.runtime-tag }}）。" \
            "$APK" version.json

          # 版本化资产进**独立 tag**（v<versionName>），**不放**滚动 latest：
          # 否则 latest 会随每次发布无限堆积历史 APK（滚动通道只该有"当前"）。
          VTAG="v$VN"
          bash scripts/gh-release-upload.sh "$VTAG" \
            --title "DSH Mobile $VN" \
            --notes "版本化归档：versionName=$VN，versionCode=$VC。滚动别名见 apk-latest。" \
            "$VDIR/$VAPK"

          rm -rf "$VDIR"
          echo
          echo "下载地址:"
          echo "  https://github.com/${{ github.repository }}/releases/download/${TAG}/app-debug.apk   （latest 别名）"
          echo "  https://github.com/${{ github.repository }}/releases/download/$VTAG/${VAPK}   （版本化归档）"

      - name: Report to ci-ok
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory '*'
          rm -rf /tmp/okr && mkdir -p /tmp/okr && cd /tmp/okr
          git clone --quiet \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" . || {
              echo "[warn] clone 失败，跳过上报"; exit 0; }

          APK_SHA="$(sha256sum "$GITHUB_WORKSPACE"/container/app/build/outputs/apk/debug/*.apk | awk '{print $1}')"
          {
            echo "BUILD_OK"
            echo "time    : $(date -u)"
            echo "mode    : fast-apk (no Node rebuild)"
            echo "runtime : ${{ env.runtime-tag }}"
            echo "sha     : ${GITHUB_SHA:0:7}"
            echo "apk     : app-debug.apk"
            echo "apk_sha : $APK_SHA"
            echo "url     : https://github.com/${{ github.repository }}/releases/download/apk-latest/app-debug.apk"
          } > ci-ok.txt

          git config user.email "ci@workbuddy.local"
          git config user.name "CI Diagnostic Bot"
          git add ci-ok.txt
          git commit -q -m "ci: fast-apk ok (${GITHUB_SHA:0:7})" || true
          git push origin HEAD:ci-ok --force && echo "[ok] ci-ok 已更新"
