name: Fast APK (no Node rebuild)

# ============================================================================
#  日常出包入口。**不编译 Node** —— 这是本项目效率的核心。
#
#  背景：Node 交叉编译要跑两份 V8（host x64 + target aarch64），
#  在 GitHub 免费 runner 上耗时 2~3 小时。而绝大多数开发改动
#  （Kotlin 代码、assets 里的 JS、布局、gradle 配置）**完全不影响
#  Node 二进制** —— 为它们重编一次纯属浪费，这也是"改一行代码等三小时"
#  这个痛点的根源。
#
#  本 workflow 的做法：
#    从固定 Release（node-runtime-<version>-<abi>）下载预编译的
#    libnode.so + libc++_shared.so → 校验 sha256 → 放进 jniLibs/
#    → 直接 gradle assembleDebug → 审计 → 发布。
#    全程分钟级。
#
#  什么时候该用 build-node.yml 而不是这条：
#    · 改了 scripts/build-node-android.sh
#    · 要换 Node 版本
#    这两类改动才需要真正重编，编完用 pin-node.yml 把新产物固化，
#    之后本 workflow 自动用上新版本。
#
#  决策表见 docs/ARCHITECTURE.md 第 8 节。
# ============================================================================

on:
  # ⚠️ 一个 workflow 的 on.push 只能出现【一次】。写成两个 push: 块时，
  #    YAML 里后一个会覆盖前一个（重复 key），触发条件就变得不可预期 ——
  #    本文件就踩过这个坑：branches/paths 被 tags 覆盖，导致推任意 tag
  #    都可能意外跑起来。所有 push 条件必须合并到同一个块里。
  push:
    branches: [main, master]
    # 只在【真正影响 APK 内容】的路径变更时触发。
    # 用 paths 白名单（而非 build-node.yml 的 paths-ignore 黑名单）：
    # 白名单的默认语义是"不匹配就不跑"，对日常出包这条高频路径，
    # 宁可漏跑（可手动/ tag 触发）也不要因新增目录而莫名跑起来。
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      # 原生资产清单 —— 它决定 APK 里装哪些 .so、CI 下载校验哪些资产、
      # 以及 gradle 的 keepDebugSymbols。改它就等于改了 APK 内容。
      - '.github/native-assets.txt'
      # native/ 下的 C 源（flock/publish/ptyprobe 等）现场编译进 jniLibs ——
      # 改源码同样等于改 APK 内容（tag 触发不受 paths 限制，但 push 直出也要能触发）。
      - 'native/**'
      # 内核垫片（守卫投放进 dsh 安装树的 JS）随基线包上机 —— 改它同样是改 APK。
      - 'dsh-android-kernel/**'
    # 额外的 tag 触发：推 fast-<任意> 即可手动跑一次，不必改代码。
    # 维护环境（沙箱）无法操作网页、workflow_dispatch 点不了，
    # tag 是最干净的显式触发手段。
    tags:
      - 'fast-*'
  workflow_dispatch:
    inputs:
      node_version:
        description: '用作运行时的 Node 版本（须已有对应的 pinned release）'
        required: false
        default: '24.21.0'
      abi:
        description: '目标 ABI'
        required: false
        default: 'arm64-v8a'

# 同一个 ref 上只允许一个在跑。日常出包很快，取消旧的没有损失。
concurrency:
  group: fast-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write     # 建 Release / 传资产
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    # 不编 Node，gradle 也就几分钟。给 40 分钟余量（含依赖下载）。
    timeout-minutes: 40

    env:
      NODE_VERSION: ${{ inputs.node_version || '24.21.0' }}
      ABI: ${{ inputs.abi || 'arm64-v8a' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Node runtime version
        id: nodever
        run: |
          set -euo pipefail
          # 优先用显式传入的 input（workflow_dispatch 时）；tag 触发或 push 触发
          # 时 inputs 为空，则从 assets 清单里读 —— 这样"清单说用什么版本"
          # 与"实际下载哪份运行时"永远一致，不会出现两处硬编码各自漂移。
          V="${{ inputs.node_version }}"
          if [ -z "$V" ]; then
            V="$(python3 -c "import json; print(json.load(open('app/src/main/assets/node-versions.json'))['default'])")"
            echo "从 assets/node-versions.json 读到版本: $V"
          else
            echo "使用显式指定的版本: $V"
          fi
          A="${{ inputs.abi }}"
          if [ -z "$A" ]; then
            A="$(python3 -c "import json; print(json.load(open('app/src/main/assets/node-versions.json'))['abi'])")"
            echo "从 assets/node-versions.json 读到 ABI: $A"
          else
            echo "使用显式指定的 ABI: $A"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "abi=$A"     >> "$GITHUB_OUTPUT"
          echo "NODE_VERSION=$V" >> "$GITHUB_ENV"
          echo "ABI=$A"          >> "$GITHUB_ENV"

      - name: Validate workflow files (fail fast on YAML/syntax errors)
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          bad = 0
          for f in sorted(glob.glob('.github/workflows/*.yml')):
              try:
                  yaml.safe_load(open(f))
                  print(f"[ok] {f}")
              except Exception as e:
                  print(f"[FAIL] {f}: {e}")
                  bad += 1
          sys.exit(1 if bad else 0)
          PY

      - name: Container engine tests (logic)
        # 本工作流改了 container-engine/src/（zip.js 的 Deflate 支持、
        # kernel-bundle 的排除表与体积断言、桥方法表）—— 不跑测试就等于没验证。
        #
        # 为什么放在 gradle 之前：这些测试只需 Node（秒级），而 gradle 要几分钟。
        # 有错就该在 10 秒内知道，而不是等 8 分钟后在编译阶段以奇怪的形式暴露。
        #
        # 为什么是 test:logic 而不是 test —— 这里有一个**曾经踩过的坑**：
        # 基线包（app/src/main/assets/kernel/baseline.zip）是构建产物
        # （.gitignore 排除），生成它的 "Build kernel baseline bundle"
        # 步骤在**本步骤之后**（它需要先拉内核源码 + 注入私钥，代价高）。
        # 所以本步骤只能跑**不依赖产物**的逻辑测试，否则会因为"产物还没生成"
        # 而在 13 秒内必然红 —— 一个纯粹由步骤顺序造成的假红。
        # 基线包本身的断言放在它生成之后（见 "Verify kernel baseline bundle"）。
        run: |
          set -euo pipefail
          cd container-engine
          npm run test:logic 2>&1 | tee /tmp/engine-test.log
          echo
          echo "=== 容器引擎逻辑测试汇总 ==="
          echo "$(grep -c '^PASS' /tmp/engine-test.log || true) 个 PASS，$(grep -c '^FAIL' /tmp/engine-test.log || true) 个 FAIL"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          # 缓存 ~/.gradle（Gradle 发行包 + 依赖 jar + transform 结果）。
          # 全新 runner 每次都要重下 gradle 发行包，这几乎是零成本的白赚。
          cache: gradle

      # 说明：不用第三方 setup-android action。
      # ubuntu-latest runner 自带 Android SDK（ANDROID_SDK_ROOT 已设置），
      # 自己装需要的包即可。用 setup-android@v3 实测会失败：
      #   Warning: Failed to find package 'tools'
      #   sdkmanager failed with exit code 1
      # 它默认要装的 'tools' 包在新版 SDK 仓库里已不存在（被 cmdline-tools 取代）。
      # build-apk.yml 当初也是因为类似原因弃用了该 action，这里遵循同样的做法。
      - name: Show Android SDK env
        run: |
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<unset>}"
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
          ls "$ANDROID_SDK_ROOT" 2>/dev/null || true

      - name: Install SDK packages
        run: |
          set -o pipefail
          # 不显式设置 ANDROID_HOME/ANDROID_SDK_ROOT：runner 镜像自带的才是对的。
          # 曾经写成 ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}，而 workflow 级没定义
          # 该变量 → 展开为空 → 反而把 runner 自带的值覆盖成空。
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          echo "== sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --version 2>&1 | tail -1

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          # compileSdk 必须 >= 35：androidx.core 1.15.0 / core-ktx 1.15.0 的
          # AAR metadata 明确要求依赖方 compileSdk >= 35，否则 gradle 在
          # :app:checkDebugAarMetadata 阶段直接失败。
          echo "== 安装 platform-tools / platforms;android-35 / build-tools;35.0.0"
          if ! "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" 2>&1 | tail -5; then
            echo "[error] sdkmanager 安装失败"
            exit 1
          fi
          echo "== 已安装的 platforms:"
          ls "$ANDROID_SDK_ROOT/platforms" 2>/dev/null | sed 's/^/    /'

      # ----------------------------------------------------------------------
      # 关键步骤：把预编译的 Node 运行时取回来，替代"现场编译 2~3 小时"。
      # ----------------------------------------------------------------------
      - name: Fetch prebuilt Node runtime from pinned release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="node-runtime-${NODE_VERSION}-${ABI}"
          echo "== 从 Release 获取预编译运行时: $TAG =="

          rm -rf /tmp/rt && mkdir -p /tmp/rt

          # 若该 tag 不存在，给出可操作的指引而不是一个含糊的 404。
          if ! gh release view "$TAG" --repo '${{ github.repository }}' >/dev/null 2>&1; then
            echo "[error] 找不到 Release: $TAG"
            echo
            echo "说明预编译运行时尚未固化。请先执行一次："
            echo "  Actions → 'Pin Node runtime' → Run workflow"
            echo "  或推送 tag: pin-node-latest"
            echo
            echo "（固化会从最近一次成功的 build-node 运行里提取并校验两个 .so）"
            exit 1
          fi

          # 资产清单来自 .github/native-assets.txt（NativeAssetRegistry 的投影）。
          # 这样加新二进制时只需改注册表 + 这份清单，不用再回来改 workflow。
          # 清单为空或读不到即中止 —— 静默降级会让 APK 悄悄少装东西。
          ASSETS_FILE=".github/native-assets.txt"
          [ -f "$ASSETS_FILE" ] || { echo "[error] 找不到 $ASSETS_FILE"; exit 1; }
          ASSETS="$(grep -v '^[[:space:]]*#' "$ASSETS_FILE" | grep -v '^[[:space:]]*$' | tr -d '\r')"
          [ -n "$ASSETS" ] || { echo "[error] $ASSETS_FILE 里没有任何资产"; exit 1; }
          echo "== 资产清单（取自 $ASSETS_FILE）=="
          echo "$ASSETS" | sed 's/^/  /'

          PATTERNS=""
          for a in $ASSETS; do PATTERNS="$PATTERNS --pattern $a"; done

          # shellcheck disable=SC2086
          gh release download "$TAG" \
            --repo '${{ github.repository }}' \
            --dir /tmp/rt \
            $PATTERNS --pattern 'manifest.json'

          echo "== 下载内容 =="
          ls -la /tmp/rt/

          # ---- 校验 sha256 ----
          # 必须校验。运行时是"外部输入的二进制"，不校验就等于把
          # "APK 里装了什么"交给运气；出问题时会极难定位。
          echo
          echo "== 校验 sha256 =="
          python3 - <<'PY'
          import json, hashlib, sys, pathlib
          m = json.load(open('/tmp/rt/manifest.json'))
          print(f"  manifest: version={m['version']} abi={m['abi']} from run {m.get('source_run')}")
          ok = True
          for name, meta in m['files'].items():
              p = pathlib.Path('/tmp/rt') / name
              if not p.exists():
                  print(f"  [MISSING] {name}"); ok = False; continue
              h = hashlib.sha256(p.read_bytes()).hexdigest()
              good = h == meta['sha256']
              print(f"  [{'ok' if good else 'MISMATCH'}] {name}  {p.stat().st_size} 字节")
              if not good:
                  print(f"      期望 {meta['sha256']}")
                  print(f"      实际 {h}")
                  ok = False
          sys.exit(0 if ok else 1)
          PY

          # ---- 放进 jniLibs ----
          # 文件名必须是 lib*.so：否则 AGP 不会把它当 native lib 处理，
          # 也就不会在安装时解压到可执行的 nativeLibraryDir（W^X 约束）。
          mkdir -p "app/src/main/jniLibs/${ABI}"
          for a in $ASSETS; do
            if [ ! -f "/tmp/rt/$a" ]; then
              echo "[error] Release 里没有 $a（清单要求它随包）"
              exit 1
            fi
            cp -f "/tmp/rt/$a" "app/src/main/jniLibs/${ABI}/$a"
            chmod +x "app/src/main/jniLibs/${ABI}/$a"
          done

          echo
          echo "== jniLibs 就位 =="
          ls -la "app/src/main/jniLibs/${ABI}/"

          # 记录用了哪份运行时 —— 出问题时能一眼看出 APK 里装的是哪次固化的产物。
          echo "runtime-tag=$TAG" >> "$GITHUB_ENV"

      - name: Gate — verify runtime is in place before gradle
        run: |
          set -euo pipefail
          D="app/src/main/jniLibs/${ABI}"
          # 清单驱动，与上面同一份文件；加资产不用改这里。
          ASSETS="$(grep -v '^[[:space:]]*#' .github/native-assets.txt | grep -v '^[[:space:]]*$' | tr -d '\r')"
          for f in $ASSETS; do
            if [ ! -f "$D/$f" ]; then
              echo "[error] $D/$f 缺失 —— 打包会产出真机跑不起来的 APK，中止。"
              exit 1
            fi
            SIZE=$(stat -c%s "$D/$f")
            if [ "$SIZE" -lt 1000000 ]; then
              echo "[error] $D/$f 只有 $SIZE 字节，明显不是有效产物，中止。"
              exit 1
            fi
            echo "[ok] $f  $SIZE 字节"
          done

      - name: Build libdshflock.so + libdshposix.so (NDK 原生桥)
        # 真机实证（2026-09-23）：dsh 两条设备死路都没有 JS 等价物——
        # ① flock（下列）；② link：Android 7+ SELinux 禁 untrusted_app 硬链接，
        #    dsh 会话/附件的 link 式独占发布报 EACCES ⇒ renameat2(RENAME_NOREPLACE)
        #    link 用户态替代（native/posix/，自有代码）→ libdshposix.so，经 LD_PRELOAD 注入。
        #    两库不能合并成单一 .so：NAPI_MODULE_INIT 入口每模块唯一。
        # 真机实证：dsh 会话持久化硬依赖
        # @deepseek-ai/node-addon-system 的 flock 绑定，上游只发 linux(glibc/musl)/
        # darwin 预编译件，无 android-arm64 ⇒ 设备发消息报
        # "flock is not supported on android-arm64"。flock(2) 无 JS 等价物
        #（O_EXCL 锁崩溃后残留=砍能力），唯一正解=NDK 现编 vendor 的 src/flock.c
        #（源码见 native/flock/PROVENANCE.md）放进 jniLibs —— nativeLibraryDir 是
        # W^X 下唯一可 dlopen/exec 的通道（libnode.so 同款先例）。
        # 刻意**不**登记进 native-assets.txt：那份清单的 ≥1MB 门槛会误杀小体积绑定。
        run: |
          set -euo pipefail
          NDK=""
          for v in "${ANDROID_NDK_LATEST_HOME:-}" "${ANDROID_NDK_HOME:-}" "${ANDROID_NDK_ROOT:-}"; do
            [ -n "$v" ] && [ -d "$v" ] && NDK="$v" && break
          done
          if [ -z "$NDK" ]; then
            NDK=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1 || true)
          fi
          [ -n "$NDK" ] && [ -d "$NDK" ] || { echo "[error] runner 上找不到 NDK"; exit 1; }
          echo "NDK=$NDK"
          CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"
          [ -x "$CC" ] || { echo "[error] 找不到 clang: $CC"; exit 1; }

          # node 头（与固化运行时同版本；NAPI 只认版本宏不认实现）
          curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-headers.tar.xz" \
            -o /tmp/node-headers.tar.xz
          mkdir -p /tmp/node-headers
          tar -xJf /tmp/node-headers.tar.xz -C /tmp/node-headers --strip-components=1
          INC=/tmp/node-headers/include/node
          [ -f "$INC/node_api.h" ] || { echo "[error] 头文件解压异常：缺 node_api.h"; exit 1; }

          # NAPI_VERSION=9：flock.c 用到 napi_add_async_cleanup_hook（v9 起声明）；
          # vendor 注释写 v8 但其源码超出 v8 面，9 是其真实下限。
          mkdir -p "app/src/main/jniLibs/${ABI}"
          "$CC" -shared -fPIC -O2 -DNAPI_VERSION=9 -I "$INC" \
            -o "app/src/main/jniLibs/${ABI}/libdshflock.so" native/flock/flock.c
          SO="app/src/main/jniLibs/${ABI}/libdshflock.so"
          SIZE=$(stat -c%s "$SO")
          [ "$SIZE" -gt 1000 ] || { echo "[error] $SO 仅 $SIZE 字节，编译产物可疑"; exit 1; }
          file "$SO" | grep -q "ELF 64-bit.*ARM aarch64" || { echo "[error] 产物不是 aarch64 ELF"; exit 1; }
          echo "[ok] libdshflock.so $SIZE 字节 ($(file -b --mime-type "$SO" 2>/dev/null || echo ELF))"

          # ② link/linkat 用户态替代（纯 libc 符号，无 NDK 头文件依赖）
          "$CC" -shared -fPIC -O2 -I "$INC" \
            -o "app/src/main/jniLibs/${ABI}/libdshposix.so" \
            native/posix/link-interpose.c native/posix/open-fallback.c
          SO2="app/src/main/jniLibs/${ABI}/libdshposix.so"
          SIZE2=$(stat -c%s "$SO2")
          [ "$SIZE2" -gt 500 ] || { echo "[error] $SO2 仅 $SIZE2 字节，编译产物可疑"; exit 1; }
          file "$SO2" | grep -q "ELF 64-bit.*ARM aarch64" || { echo "[error] posix 产物不是 aarch64 ELF"; exit 1; }
          echo "[ok] libdshposix.so $SIZE2 字节"

      - name: Build capability binaries (bash / ripgrep / PTY probe)
        # android.9：终端三件套 + PTY 探针，全部 NDK 交叉编译**静态**产物：
        #   · libbash.so   —— dsh-bash-local / dsh-terminal-bash 需要真 bash 二进制；
        #                      Android 无 /bin/bash，可 exec 目录只有 nativeLibraryDir
        #                      由 PrefixProvisioner 复制为 $PREFIX/bin 下的真名可执行文件。
        #   · libdshrg.so  —— glob/grep 硬依赖 ripgrep（无 JS 等价物），由 $PREFIX 提供。
        #   · libdshptyprobe.so —— 真机 PTY 能力探针（native/ptyprobe/，决策 node-pty 路线）。
        # 失败语义：bash/rg/探针均为硬性必需（$PREFIX 依赖它们，无回退）；node-pty 走上游
        # 配方，软失败（终端降级，不陪葬其它能力）。Audit 步骤如实报告 APK 内有无。
        # bash 配方要点：bionic 无 termcap/readline ⇒ 预编一个 tputs 族 no-op 桩归档
        # 塞进 LIBS（configure 的功能探测即真实链接通过；dsh 只跑 `bash -c` 非交互
        # 管线，readline 的美化路径不参与）；--enable-static-link 产出免动态链接器
        # 的 ELF，绕开 PTC 垫片教训的那整类 linker/env 问题。
        run: |
          set -uo pipefail
          NDK=""
          for v in "${ANDROID_NDK_LATEST_HOME:-}" "${ANDROID_NDK_HOME:-}" "${ANDROID_NDK_ROOT:-}"; do
            [ -n "$v" ] && [ -d "$v" ] && NDK="$v" && break
          done
          if [ -z "$NDK" ]; then
            NDK=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1 || true)
          fi
          [ -n "$NDK" ] && [ -d "$NDK" ] || { echo "[error] runner 上找不到 NDK"; exit 1; }
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CC="$TC/aarch64-linux-android21-clang"
          LLVM_AR="$TC/llvm-ar"
          [ -x "$CC" ] || { echo "[error] 找不到 clang: $CC"; exit 1; }
          J="app/src/main/jniLibs/${ABI}"
          mkdir -p "$J"

          check_so() { # $1=路径 $2=最小字节
            local f="$1" min="$2"
            [ -f "$f" ] || return 1
            local s; s=$(stat -c%s "$f"); [ "$s" -gt "$min" ] || return 1
            file "$f" | grep -q 'ELF 64-bit.*ARM aarch64' || return 1
            echo "[ok] $(basename "$f") $s 字节"
            file "$f" | sed 's/^/      /'
          }

          # ── ① PTY 探针（必须成功；见 native/ptyprobe/PROVENANCE.md）──
          "$CC" -static -O2 -o "$J/libdshptyprobe.so" native/ptyprobe/pty-probe.c \
            || { echo "[error] ptyprobe 编译失败（纯 C 静态，失败即环境问题）"; exit 1; }
          check_so "$J/libdshptyprobe.so" 1000 || exit 1
          "$CC" -static -O2 -o "$J/libdshrootprobe.so" native/rootprobe/root-probe.c || exit 1
          check_so "$J/libdshrootprobe.so" 1000 || exit 1

          # ── ② bash 5.2.15 静态交叉编译 ──
          BASH_VER=5.2.15
          if curl -fsSL "https://ftp.gnu.org/gnu/bash/bash-${BASH_VER}.tar.gz" -o /tmp/bash.tar.gz \
             && echo "bash-${BASH_VER} sha256: $(sha256sum /tmp/bash.tar.gz | cut -d' ' -f1)" \
             && tar -xzf /tmp/bash.tar.gz -C /tmp; then
            cat > /tmp/termcap_stub.c <<'EOF'
          /* bionic 无 termcap：readline 美化路径的 no-op 桩（dsh 只走非交互 bash -c） */
          int tputs(const char *s, int affcnt, int (*putc_)(int)) { (void)s; (void)affcnt; (void)putc_; return 0; }
          int tgetent(char *bp, const char *name) { (void)bp; (void)name; return -1; }
          int tgetflag(const char *id) { (void)id; return 0; }
          int tgetnum(const char *id) { (void)id; return -1; }
          char *tgetstr(const char *id, char **area) { (void)id; (void)area; return 0; }
          char *tgoto(const char *cap, int col, int row) { (void)cap; (void)col; (void)row; return 0; }
          /* 第三轮 CI 实证：桩只给函数不够 —— configure 探到 tputs 后 readline 引用
           * termcap 填充三件套全局 PC/BC/UP（真实 termcap 库附带），必须一并定义。 */
          char PC = 0;
          char *BC = 0;
          char *UP = 0;
          EOF
            "$CC" -c -O2 /tmp/termcap_stub.c -o /tmp/termcap_stub.o \
              && "$LLVM_AR" rcs /tmp/libtermcap_stub.a /tmp/termcap_stub.o
            (
              set -e
              cd /tmp/bash-${BASH_VER}
              ./configure --host=aarch64-linux-android --build=x86_64-pc-linux-gnu \
                --prefix=/native --disable-nls --enable-static-link --without-bash-malloc \
                CC="$CC" CFLAGS="-O2 -Wno-error=implicit-function-declaration -Wno-error=int-conversion -Wno-error=incompatible-function-pointer-types -Wno-error=incompatible-pointer-types" \
                LDFLAGS="-static -Wl,--allow-multiple-definition" LIBS="/tmp/libtermcap_stub.a" \
                bash_cv_getcwd_malloc=yes bash_cv_func_sigsetjmp=present \
                bash_cv_printf_a_format=yes bash_cv_dev_fd_standard=yes \
                bash_cv_unusable_rtsigs=no > /tmp/bash-configure.log 2>&1 \
                || { echo "=== configure 失败取证 ==="; tail -40 /tmp/bash-configure.log; exit 1; }
              # CFLAGS 里的 -Wno-error 族：bash 5.2 是老式 C 风格重灾区，NDK clang ≥16
              # 把 implicit-function-declaration/int-conversion 等**默认升级为 error**，
              # 老代码在新编译器下必须显式降回 warning（首轮 CI 实证的失败面）。
              # --without-bash-malloc + --allow-multiple-definition：第二轮 CI 实证
              # ld.lld `duplicate symbol: malloc/free/calloc/realloc/memalign/
              # posix_memalign/malloc_usable_size/strtoimax` —— bash 自带 dmalloc 与
              # 静态 bionic libc 正面相撞（glibc 动态链接下不暴露，静态交叉必爆）；
              # 正解是用系统 malloc，strtoimax 兜底件残留冲突由 allow-multiple-definition
              # 按链接序解决（先定义者胜，语义均为标准实现）。
              make -j4 bash > /tmp/bash-make.log 2>&1 || {
                echo "=== make 失败取证（error 行 + 末 120 行）==="
                grep -nE "error:|Error [0-9]+$|undefined symbol" /tmp/bash-make.log | head -40 || true
                tail -120 /tmp/bash-make.log
                exit 1; }
            ) && cp -f /tmp/bash-${BASH_VER}/bash "$J/libbash.so"
            if ! check_so "$J/libbash.so" 300000; then
              echo "::error title=必需件缺失::libbash.so 未产出 —— bash 工具依赖 $PREFIX/bin/bash，无回退路径"
              exit 1
            fi
          else
            echo "::error title=必需件缺失::bash 源码下载/解包失败 —— bash 工具无回退路径"
            exit 1
          fi

          # ── ③ ripgrep 14.1.1（cargo 交叉到 aarch64-linux-android，静态 CRT）──
          if ! command -v cargo > /dev/null 2>&1; then
            echo "runner 无 cargo，装最小 rustup"
            curl -fsSf https://sh.rustup.rs -o /tmp/rustup.sh && sh /tmp/rustup.sh -y --profile minimal --default-toolchain stable >/dev/null
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup target add aarch64-linux-android > /dev/null 2>&1 || echo "[warn] rustup target add 失败（可能非 rustup 安装）"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CC"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS="-C target-feature=+crt-static"
          export CC_aarch64_linux_android="$CC" CXX_aarch64_linux_android="$CC" AR_aarch64_linux_android="$LLVM_AR"
          if cargo install --locked --version 14.1.1 ripgrep --target aarch64-linux-android --root /tmp/rgbin --no-track > /tmp/rg-build.log 2>&1; then
            cp -f /tmp/rgbin/bin/rg "$J/libdshrg.so"
          else
            tail -30 /tmp/rg-build.log
          fi
          if ! check_so "$J/libdshrg.so" 300000; then
            echo "::error title=必需件缺失::libdshrg.so 未产出 —— glob/grep 依赖 $PREFIX/bin/rg，无回退路径"
            exit 1
          fi

          # AGP 只 strip「共享库」语义的 ELF，对这批静态可执行文件是 no-op（实证：
          # 首轮日志 "Unable to strip ... packaging them as they are" ⇒ rg 33MB、
          # ptyprobe 2MB 带全量符号进包）。手动 strip：NAPI 件不受影响（.dynsym
          # 是动态符号表，strip-unneeded 不动它）。
          for f in libbash.so libdshrg.so libdshptyprobe.so libdshrootprobe.so libdshflock.so libdshposix.so libdshpty.so; do
            if [ -f "$J/$f" ]; then
              before=$(stat -c%s "$J/$f"); "$TC/llvm-strip" --strip-unneeded "$J/$f" 2>/dev/null || true
              echo "[strip] $f $before -> $(stat -c%s "$J/$f") 字节"
            fi
          done

          echo "== 能力二进制就位情况 =="
          ls -la "$J"

      - name: Build node-pty for android-arm64 (NDK + node-gyp)
        # node-pty 只发 linux/darwin/win32 预编译件且无 wasm 兜底，PTY 只能自己编。
        # 产物投 jniLibs/libdshpty.so；运行时由容器复制到 node-pty 的 loader 查找位
        # （node_modules/node-pty/prebuilds/android-arm64/pty.node）。
        # 失败语义：上游配方问题 => ::warning 后继续（终端能力降级，不陪葬其它能力）。
        run: |
          set -uo pipefail
          PTY_VER="1.2.0-beta.15"
          NDK=""
          for v in "${ANDROID_NDK_LATEST_HOME:-}" "${ANDROID_NDK_HOME:-}" "${ANDROID_NDK_ROOT:-}"; do
            [ -n "$v" ] && [ -d "$v" ] && NDK="$v" && break
          done
          if [ -z "$NDK" ]; then NDK=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1 || true); fi
          [ -n "$NDK" ] && [ -d "$NDK" ] || { echo "::warning title=能力件缺失::找不到 NDK，跳过 node-pty"; exit 0; }
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          # API 24：bionic 的 pty.h/forkpty 自 API 23 起才有；minSdk=24 与之相符。
          export CC="$TC/aarch64-linux-android24-clang"
          export CXX="$TC/aarch64-linux-android24-clang++"
          export AR="$TC/llvm-ar" LINK="$CXX"
          [ -x "$CC" ] || { echo "::warning title=能力件缺失::找不到 clang: $CC"; exit 0; }
          rm -rf /tmp/ptybuild && mkdir -p /tmp/ptybuild && cd /tmp/ptybuild
          npm pack "node-pty@${PTY_VER}" >/dev/null 2>&1 || { echo "::warning title=能力件缺失::node-pty 源码拉取失败"; exit 0; }
          tar -xzf node-pty-*.tgz && cd package
          # bionic 无 libutil：binding.gyp 里的 -lutil 必须去掉（含 mac 分支的 libraries!）。
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path('binding.gyp')
          p.write_text(re.sub(r"\s*'-lutil'\s*,?", "", p.read_text()))
          PY
          # binding.gyp 用 require('node-addon-api') 取 targets，须装进包内。
          npm install --ignore-scripts --no-audit --no-fund >/dev/null 2>&1 || true
          npx --yes node-gyp@10 rebuild --arch=arm64 --nodedir=/tmp/node-headers > /tmp/pty-gyp.log 2>&1 || {
            echo '=== node-gyp 失败取证（末 60 行）==='; tail -60 /tmp/pty-gyp.log
            echo '::warning title=能力件缺失::node-pty 构建失败 —— 终端 PTY 本包不可用'; exit 0; }
          SO="build/Release/pty.node"
          file "$SO" | grep -q 'ELF 64-bit.*ARM aarch64' || { echo '::warning title=能力件缺失::pty.node 非 aarch64'; tail -20 /tmp/pty-gyp.log; exit 0; }
          cp -f "$SO" "${GITHUB_WORKSPACE}/app/src/main/jniLibs/${ABI}/libdshpty.so"
          echo "[ok] libdshpty.so $(stat -c%s "${GITHUB_WORKSPACE}/app/src/main/jniLibs/${ABI}/libdshpty.so") 字节"

      - name: Stage pinned npm into APK assets
        # npm 是**基础环境**的一部分（与 Node 版本锁死、几乎不变）⇒ 进 APK 而非内核包。
        # 版本/sha512 双钉与理由见 scripts/stage-npm-assets.sh 头部注释。
        run: |
          set -euo pipefail
          ./scripts/stage-npm-assets.sh

      - name: Build kernel baseline bundle
        # 生成 APK 内置的基线内核包 → app/src/main/assets/kernel/baseline.zip
        #
        # 为什么必须有这一步：KernelManager.ensureBaseline() 一直想读这个文件，
        # 但它**从来不存在**（assets/ 下只有 node/ + ota-public.pem）。后果是
        # 真机无网首启时静默返回 null，表现为「没有内核包」—— 那是构建期缺陷，
        # 却被当成运行时状态，排查代价极高。
        #
        # 内核源码从内核仓取（与本工作流解耦：本流程不重编 Node，但要带内核）。
        # 失败不阻断 APK 产出 —— 没有基线包时设备仍能靠本地 feed 升级，
        # 只是失去"无网首启"能力。但**必须显式警告**，不能静默跳过。
        continue-on-error: true
        env:
          OTA_PRIVATE_KEY_PEM: ${{ secrets.OTA_PRIVATE_KEY_PEM }}
        run: |
          set -uo pipefail
          echo "== 内核源码（单仓子目录） =="
          KDIR="dsh-android-kernel"
          rm -rf /tmp/kernel-src
          if [ -d "$KDIR" ]; then
            cp -a "$KDIR" /tmp/kernel-src
            echo "[ok] 使用同仓内核源码: $KDIR"
          else
            echo "::warning title=无基线内核::仓内找不到 $KDIR；APK 将不含基线内核（无网首启不可用，仍可走本地 feed 升级）"
            exit 0
          fi

          # 私钥：CI secret。缺失则跳过（不产未签名基线包 —— 见脚本头注释）。
          # 先查私钥再构建面板：没密钥就根本走不到打包，几分钟的 ui 构建是白烧。
          if [ -z "${OTA_PRIVATE_KEY_PEM:-}" ]; then
            echo "::warning title=无基线内核::secrets.OTA_PRIVATE_KEY_PEM 未配置，跳过基线包生成（基线包必须签名，不可省）"
            exit 0
          fi
          mkdir -p keys
          printf '%s' "$OTA_PRIVATE_KEY_PEM" > keys/ota-private.pem
          chmod 600 keys/ota-private.pem

          # ⚠ ui/dist 被 .gitignore 排除，但它是内核包【运行期必需】的面板产物 ——
          # git 检出里没有它，直接打包会产出「能启动但打不开控制面板」的残缺内核
          # （交接文档点名的"构建成功但真机不可用"陷阱）。必须在打包前现场构建。
          echo "== 构建内核面板 (ui/dist) =="
          if ! (cd /tmp/kernel-src/ui && npm ci --no-audit --no-fund && npm run build); then
            echo "::error title=面板构建失败::ui 构建非零退出；跳过基线包（宁可不带，也不带缺面板的残缺包）"
            exit 1
          fi

          echo "== 生成基线包 =="
          chmod +x scripts/build-kernel-baseline.sh
          if ./scripts/build-kernel-baseline.sh /tmp/kernel-src; then
            echo "[ok] 基线包已生成"
            ls -la app/src/main/assets/kernel/baseline.zip
          else
            echo "::error title=基线包生成失败::build-kernel-baseline.sh 非零退出 —— 详见上一步输出"
            exit 1
          fi

      - name: Verify kernel baseline bundle
        # 基线包刚生成，此刻才能验它 —— 这是 DSH_REQUIRE_BASELINE=1 真正该待的地方。
        #
        # 为什么不在 gradle 之前跑（那是上一版的做法，也是上一版 CI 变红的原因）：
        # 基线包是构建产物，生成它在第 11 步（要拉内核源码 + 注入私钥，代价高）。
        # 把"要求产物存在"的断言排在"生成产物"之前，等于自己制造一次必然失败。
        #
        # continue-on-error 说明：本步骤失败**不该**阻断 APK 产出 ——
        # 没有基线包时设备仍能靠本地 feed 升级，只是失去"无网首启"能力。
        # 但失败消息必须足够明确（见 kernel-baseline-test.js 的 FAIL 文案），
        # 且下游 "Audit APK contents" 会**如实报告** APK 里到底有没有基线包 ——
        # 「构建成功」不等于「设备开箱可用」，这个区别必须留在日志里。
        continue-on-error: true
        env:
          DSH_REQUIRE_BASELINE: '1'
        run: |
          set -uo pipefail
          cd container-engine
          npm run test:baseline 2>&1 | tee /tmp/baseline-test.log
          RC=${PIPESTATUS[0]}
          echo
          echo "=== 基线包测试汇总 ==="
          echo "$(grep -c '^PASS' /tmp/baseline-test.log || true) 个 PASS，$(grep -c '^FAIL' /tmp/baseline-test.log || true) 个 FAIL"
          exit $RC

      - name: Inject release keystore (optional, for stable signing)
        id: signing
        # =====================================================================
        #  「设备能否自我升级 APK」的唯一开关，别小看这一步。
        # =====================================================================
        #  未注入时 AGP 会用 runner 上现场生成的 debug keystore 签名 ——
        #  指纹**每次都不同** ⇒ 新包覆盖安装到旧包上会
        #  INSTALL_FAILED_UPDATE_INCOMPATIBLE ⇒ 设备自我升级走不通。
        #
        #  这里**不 fail**（secret 未配置是常态，本地/PR 场景不需要稳定签名），
        #  但会打醒目的 ::warning:: —— 让"这次产物不能用来升级"这件事
        #  留在 CI 日志里，而不是靠人去猜。
        #
        #  secret 命名复用 repack-apk.yml 已经用的那一组，不另立一套
        #  （见 scripts/keygen-android-keystore.sh 头注释）。
        #
        #  与 OTA 内核签名（ed25519 / keys/ota-private.pem）**无关**，
        #  两者是独立的信任根，详见 scripts/keygen-android-keystore.sh。
        # =====================================================================
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -uo pipefail
          if [ -z "${KS_B64:-}" ]; then
            echo "::warning title=未配置 APK 签名密钥::本次产物将使用一次性 debug 签名，\n\
          无法覆盖安装到既有设备上（INSTALL_FAILED_UPDATE_INCOMPATIBLE）。\n\
          若需要设备自我升级能力，请配置 ANDROID_KEYSTORE_BASE64 等 secret。"
            echo "[dsh-signing] 跳过：未配置 ANDROID_KEYSTORE_BASE64"
            exit 0
          fi

          mkdir -p keys
          echo "$KS_B64" | base64 -d > keys/release.keystore
          chmod 600 keys/release.keystore

          # 密码经 GITHUB_ENV 传给 gradle（不写进命令行，避免出现在日志里）
          {
            echo "DSH_KEYSTORE_PASSWORD=${KS_PASS:-}"
            echo "DSH_KEY_ALIAS=${KS_ALIAS:-dsh}"
            echo "DSH_KEY_PASSWORD=${KS_KEYPASS:-${KS_PASS:-}}"
          } >> "$GITHUB_ENV"

          # 立刻核验：能读出指纹才说明密码对、文件完整。
          # 不核验的话，密码错要等整个 APK 构建完才在 apksigner 那步炸。
          # 立刻核验：能读出指纹才说明密码对、文件完整。
          # 不核验的话，密码错要等整个 APK 构建完才在 apksigner 那步炸。
          #
          # ⚠ 正则匹配 "fingerprint" 而非 "SHA256:"（keytool 实际输出
          #   "Certificate fingerprint (SHA-256): ..."，写 "SHA256:" 永不匹配，
          #   会让健康路径也误报 keystore 校验失败 —— 本地实测踩到）。
          keytool -list -keystore keys/release.keystore \
            -storepass "${KS_PASS:-}" 2>/dev/null \
            | grep -Ei 'fingerprint.*(sha-?256|sha1)' \
            | sed 's/^/[dsh-signing] /' \
            || { echo "::error title=keystore 校验失败::密码错误或文件损坏"; exit 1; }

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Audit APK contents
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -1)"
          echo "APK: $APK  ($(stat -c%s "$APK") 字节)"

          echo "--- lib/ 下的条目 ---"
          unzip -l "$APK" | grep 'lib/' || { echo "[error] 没有 lib/ 条目"; exit 1; }

          # 清单里每个文件缺了，装到真机上都会挂：
          #   缺 libnode.so       → exec 找不到东西
          #   缺 libc++_shared.so → cannot locate symbol
          # 与其让它在真机上失败，不如在这里失败 —— 反馈快得多。
          #
          # 路径由 ${ABI} 与清单拼出，不再硬编码 —— 加资产/换 ABI 都不用改这里。
          ASSETS="$(grep -v '^[[:space:]]*#' .github/native-assets.txt | grep -v '^[[:space:]]*$' | tr -d '\r')"
          for a in $ASSETS; do
            f="lib/${ABI}/$a"
            if unzip -l "$APK" | grep -q "$f"; then
              echo "[ok] $f"
            else
              echo "[error] APK 里缺少 $f"
              echo "        清单来源: .github/native-assets.txt（NativeAssetRegistry 的投影）"
              exit 1
            fi
          done
          echo "[ok] APK 审计通过（原生资产）"

          # --- 小体积原生件审计（刻意不登记 native-assets.txt 的那批）---
          # 自有 C（flock/publish/ptyprobe）编译失败即环境问题 ⇒ 硬红；
          # bash/rg 来自上游源码配方（交叉编译有真实失败概率）⇒ 缺席只降级为
          # ::warning::：缺件时垫片旋钮逐字回退原语义、真机侧诚实报错，
          # 不该让生命周期/PTC 修复陪葬。
          echo
          echo "--- 小体积原生件 ---"
          for b in libdshflock.so libdshposix.so libdshptyprobe.so libdshrootprobe.so; do
            if unzip -l "$APK" | grep -q "lib/${ABI}/$b"; then echo "[ok] lib/${ABI}/$b"; else echo "[error] APK 缺 lib/${ABI}/$b（自有 C，必产）"; exit 1; fi
          done
          for b in libbash.so libdshrg.so; do
            if unzip -l "$APK" | grep -q "lib/${ABI}/$b"; then echo "[ok] lib/${ABI}/$b"; else echo "::error title=必需件缺失::lib/${ABI}/$b 不在 APK（$PREFIX 依赖它，无回退）"; exit 1; fi
          done
          # libdshpty.so：上游 node-pty 配方，软失败（终端降级，不影响其它能力）
          if unzip -l "$APK" | grep -q "lib/${ABI}/libdshpty.so"; then echo "[ok] lib/${ABI}/libdshpty.so"; else echo "::warning title=能力降级::lib/${ABI}/libdshpty.so 不在 APK —— 终端 PTY 不可用"; fi

          # --- 基线内核包审计 ---
          #
          # 上面那步（Build kernel baseline bundle）是 continue-on-error 的 ——
          # 它失败时构建继续，但这里必须把「APK 里到底有没有基线内核」**如实报告**。
          # 否则「构建成功」会被误读成「设备开箱可用」，而实际上无网首启起不来。
          echo
          echo "--- 基线内核包 ---"
          if unzip -l "$APK" | grep -q 'assets/kernel/baseline.zip'; then
            SIZE=$(unzip -l "$APK" | awk '/assets\/kernel\/baseline\.zip/{print $1}')
            echo "[ok] 含 assets/kernel/baseline.zip（$SIZE 字节）"
          else
            echo "::warning title=APK 无基线内核::assets/kernel/baseline.zip 不在 APK 内。"
            echo "  影响：设备无网首启时无内核可跑，只能回落探针模式。"
            echo "  仍可用：本地 feed（/sdcard/dsh/kernel-feed/）升级内核。"
            echo "  常见原因：OTA_PRIVATE_KEY_PEM secret 未配置、或内核仓拉取失败。"
          fi

          # --- npm 基础环境审计（硬失败）---
          # 缺了它面板装不了任何 Agent —— 这是核心能力，不是可选增强。
          # 与基线包不同，它没有"仍可走 feed"的降级路径，故不沿用 warning。
          echo
          echo "--- npm 基础环境 ---"
          if unzip -l "$APK" | grep -q 'assets/npm/npm.zip'; then
            SIZE=$(unzip -l "$APK" | awk '/assets\/npm\/npm\.zip/{print $1}')
            echo "[ok] 含 assets/npm/npm.zip（$SIZE 字节，版本 $(cat app/src/main/assets/npm/version.txt)）"
            unzip -l "$APK" | grep -q 'assets/npm/version.txt' \
              || { echo "[error] npm.zip 在但 version.txt 缺失（解包版本戳无从确定）"; exit 1; }
          else
            echo "::error title=APK 无 npm::assets/npm/npm.zip 不在 APK 内 —— 面板无法安装任何 Agent。常见原因：Stage pinned npm 步骤被删/改名。"
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-node-container-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -1)"
          TAG="apk-latest"

          # 固定 tag、每轮覆盖：下载网址稳定，不必每轮去查新地址。
          if gh release view "$TAG" --repo '${{ github.repository }}' >/dev/null 2>&1; then
            echo "Release $TAG 已存在，覆盖资产。"
          else
            gh release create "$TAG" \
              --repo '${{ github.repository }}' \
              --title "DSH Mobile APK (latest)" \
              --notes "Android 原生 Node 容器 APK（由 fast-apk 构建，运行时来自 ${{ env.runtime-tag }}）。"
          fi

          gh release upload "$TAG" "$APK#app-debug.apk" \
            --repo '${{ github.repository }}' --clobber

          echo
          echo "=== 已发布 ==="
          gh release view "$TAG" --repo '${{ github.repository }}' --json assets \
            --jq '.assets[] | "  \(.name)  \(.size) 字节  digest=\(.digest // "n/a")"'
          echo
          echo "下载地址:"
          echo "https://github.com/${{ github.repository }}/releases/download/${TAG}/app-debug.apk"

      - name: Report to ci-ok
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory '*'
          rm -rf /tmp/okr && mkdir -p /tmp/okr && cd /tmp/okr
          git clone --quiet \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" . || {
              echo "[warn] clone 失败，跳过上报"; exit 0; }

          APK_SHA="$(sha256sum "$GITHUB_WORKSPACE"/app/build/outputs/apk/debug/*.apk | awk '{print $1}')"
          {
            echo "BUILD_OK"
            echo "time    : $(date -u)"
            echo "mode    : fast-apk (no Node rebuild)"
            echo "runtime : ${{ env.runtime-tag }}"
            echo "sha     : ${GITHUB_SHA:0:7}"
            echo "apk     : app-debug.apk"
            echo "apk_sha : $APK_SHA"
            echo "url     : https://github.com/${{ github.repository }}/releases/download/apk-latest/app-debug.apk"
          } > ci-ok.txt

          git config user.email "ci@workbuddy.local"
          git config user.name "CI Diagnostic Bot"
          git add ci-ok.txt
          git commit -q -m "ci: fast-apk ok (${GITHUB_SHA:0:7})" || true
          git push origin HEAD:ci-ok --force && echo "[ok] ci-ok 已更新"
