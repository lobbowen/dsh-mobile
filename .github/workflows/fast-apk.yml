name: Release OS APK (standard chain)

# ============================================================================
#  **OS（壳 APK）版本流的唯一发布链**。全仓每条版本流恰好一条链（投递只由人打的带版本号 tag 决定）；唯一的例外是能力件那条 pin-capabilities.yml —— 它的身份是内容指纹、入口是 dispatch（ADR-0011 §5）。，见
#  docs/adr/0011-one-release-chain-per-stream.md 与 ci.yml 头部那张表。
#
#  两个身份，一条链：
#    · push 到 main（命中 paths 白名单）= **只构建校验，不投递**。合并到 main 不再自动发
#      任何一个包 —— 旧形态「合并即出包」让每一次无关合并都在挤压同一个版本空间，
#      而「出包」从来不是被人**决定**的（DS-14/DS-16 整条取证链就长在这上面）。
#    · 推 tag `os-release-<versionName>-<versionCode>` = **发布这一版**。tag 名里那两个数
#      必须与 `version.json` 逐字相等（判据在下面的 Publish 步），所以「发的是哪一版」在
#      git 里留痕，而同号换字节无路可走（版本门禁吃 auto 通道 + 两格取严）。
#
#  背景：Node 交叉编译要跑两份 V8（host x64 + target aarch64），
#  在 GitHub 免费 runner 上耗时 2~3 小时。而绝大多数开发改动
#  （Kotlin 代码、assets 里的 JS、布局、gradle 配置）**完全不影响
#  Node 二进制** —— 为它们重编一次纯属浪费，这也是"改一行代码等三小时"
#  这个痛点的根源。
#
#  本 workflow 的做法：
#    从固定 Release（node-runtime-<version>-<abi>）下载预编译的
#    libnode.so + libc++_shared.so → 校验 sha256 → 放进 jniLibs/
#    → 直接 gradle assembleDebug → 审计 →（仅当 tag 命中）发布。
#    全程分钟级。
#
#  什么时候该用 build-apk.yml（全量 Node 编译，Runtime 版本流）而不是这条：
#    · 改了 scripts/build-node-android.sh
#    · 要换 Node 版本
#    这两类改动才需要真正重编；那条链自己固化 node-runtime-*（tag: runtime-release-*），
#    之后本链自动用上新版本。
#
#  决策表见 docs/architecture.md 第 8 节。
# ============================================================================

on:
  # ⚠️ 一个 workflow 的 on.push 只能出现【一次】。写成两个 push: 块时，
  #    YAML 里后一个会覆盖前一个（重复 key），触发条件就变得不可预期 ——
  #    本文件就踩过这个坑：branches/paths 被 tags 覆盖，导致推任意 tag
  #    都可能意外跑起来。所有 push 条件必须合并到同一个块里。
  push:
    branches: [main, master]
    # 只在【真正影响 APK 内容】的路径变更时触发。
    # 用 paths 白名单（而非 build-apk.yml 的 paths-ignore 黑名单）：
    # 白名单的默认语义是"不匹配就不跑"，对日常构建校验这条高频路径，
    # 宁可漏跑（可手动触发）也不要因新增目录而莫名跑起来。
    paths:
      - 'container/app/**'
      # container/app/** 里包含**不进 APK 的测试源码**（src/test、src/androidTest）——
      # 纯测试改动不改变 APK 字节，放进来就会触发构建，白烧机时。这一格与下面
      # 「构建脚本不进白名单」是同一条既有规则 ——「产物字节没变的路径不进白名单」
      # （先例：scripts/build-node-android.sh；CI 实证：commit 0635e558 曾因这格触发过构建）。
      - '!container/app/src/test/**'
      - '!container/app/src/androidTest/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      # 原生资产清单 —— 它决定 APK 里装哪些 .so、CI 下载校验哪些资产、
      # 以及 gradle 的 keepDebugSymbols。改它就等于改了 APK 内容。
      - '.github/native-assets.txt'
      # native/ 下的 C 源（flock/publish/ptyprobe 等）现场编译进 jniLibs ——
      # 改源码同样等于改 APK 内容。
      - 'container/native/**'
      # 刻意**不**放构建脚本（如 scripts/build-native-capabilities.sh）：与既有先例一致 ——
      # Node 的构建脚本 scripts/build-node-android.sh 同样不在此白名单，它走 build-apk.yml 那条
      # 重型手动路径。理由是实测出来的：把构建脚本放进来后，**纯重构**（产物字节其实没变）
      # 也会触发本链。
      # 构建脚本的改动由「C 源变更」（container/native/** 已在上方）或手动 dispatch 覆盖。
      # version.json 决定 APK 的分发身份（versionName / versionCode）。改它 = 改产物身份，
      # 而本 workflow 的版本门禁与发布 tag 名都拿它比对 —— 只改版本时也必须有人验证。
      - 'version.json'
      # 注意【不】包含 programs/console/**：ADR-0005 后 Program 不随 APK 分发（下面有专门断言），
      # Program 改动走 program-ota.yml 出 OTA 包 —— 让本链监听它只会白烧机时。
    # 发布入口：**带版本号的 tag**。推 `os-release-<versionName>-<versionCode>` 即决定发这一版。
    # 沙箱侧打不开网页、workflow_dispatch 点不动，tag 是唯一能从命令行落下的显式动作；
    # 与旧的 `fast-*`（任意名字、不带版本）的区别就是：**发的是哪一版写在 ref 名里**。
    # 注意 tag 触发**不等于**投递 —— 还要过 Publish 那一步的「tag 名 == version.json」判据。
    tags:
      - 'os-release-*'
  workflow_dispatch:
    inputs:
      node_version:
        description: '用作运行时的 Node 版本（须已有对应的 pinned release）'
        required: false
        default: ''          # 留空 = 从 assets/node-versions.json 读（单一事实源）
      abi:
        description: '目标 ABI'
        required: false
        default: 'arm64-v8a'

# 同一个 ref 上只允许一个在跑。日常出包很快，取消旧的没有损失。
concurrency:
  group: fast-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write     # 建 Release / 传资产
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    # 不编 Node，gradle 也就几分钟。给 40 分钟余量（含依赖下载）。
    timeout-minutes: 40

    env:
      # 不在这里写死版本/ABI：下面的 Resolve 步骤会从 assets/node-versions.json 读
      # 并通过 GITHUB_ENV 覆盖；这里只在显式传入时有值（门禁法②：清单禁手维护）。
      NODE_VERSION: ${{ inputs.node_version }}
      ABI: ${{ inputs.abi }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Node runtime version
        id: nodever
        run: |
          set -euo pipefail
          # 优先用显式传入的 input（workflow_dispatch 时）；tag 触发或 push 触发
          # 时 inputs 为空，则从 assets 清单里读 —— 这样"清单说用什么版本"
          # 与"实际下载哪份运行时"永远一致，不会出现两处硬编码各自漂移。
          # 读取口唯一：scripts/read-node-versions.sh（ci.yml Program job 同源，门禁法①）。
          V="${{ inputs.node_version }}"
          if [ -z "$V" ]; then
            V="$(bash scripts/read-node-versions.sh default)"
            echo "从 assets/node-versions.json 读到版本: $V"
          else
            echo "使用显式指定的版本: $V"
          fi
          A="${{ inputs.abi }}"
          if [ -z "$A" ]; then
            A="$(bash scripts/read-node-versions.sh abi)"
            echo "从 assets/node-versions.json 读到 ABI: $A"
          else
            echo "使用显式指定的 ABI: $A"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "abi=$A"     >> "$GITHUB_OUTPUT"
          echo "NODE_VERSION=$V" >> "$GITHUB_ENV"
          echo "ABI=$A"          >> "$GITHUB_ENV"

      - name: Validate workflow files (fail fast on YAML/syntax errors)
        # 唯一实现：scripts/validate-workflow.py（严格版，默认扫全部 workflow；ci.yml 同调。
        # 原先严格版只挂在 build-apk 这条几小时一跑的链上，日常链拿的是 safe_load 宽松判据 ——
        # 重复 key / on.push 覆盖这类坑要等出包链才第一次被看住，发现成本倒挂。）
        run: python3 scripts/validate-workflow.py

      # 注意：引擎门禁与「原生资产清单生成」门禁已迁到 ci.yml（统一门禁）。
      # 本 workflow 只负责出包，不再重复跑测试。
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          # 缓存 ~/.gradle（Gradle 发行包 + 依赖 jar + transform 结果）。
          # 全新 runner 每次都要重下 gradle 发行包，这几乎是零成本的白赚。
          cache: gradle

      # 说明：不用第三方 setup-android action。
      # ubuntu-latest runner 自带 Android SDK（ANDROID_SDK_ROOT 已设置），
      # 自己装需要的包即可。用 setup-android@v3 实测会失败：
      #   Warning: Failed to find package 'tools'
      #   sdkmanager failed with exit code 1
      # 它默认要装的 'tools' 包在新版 SDK 仓库里已不存在（被 cmdline-tools 取代）。
      # build-apk.yml 当初也是因为类似原因弃用了该 action，这里遵循同样的做法。
      - name: Show Android SDK env
        run: |
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<unset>}"
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
          ls "$ANDROID_SDK_ROOT" 2>/dev/null || true

      - name: Install SDK packages
        run: |
          set -o pipefail
          # 不显式设置 ANDROID_HOME/ANDROID_SDK_ROOT：runner 镜像自带的才是对的。
          # 曾经写成 ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}，而 workflow 级没定义
          # 该变量 → 展开为空 → 反而把 runner 自带的值覆盖成空。
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          echo "== sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --version 2>&1 | tail -1

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          # compileSdk 必须 >= 35：androidx.core 1.15.0 / core-ktx 1.15.0 的
          # AAR metadata 明确要求依赖方 compileSdk >= 35，否则 gradle 在
          # :app:checkDebugAarMetadata 阶段直接失败。
          echo "== 安装 platform-tools / platforms;android-35 / build-tools;35.0.0"
          if ! "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" 2>&1 | tail -5; then
            echo "[error] sdkmanager 安装失败"
            exit 1
          fi
          echo "== 已安装的 platforms:"
          ls "$ANDROID_SDK_ROOT/platforms" 2>/dev/null | sed 's/^/    /'

      # ----------------------------------------------------------------------
      # 关键步骤：把预编译的 Node 运行时取回来，替代"现场编译 2~3 小时"。
      # ----------------------------------------------------------------------
      - name: Fetch prebuilt Node runtime from pinned release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="node-runtime-${NODE_VERSION}-${ABI}"
          echo "== 从 Release 获取预编译运行时: $TAG =="

          rm -rf /tmp/rt && mkdir -p /tmp/rt

          # 若该 tag 不存在，给出可操作的指引而不是一个含糊的 404。
          if ! gh release view "$TAG" --repo '${{ github.repository }}' >/dev/null 2>&1; then
            echo "[error] 找不到 Release: $TAG"
            echo
            echo "说明该版本的预编译运行时尚未固化。固化属于 **Runtime 版本流**，只有一条链会写它："
            echo "  推 tag: runtime-release-<NODE_VERSION>-<ABI>   （触发 build-apk.yml 全量交叉编译并固化）"
            echo
            echo "（那条链在同一轮构建里就地提取并校验两个 .so，不再从别的 run 回取产物）"
            exit 1
          fi

          # 资产清单来自 .github/native-assets.txt（NativeAssetRegistry 的投影）。
          # 这样加新二进制时只需改注册表 + 这份清单，不用再回来改 workflow。
          # 清单为空或读不到即中止 —— 静默降级会让 APK 悄悄少装东西。
          ASSETS_FILE=".github/native-assets.txt"
          [ -f "$ASSETS_FILE" ] || { echo "[error] 找不到 $ASSETS_FILE"; exit 1; }
          ASSETS="$({ grep -v '^[[:space:]]*#' "$ASSETS_FILE" | grep -v '^[[:space:]]*$' || true; } | tr -d '\r')"
          [ -n "$ASSETS" ] || { echo "[error] $ASSETS_FILE 里没有任何资产"; exit 1; }
          echo "== 资产清单（取自 $ASSETS_FILE）=="
          echo "$ASSETS" | sed 's/^/  /'

          PATTERNS=""
          for a in $ASSETS; do PATTERNS="$PATTERNS --pattern $a"; done

          # shellcheck disable=SC2086
          gh release download "$TAG" \
            --repo '${{ github.repository }}' \
            --dir /tmp/rt \
            $PATTERNS --pattern 'manifest.json'

          echo "== 下载内容 =="
          ls -la /tmp/rt/

          # ---- 校验 sha256 ----
          # 必须校验。运行时是"外部输入的二进制"，不校验就等于把
          # "APK 里装了什么"交给运气；出问题时会极难定位。
          echo
          echo "== 校验 sha256 =="
          python3 - <<'PY'
          import json, hashlib, sys, pathlib
          m = json.load(open('/tmp/rt/manifest.json'))
          print(f"  manifest: version={m['version']} abi={m['abi']} from run {m.get('source_run')}")
          ok = True
          for name, meta in m['files'].items():
              p = pathlib.Path('/tmp/rt') / name
              if not p.exists():
                  print(f"  [MISSING] {name}"); ok = False; continue
              h = hashlib.sha256(p.read_bytes()).hexdigest()
              good = h == meta['sha256']
              print(f"  [{'ok' if good else 'MISMATCH'}] {name}  {p.stat().st_size} 字节")
              if not good:
                  print(f"      期望 {meta['sha256']}")
                  print(f"      实际 {h}")
                  ok = False
          sys.exit(0 if ok else 1)
          PY

          # ---- 放进 jniLibs ----
          # 文件名必须是 lib*.so：否则 AGP 不会把它当 native lib 处理，
          # 也就不会在安装时解压到可执行的 nativeLibraryDir（W^X 约束）。
          mkdir -p "container/app/src/main/jniLibs/${ABI}"
          for a in $ASSETS; do
            if [ ! -f "/tmp/rt/$a" ]; then
              echo "[error] Release 里没有 $a（清单要求它随包）"
              exit 1
            fi
            cp -f "/tmp/rt/$a" "container/app/src/main/jniLibs/${ABI}/$a"
            chmod +x "container/app/src/main/jniLibs/${ABI}/$a"
          done

          echo
          echo "== jniLibs 就位 =="
          ls -la "container/app/src/main/jniLibs/${ABI}/"

          # 记录用了哪份运行时 —— 出问题时能一眼看出 APK 里装的是哪次固化的产物。
          echo "runtime-tag=$TAG" >> "$GITHUB_ENV"

      - name: Gate — verify runtime is in place before gradle
        run: |
          set -euo pipefail
          D="container/app/src/main/jniLibs/${ABI}"
          # 清单驱动，与上面同一份文件；加资产不用改这里。
          ASSETS="$({ grep -v '^[[:space:]]*#' .github/native-assets.txt | grep -v '^[[:space:]]*$' || true; } | tr -d '\r')"
          [ -n "$ASSETS" ] || { echo "[error] .github/native-assets.txt 里没有任何资产 —— 下面的清单循环会一条都不检查就放行。"; exit 1; }
          for f in $ASSETS; do
            if [ ! -f "$D/$f" ]; then
              echo "[error] $D/$f 缺失 —— 打包会产出真机跑不起来的 APK，中止。"
              exit 1
            fi
            SIZE=$(stat -c%s "$D/$f")
            if [ "$SIZE" -lt 1000000 ]; then
              echo "[error] $D/$f 只有 $SIZE 字节，明显不是有效产物，中止。"
              exit 1
            fi
            echo "[ok] $f  $SIZE 字节"
          done

          # 依赖自解析门禁：目录里每个 .so 若 DT_NEEDED 了同目录的随包库，它必须自带
          # 含 $ORIGIN 的 DT_RUNPATH。不查这一条就会放行「只有靠调用方补
          # LD_LIBRARY_PATH 才跑得起来」的产物 —— 而 载荷 run_code 清空环境，那条路
          # 在真机上必然 CANNOT LINK。判据与 NativePreparer.probe 的裸环境探针同形。
          # readelf 由 binutils 提供；"工具没装"和"产物不合格"是两回事，缺就先装
          # （唯一宿主 scripts/ensure-tool.sh，判据本身只住 verify-runtime-elf.sh）。
          bash scripts/ensure-tool.sh readelf binutils
          bash scripts/verify-runtime-elf.sh "$D"

      - name: Gate — verify OTA public key anchor is weldable
        run: |
          set -euo pipefail
          # 本链出的包就是设备上那个**唯一验签信任源**的载体（assets/ota-public.pem）。
          # 判据只住 scripts/verify-ota-anchor.sh（build-apk 与 program-ota 同调；配对那一问
          # 在 program-ota，因为只有它拿得到私钥）。这里缺的是「锚点本身能不能用」这一问：
          # 焊一把解析不了的、或算法不是 ed25519 的公钥进 APK，此后每个 Program 包在所有设备上
          # 都判 signature-invalid，而这在打包期完全看不出来。
          bash scripts/ensure-tool.sh openssl openssl
          bash scripts/verify-ota-anchor.sh \
            --anchor container/app/src/main/assets/ota-public.pem

      - name: Build capability binaries (小件原生件)
        # 唯一实现：scripts/build-native-capabilities.sh —— 由本文件原样抽出（含设计注释）。
        # 抽出来的目的：固化（pin）job 能调同一份实现把产物发成不可变 Release；
        # 之后本步骤会改为「下载 + 校验 sha256」，不再每次现场编译。
        # 失败语义：bash / rg / PTY 探针为硬性必需（$PREFIX 依赖，无回退）；
        #          node-pty 走上游配方，软失败（终端降级，不陪葬其它能力）。
        run: bash scripts/build-native-capabilities.sh

      # 这里**不再有** npm 资产投放步骤：npm 与 git/curl/pnpm 同级，由 build-userland.yml 的
      # 构建口产出、经签名清单投放，APK 里留一份就是「谁生效取决于取件顺序」的第二事实源
      # （随包那份永远不随清单更新）。残留回潮由 scripts/verify-apk-native.sh 的第 6 格判红。

      # ADR-0005：Program**不随 APK 分发**。这里刻意**什么都不做** —— 曾经这一步会现场拉 Program 源码、
      # 签名、把 baseline.zip 塞进 APK，后果是"Program 一改就要重出 APK"。现在 Program 只从 OTA 源安装
      # （见 program-ota.yml）。若有人把 Program 塞回 assets/kernel，下面这条断言会直接红。
      - name: Assert the APK carries NO Program assets
        run: |
          set -euo pipefail
          KD=container/app/src/main/assets/kernel
          if [ -d "$KD" ] && [ -n "$(ls -A "$KD" 2>/dev/null)" ]; then
            echo "::error title=APK 含 Program 资产::ADR-0005 规定 Program 不随 APK 分发；assets/kernel 必须为空或不存在。"
            ls -la "$KD"
            exit 1
          fi
          echo "[ok] APK 不含 Program 资产（只从 OTA 源安装）"

      - name: Inject release keystore (optional, for stable signing)
        id: signing
        # 「设备能否自我升级 APK」的唯一开关。判据只有一份实现：
        # scripts/inject-apk-keystore.sh（三档退出语义写在那份脚本的头部，这里不复述）。
        # 本链路的【政策】分两档：构建校验轮退 10（没配密钥）可继续 —— 包本身可用，
        # 只是不能覆盖安装到既有设备上，这件事由后面的签名门禁打 ::warning:: 说清；
        # 退 2（配了却用不成）必须当场红，等 20 分钟后在签名步骤才炸会把真因
        # （base64 残缺）伪装成「密码/别名不对」。发布轮（os-release-* tag）由下面的
        # 签名门禁按 --require-stable 硬拦，没密钥就发不出去。
        #
        # secret 命名沿用仓库里既有的那一组（旧 release-admin repack 用的同一组），不另立一套；
        # 与 OTA Program 签名（ed25519）是两条独立信任根 —— 辨析见 scripts/keygen-android-keystore.sh 头注释。
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -uo pipefail
          rc=0
          bash scripts/inject-apk-keystore.sh || rc=$?
          if [ "$rc" = 2 ]; then
            echo "::error title=keystore 注入失败::ANDROID_KEYSTORE_BASE64 已配置但用不成（原因见上方 [error] 行）—— 不许带着坏配置继续构建。"
            exit 1
          fi
          [ "$rc" = 0 ] || echo "[lobos-signing] 按「未配置密钥」档继续：本次产物是 debug 签名包（构建校验轮允许；发布轮由下面的签名门禁按发布档硬拦）。"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Gate — verify APK signing identity（稳定签名）
        # 判据的唯一实现是 scripts/verify-apk-signing.sh（三档语义与动机见脚本头注释）。
        # 档位随**这一轮要不要投递**变，而不是随链路名变：
        #   · 构建校验轮（push / dispatch）允许 debug 档（脚本自己打 ::warning::）—— 取证要用它。
        #   · 发布轮（os-release-* tag）**要求稳定签名**：全仓只剩这一颗投递口，发出去就是
        #     设备侧那个 versionCode 的持有者。一次性 debug 签名会把既有设备打成
        #     INSTALL_FAILED_UPDATE_INCOMPATIBLE，而锚点在时必须逐指纹比对（这一格以前查不出来）。
        run: |
          set -euo pipefail
          APK="$(bash scripts/pick.sh apk-debug container/app/build/outputs/apk/debug -name '*.apk' -type f)"
          ARGS=()
          [ -z "${LOBOS_APK_CERT_FILE:-}" ] || ARGS=(--cert "$LOBOS_APK_CERT_FILE")
          case "${GITHUB_REF:-}" in refs/tags/os-release-*) ARGS+=(--require-stable) ;; esac
          bash scripts/verify-apk-signing.sh "$APK" "${ARGS[@]}"

      - name: Audit APK contents
        # 判据的唯一实现是 scripts/verify-apk-native.sh（与 build-apk 同调，
        # 缺件/Program 资产/npm/adb-client 逐条硬红，动机见脚本头注释）。
        run: |
          set -euo pipefail
          APK="$(bash scripts/pick.sh apk-debug container/app/build/outputs/apk/debug -name '*.apk' -type f)"
          bash scripts/verify-apk-native.sh "$APK" "$ABI"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lobos-apk
          path: container/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          # 这份是**取证用的构件**，不是发布物：发布物只有下面 v<versionName> 归档里那颗。
          # 旧注释说它是 release-admin pin-node 的「唯一裸 .so 来源」—— 那条投递口已随
          # release-admin 一起废除（Node 固化改在 build-apk 同一轮里做，产物就在它自己的工作树），
          # 所以这里不再有跨 run 的下游读者，留 3 天只为事后翻查当轮构建。
          retention-days: 3

      - name: Publish APK to Release
        # 全仓**唯一**的壳 APK 投递口。触发条件只有一条：ref 是 `os-release-<versionName>-<versionCode>`
        # 且那两个数与 version.json 逐字相等（下面现算现比）。push 到 main / dispatch / 任意别的
        # tag 形态一律**不投递**（构建校验照跑）。旧形态是「合并即出包」+「fast-* 任意 tag 也能出包」，
        # 于是发布不是一个决定，而是一个副作用（见 docs/adr/0011）。
        if: ${{ startsWith(github.ref, 'refs/tags/os-release-') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK="$(bash scripts/pick.sh apk-debug container/app/build/outputs/apk/debug -name '*.apk' -type f)"
          VN="$(node -p "require('./version.json').shell.versionName")"
          VC="$(node -p "require('./version.json').shell.versionCode")"
          # ── 发布决定的一致性：tag 名 == version.json == 本次产物 ─────────────────────
          # 为什么必须比：tag 是「人要发这一版」的唯一凭据，而 APK 是从 ref 检出的工作树构建的。
          # 若有人对旧 ref 打新 tag（或先打 tag 再 bump），发出去的东西与 tag 说的不是同一版，
          # 那正是 ADR-0004 要防的「内容变了但版本没变」的镜像形状 —— 版本变了而内容没变。
          WANT="os-release-${VN}-${VC}"
          if [ "${GITHUB_REF_NAME:-}" != "$WANT" ]; then
            echo "::error title=发布 tag 与版本事实源不符::tag 是 ${GITHUB_REF_NAME:-空}，而 version.json 说的是 $WANT。" \
              && echo "::error::要么重打一个名字与 version.json 相符的 tag，要么先 bump version.json 再打 tag —— 本次不投递。"
            exit 1
          fi
          VAPK="app-debug-${VN}+${VC}.apk"
          echo "[version] 本次发布 $VN (versionCode=$VC) → $VAPK，tag=$GITHUB_REF_NAME"

          # 先改名再交出去：gh 的资产名取 file 的 basename（`#` 后面只是 label，不改名），
          # 所以"版本化资产名"只能靠这份临时目录里的副本实现。
          VDIR="$(mktemp -d)"
          cp "$APK" "$VDIR/$VAPK"

          # ── 版本门禁（判据 scripts/verify-apk-version-gate.sh，取数外壳
          #    scripts/check-apk-release-version.sh）─────────────────────────────
          # 通道**恒为 auto**：全仓只剩这一个投递口，而它每次都带版本号，所以旧的那格
          # 「显式通道允许同版本重发（修投递）」已无对应场景 —— 投递坏了的正确反应是
          # bump 一个版本号，而不是让同一个 versionCode 指向另一批字节。
          # 参照物 = 这条链自己写的 `v<versionName>` 归档族读数（read-archived-shell-version.sh），
          # 再加第二格回执账本（read-apk-receipts.sh）两格取严 —— 线上那格可以被删小，
          # 账本那格住在只追加分支里删不动（债表 DS-14 定性 + DS-16 实测）。
          TAG="archive"
          bash scripts/check-apk-release-version.sh version.json "$TAG" auto

          # 版本化资产进**独立 tag**（v<versionName>）。全仓**不再有滚动别名**：
          # 旧的 apk-latest 由三条链各自覆盖、且 2026-09-30 线上现读根本不存在，
          # 设备上没有任何东西读它（注册表 DS-11 实读）⇒ 随那三条投递口一起废除。
          VTAG="v$VN"
          bash scripts/gh-release-upload.sh "$VTAG" \
            --title "Lob OS $VN" \
            --notes "版本化归档：versionName=$VN，versionCode=$VC。发布由 os-release-${VN}-${VC} tag 决定；全仓无滚动别名。" "$VDIR/$VAPK"

          # ── 发布回执记账（唯一写入口，排在投递成功之后）────────────────────────────
          # 账要记的是「已经发出去了」这件事，先记账再上传就会留下「账上有而线上没有」的反向缺口。
          # 判红就让它红：账没记上必须在这轮 CI 上看见，不许把「下一轮拿更小的下界比」
          # 当成正常（同一门禁不许有第二份写入路径，所以这里只有宿主这一处调用）。
          bash scripts/append-apk-receipt.sh fast-apk auto version.json \
            "$VDIR/$VAPK" \
            "https://github.com/${{ github.repository }}/releases/download/$VTAG/${VAPK}"

          rm -rf "$VDIR"
          echo
          echo "下载地址（唯一投递口，只发版本化归档）:"
          echo "  https://github.com/${{ github.repository }}/releases/download/$VTAG/${VAPK}"

      - name: Gate — APK 形态（两侧对照，含 release 变体控件构建）
        id: formgate
        # 判据的唯一实现是 scripts/verify-apk-release-form.sh。本链当前投递的是版本化归档
        # （debug 形态，真机取证 run-as 要用；换成 release 形态是债 AUD-G33/E3.3，
        #  代价=存量设备必须卸载重装 = 供给与 adb 配对全部重跑，那一步归人定时机），所以
        # 这里不拦发布，只做两件事：
        # ① 让这把尺子每次构建都被两侧检验：debug 档必须被读成 debuggable。
        #    只测「release 侧判绿」的尺子分不清「包真的干净」与「解析根本没生效」——
        #    对照组红点会直接说「形态门禁失灵」，这是这条门禁不空转的前提。
        # ② 每次构建都真的跑一次 assembleRelease。全仓只剩这一条 APK 构建链，
        #    「这个变体到底构建得出来吗、出来的是不是非 debuggable」只能在这里被回答
        #    （债 AUD-G33 的成因之一就是发布路径长期不被执行）。
        # 排在 Publish 之后：控件构建坏了要让人看见（job 判红），但不该把已经判过的
        # 归档投递一起咽掉 —— 形态那半是 AUD-G33 的账，不是这一轮的闸门。
        # 这里【不】跑签名门禁：无 keystore 时 AGP 出的是 app-release-unsigned.apk，
        # 拿它去查签名只会得到「读不出证书」这种与形态无关的噪音。
        run: |
          set -euo pipefail
          DAPK="$(bash scripts/pick.sh apk-debug container/app/build/outputs/apk/debug -name '*.apk' -type f)" \
            || { echo "[error] 没有可核验的 debug APK —— 门禁不许空跑"; exit 1; }
          bash scripts/verify-apk-release-form.sh "$DAPK" --expect-debuggable
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          RAPK="$(bash scripts/pick.sh apk-release container/app/build/outputs/apk/release -name '*.apk' -type f)" \
            || { echo "[error] release 变体没产出 APK —— 形态无从核验，判红"; exit 1; }
          bash scripts/verify-apk-release-form.sh "$RAPK"
