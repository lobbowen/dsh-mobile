name: Admin (cancel / status)

# ============================================================================
# 为什么要这个 workflow
# ============================================================================
# 维护环境（沙箱）没有可用的 GitHub API token（PAT 已失效、gh CLI 401），
# 唯一的通道是 git push。但有些事【只能通过 API 做】，最典型的是：
# · 取消一个正在跑的 run（不能在沙箱侧 gh run cancel）
# · 查某个 run 的状态与 artifact
#
# GitHub 提供 GITHUB_TOKEN（每个 run 自动注入、权限受 permissions 控制），
# 所以只要能让一个 workflow 跑起来，它就能替我们做这些 API 操作。
# 触发手段就是 tag —— 一条 git push 即可，不需要网页，也不需要 PAT。
#
# tag 语法（命令 → 动作）
# admin-cancel-<run_id> 取消指定 run
# admin-status-<run_id> 查询指定 run 状态 + artifact 列表
# admin-logs-<run_id> 拉取指定 run 的失败步骤日志（排查 CI 失败用）
# admin-apk-<run_id> 校验某 run 产物 APK 的 lib/ 内容 + ELF 形态校验
# （沙箱下载不了 Release 附件 / artifact 302 到被屏蔽的
# release-assets.githubusercontent.com，只能在 CI 侧验）
# admin-release[-<tag>] 查询 Release 附件（默认 apk-latest）
# admin-cancelall 取消所有 queued/in_progress 的 run（除自己）
#
# 例：git push origin HEAD:refs/tags/admin-cancel-34880060734
# 结果会写进 ci-admin 分支，沙箱侧 fetch 该分支即可读到。
#
# 为什么要 logs：CI 一次失败动辄要等几十分钟，而失败原因在外部
# （沙箱屏蔽 api.github.com）读不到。没有这个命令就只能靠猜着改、
# 再等一轮，代价极高。
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '执行哪个 Release 工具'
        required: true
        type: choice
        options: [publish, repack, pin]
        default: publish
      run_id:
        description: 'publish/pin：源运行 ID（留空=最近一次成功）'
        required: false
        default: ''
      source_run_id:
        description: 'repack：源 APK run ID（留空=最近一次成功）'
        required: false
        default: ''
      version:
        description: 'pin：Node 版本号（如 24.21.0）'
        required: false
        default: ''
      abi:
        description: 'pin：目标 ABI'
        required: false
        default: 'arm64-v8a'
      tag:
        description: 'publish/repack：目标 Release tag'
        required: false
        default: 'apk-latest'
  push:
    tags:
      - 'admin-*'
      - 'publish-*'
      - 'repack-*'
      - 'pin-node-*'

permissions:
  actions: write
  contents: write

jobs:
  admin:
    if: ${{ startsWith(github.ref_name, 'admin-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse action from tag
        id: act
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME:-}"
          echo "tag=$TAG"
          CMD="${TAG#admin-}"
          echo "cmd=$CMD"
          echo "cmd=$CMD" >> "$GITHUB_OUTPUT"
          case "$CMD" in
            cancelall)
              echo "kind=cancelall" >> "$GITHUB_OUTPUT" ;;
            cancel-*)
              echo "kind=cancel"   >> "$GITHUB_OUTPUT"
              echo "target=${CMD#cancel-}" >> "$GITHUB_OUTPUT" ;;
            status-*)
              echo "kind=status"   >> "$GITHUB_OUTPUT"
              echo "target=${CMD#status-}" >> "$GITHUB_OUTPUT" ;;
            release-*)
              echo "kind=release"  >> "$GITHUB_OUTPUT"
              echo "target=${CMD#release-}" >> "$GITHUB_OUTPUT" ;;
            release)
              echo "kind=release"  >> "$GITHUB_OUTPUT"
              echo "target=apk-latest" >> "$GITHUB_OUTPUT" ;;
            logs-*)
              echo "kind=logs"     >> "$GITHUB_OUTPUT"
              echo "target=${CMD#logs-}" >> "$GITHUB_OUTPUT" ;;
            apk-*)
              # 校验某个 run 产物 APK 的内容（主要看 lib/ 下有没有清单资产）。
              #
              # 为什么需要：维护沙箱的外网白名单不含 release-assets.githubusercontent.com，
              # 下载不了 Release 附件；而 artifact 走 api.github.com 的 302 同样到不了。
              # 所以「APK 里到底装了什么」这件事只能在 CI 侧验证 —— 不能让
              # 「我本地验证过了」变成一句无法兑现的话。
              echo "kind=apk"      >> "$GITHUB_OUTPUT"
              echo "target=${CMD#apk-}" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "[error] 未知动作: $CMD"
              echo "kind=unknown" >> "$GITHUB_OUTPUT"
              exit 1 ;;
          esac

      - name: Execute
        id: exec
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          KIND: ${{ steps.act.outputs.kind }}
          TARGET: ${{ steps.act.outputs.target }}
          SELF_RUN: ${{ github.run_id }}
        run: |
          set -uo pipefail
          OUT=/tmp/admin.txt
          {
            echo "ADMIN_REPORT"
            echo "time  : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "tag   : ${GITHUB_REF_NAME}"
            echo "kind  : $KIND"
            echo "target: ${TARGET:-(n/a)}"
            echo
          } > "$OUT"

          case "$KIND" in
            cancel)
              echo "== 取消 run $TARGET ==" >> "$OUT"
              if gh run cancel "$TARGET" --repo "$REPO" >> "$OUT" 2>&1; then
                echo "结果: 取消请求已发送" >> "$OUT"
              else
                echo "结果: 取消失败（可能已结束或 ID 不存在）" >> "$OUT"
              fi
              sleep 15
              echo >> "$OUT"
              echo "=== 取消后状态 ===" >> "$OUT"
              gh run view "$TARGET" --repo "$REPO" --json status,conclusion \
                --jq '" status=\(.status) conclusion=\(.conclusion)"' >> "$OUT" 2>&1 || true
              ;;

            cancelall)
              echo "== 取消所有非本 run 的 queued/in_progress ==" >> "$OUT"
              # 注意：不能连自己一起取消，否则后面的 push 上报会被中断。
              for st in queued in_progress; do
                gh run list --repo "$REPO" --status "$st" --limit 50 \
                  --json databaseId,workflowName,headSha \
                  --jq '.[] | "\(.databaseId)\t\(.workflowName)\t\(.headSha[0:7])"' \
                | while IFS=$'\t' read -r rid wf sha; do
                    [ -z "$rid" ] && continue
                    if [ "$rid" = "$SELF_RUN" ]; then
                      echo "  [skip] $rid  $wf  $sha  (本 run)" >> "$OUT"
                      continue
                    fi
                    echo "  [cancel] $rid  $wf  $sha" >> "$OUT"
                    gh run cancel "$rid" --repo "$REPO" >>"$OUT" 2>&1 || true
                  done
              done
              sleep 15
              echo >> "$OUT"
              echo "=== 剩余在跑 ===" >> "$OUT"
              gh run list --repo "$REPO" --status in_progress --limit 20 \
                --json databaseId,workflowName \
                --jq '.[] | " \(.databaseId) \(.workflowName)"' >> "$OUT" 2>&1 || true
              ;;

            status)
              echo "== run $TARGET 详情 ==" >> "$OUT"
              gh run view "$TARGET" --repo "$REPO" \
                --json databaseId,workflowName,headSha,status,conclusion,createdAt,updatedAt,url \
                --jq '" wf : \(.workflowName)\n sha : \(.headSha[0:7])\n status: \(.status)\n concl : \(.conclusion)\n start : \(.createdAt)\n end : \(.updatedAt)\n url : \(.url)"' >> "$OUT" 2>&1 || true

              echo >> "$OUT"
              echo "=== artifact 列表 ===" >> "$OUT"
              gh api "repos/$REPO/actions/runs/$TARGET/artifacts" \
                --jq '.artifacts[] | " id=\(.id) \(.name) \(.size_in_bytes)B expired=\(.expired) digest=\(.digest // "n/a")"' >> "$OUT" 2>&1 || true
              ;;

            release)
              echo "== Release: $TARGET 的附件 ==" >> "$OUT"
              gh release view "$TARGET" --repo "$REPO" \
                --json tagName,name,createdAt,publishedAt,url,assets \
                --jq '" tag : \(.tagName)\n name : \(.name)\n url : \(.url)\n pub : \(.publishedAt)\n\n附件:"' >> "$OUT" 2>&1 || true
              gh release view "$TARGET" --repo "$REPO" --json assets \
                --jq '.assets[] | " \(.name) \(.size) 字节 state=\(.state) digest=\(.digest // "n/a")\n updatedAt=\(.updatedAt)"' >> "$OUT" 2>&1 || true
              ;;

            logs)
              # 拉取失败 run 的日志。没有这个能力时，CI 失败只能靠猜 ——
              # 这在"每次失败要等几十分钟"的场景下代价极高。
              echo "== run $TARGET 的失败日志 ==" >> "$OUT"
              gh run view "$TARGET" --repo "$REPO" \
                --json status,conclusion,workflowName,headSha,url \
                --jq '" wf : \(.workflowName)\n sha : \(.headSha[0:7])\n status: \(.status)\n concl : \(.conclusion)\n url : \(.url)"' >> "$OUT" 2>&1 || true

              echo >> "$OUT"
              echo "=== 各步骤结果 ===" >> "$OUT"
              gh run view "$TARGET" --repo "$REPO" \
                --json jobs \
                --jq '.jobs[] | .name as $j | .steps[] | " [\(.conclusion // .status)] \($j) :: \(.name)"' >> "$OUT" 2>&1 || true

              echo >> "$OUT"
              echo "=== 失败步骤日志（仅 failed 步骤） ===" >> "$OUT"
              # --log-failed 只输出失败步骤，避免几百 KB 噪音。
              gh run view "$TARGET" --repo "$REPO" --log-failed >> "$OUT" 2>&1 || {
                echo "(--log-failed 不可用，回退到全量日志的尾部)" >> "$OUT"
                gh run view "$TARGET" --repo "$REPO" --log 2>&1 | tail -120 >> "$OUT" || true
              }
              ;;

            apk)
              # 用 .github/native-assets.txt 作为期望清单（与 gradle / 构建脚本同一来源），
              # 逐项核对 APK 内是否真有对应条目，并打印压缩方式。
              echo "== run $TARGET 的 APK 内容校验 ==" >> "$OUT"
              ABI="${ABI:-arm64-v8a}"
              W="/tmp/apkchk"
              rm -rf "$W"; mkdir -p "$W"

              echo "  [1/3] 下载 artifact（android-node-container-apk）" >> "$OUT"
              if ! gh run download "$TARGET" --repo "$REPO" \
                     --name android-node-container-apk --dir "$W" >> "$OUT" 2>&1; then
                echo "  [FAIL] artifact 下载失败（已过期？run 失败？）" >> "$OUT"
              elif ! APK="$(bash scripts/pick.sh ci-ok-apk "$W" -name '*.apk' -type f)"; then
                # 这一步没有 set -e，所以 pick.sh 的 exit 1 只会落在这里而不是中止整个 step。
                # 判红必须写在 $OUT 里：操作者读的是报告，不是 workflow 日志。
                echo "  [FAIL] artifact 里没有可判定的 APK（原因见上方 pick(ci-ok-apk) 的报错行）" >> "$OUT"
              else
                echo "  APK: $APK" >> "$OUT"
                echo "  大小: $(stat -c%s "$APK") 字节" >> "$OUT"
                echo "  sha256: $(sha256sum "$APK" | awk '{print $1}')" >> "$OUT"

                echo >> "$OUT"
                echo "  [2/3+3/3] APK 原生件审计（判据唯一实现 scripts/verify-apk-native.sh 的 --report 模式）" >> "$OUT"
                echo "            报告通道【永不判红】：同样的条目逐条打成 [ok]/[MISSING]/[FAIL] 事实。" >> "$OUT"
                # 本 case 块没有 set -e，仍显式吞退码：报告不许中断后面的 ELF 取证段。
                bash scripts/verify-apk-native.sh "$APK" "$ABI" --report 2>&1 \
                  | sed 's/^/  /' >> "$OUT" || true

                echo >> "$OUT"
                echo "  --- 独立校验：解出 libnode.so 的 ELF 形态（exec 四道关） ---" >> "$OUT"
                mkdir -p "$W/x"
                if unzip -o -q "$APK" "lib/${ABI}/libnode.so" -d "$W/x" 2>/dev/null; then
                  N="$W/x/lib/${ABI}/libnode.so"
                  echo "    文件: $(file -b "$N")" >> "$OUT"
                  echo "    e_machine/app:  $(readelf -h "$N" 2>/dev/null | awk -F: '/Machine/{print $2}' | xargs)" >> "$OUT"
                  echo "    interp:  $(readelf -W -l "$N" 2>/dev/null | awk '/interpreter/{print $NF}' | head -1)" >> "$OUT"
                  echo "    NEEDED:  $(readelf -d "$N" 2>/dev/null | awk '/NEEDED/{gsub(/[\[\]]/,"",$NF); printf "%s ", $NF}')" >> "$OUT"
                  echo "    LOAD 对齐: $(readelf -W -l "$N" 2>/dev/null | awk '/^  LOAD/{print $NF}' | sort -u | tr '\n' ' ')" >> "$OUT"
                else
                  echo "    [skip] 解不出 libnode.so" >> "$OUT"
                fi
              fi
              ;;

            *)
              echo "[error] 未处理的 kind=$KIND" >> "$OUT"
              ;;
          esac

          echo >> "$OUT"
          echo "=== 最近 8 个 run ===" >> "$OUT"
          gh run list --repo "$REPO" --limit 8 \
            --json databaseId,workflowName,headSha,status,conclusion,createdAt \
            --jq '.[] | " \(.databaseId) \(.headSha[0:7]) \(.status)/\(.conclusion) \(.workflowName)"' >> "$OUT" 2>&1 || true

          cat "$OUT"

      - name: Report to ci-admin
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          git config user.name  'CI Admin' || true
          git config user.email 'ci@workbuddy.local' || true
          git checkout --orphan ci-admin-tmp 2>/dev/null || git checkout ci-admin-tmp
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/admin.txt ci-admin.txt
          git add -f ci-admin.txt
          git commit -m "admin report: ${GITHUB_REF_NAME}" || true
          git push -f origin HEAD:ci-admin
  publish:
    if: ${{ startsWith(github.ref_name, 'publish-') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'publish') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write       # 建 Release / 传资产
      actions: read         # 列取/下载本仓库的 artifact

    steps:
      # 本 job 的每一步都靠仓内脚本取数（scripts/pick.sh 选 APK、check-apk-release-version.sh
      # 判版本）。没有这一步时它们全部不存在 —— 真机案底 2026-09-27：publish run 36254334150
      # 在第 2 步就 `bash: scripts/pick.sh: No such file or directory` 退 127，
      # 而这条判据只在本 job 被真实调用时才暴露（repack / pin 各自有 checkout，所以一直没红）。
      # 取 main 而不是触发 ref：与 repack 同理由 —— 判据要随 main 演进，不能是历史那份尺子。
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve target run and download artifact
        id: get
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          RUN_ID="${{ inputs.run_id }}"

          # tag 触发时（refs/tags/publish-<run_id>），从 tag 名解析 run_id。
          # 例：publish-34852369904 → RUN_ID=34852369904
          if [ -z "$RUN_ID" ] && [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            REF_TAG="${GITHUB_REF_NAME:-}"
            echo "== 由 tag 触发: $REF_TAG =="
            CAND="${REF_TAG#publish-}"
            if printf '%s' "$CAND" | grep -qE '^[0-9]+$'; then
              RUN_ID="$CAND"
              echo "从 tag 解析出 run_id=$RUN_ID"
            else
              echo "[warn] tag 名不是 publish-<run_id> 形式（got: $CAND），改为自动查找。"
            fi
          fi

          if [ -z "$TAG" ]; then TAG="apk-latest"; fi

          if [ -z "$RUN_ID" ]; then
            echo "== 未指定 run_id，自动查找最近一次成功运行 =="
            RUN_ID="$(gh run list \
                        --repo '${{ github.repository }}' \
                        --workflow 'build-apk.yml' \
                        --status success \
                        --limit 1 \
                        --json databaseId \
                        --jq '.[0].databaseId')"
            if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
              echo "[error] 找不到任何成功的 build-apk 运行。"
              echo "        请先让 Build Android Node Container APK 成功一次。"
              exit 1
            fi
          fi
          echo "目标 run: $RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

          echo "== 该 run 的 artifact 列表 =="
          gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}/artifacts" \
            --jq '.artifacts[] | "\(.name)  (\(.size_in_bytes) bytes, expired=\(.expired))"' || true

          echo "== 下载 artifact: android-node-container-apk =="
          rm -rf /tmp/dl && mkdir -p /tmp/dl
          gh run download "$RUN_ID" \
            --repo '${{ github.repository }}' \
            --name android-node-container-apk \
            --dir /tmp/dl

          echo "== 下载内容 =="
          # 纯列表：列不出来也不该中止这一步（真正的判空在下一行）
          { find /tmp/dl -type f | head -20 || true; }
          APK="$(bash scripts/pick.sh inject-apk /tmp/dl -name '*.apk' -type f)"
          echo "找到 APK: $APK ($(du -h "$APK" | cut -f1))"
          cp "$APK" /tmp/app-debug.apk
          ls -la /tmp/app-debug.apk

      - name: Publish to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          echo "== 发布到 Release tag: $TAG =="

          # ── 版本门禁（VERSION-GATE 3/4：判据 scripts/verify-apk-version-gate.sh）───────
          # 这条链路发的是**另一个 run** 的 APK，所以比较基准取那个 run 的提交里的清单（第 4 个参数），
          # 而不是本 workflow 自己 checkout 的那份 —— 否则发的包和读出的版本对不上，门禁成了自证。
          # 只判滚动通道：显式指定的其它 tag 是人自己开的新地址，不覆盖任何已交付的东西。
          # VG_SRC_DIR 让门禁把**它判定读到的那份清单**留一份出来，下面直接上传那一份：
          # 「校验的清单」与「发布的清单」因此是同一个字节串，不是两次各自取数。
          MANIFEST=""
          if [ "$TAG" = "apk-latest" ]; then
            VG_SRC_DIR=/tmp/channel-manifest \
              bash scripts/check-apk-release-version.sh version.json "$TAG" explicit "${{ steps.get.outputs.run_id }}"
            MANIFEST=/tmp/channel-manifest/version.json
          fi

          # tag 固定（默认 apk-latest）：下载网址稳定，不必每轮去查新地址。
          # 「确保 Release 在 → 覆盖上传（含孤立资产回退）→ 回读确认字节数」全部在
          # scripts/gh-release-upload.sh 里，本链路只交代内容。
          # 覆盖 latest 就必须同时把它的版本清单换成**这个包自己**那份，否则 latest 的
          # version.json 描述的是上一个包 —— 下一次门禁拿假读数比真产物。
          # 资产名取 file 的 basename（`#` 后面只是 label），所以 MANIFEST 必须是门禁
          # 留出来的、真名叫 version.json 的那份文件；取数只在 check-apk-release-version.sh 一处。
          EXTRA=(/tmp/app-debug.apk)
          if [ -n "$MANIFEST" ]; then
            EXTRA+=("$MANIFEST")
            echo "[version] latest 清单将与 APK 同批覆盖（来源 run ${{ steps.get.outputs.run_id }}）"
          fi
          bash scripts/gh-release-upload.sh "$TAG" \
            --title "DSH Mobile APK (latest)" \
            --notes "Android 原生 Node 容器 APK。来源 run: ${{ steps.get.outputs.run_id }}" \
            "${EXTRA[@]}"
          echo
          echo "下载地址:"
          echo "https://github.com/${{ github.repository }}/releases/download/${TAG}/app-debug.apk"

      - name: Record URL to ci-ok branch
        # 把可下载地址写进 ci-ok 自报分支，便于外部读取（环境限制下这是主要通道）。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory '*'
          rm -rf /tmp/okp && mkdir -p /tmp/okp && cd /tmp/okp
          git clone --quiet \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" . || {
              echo "[warn] clone 失败，跳过 ci-ok 更新"; exit 0; }
          {
            echo "BUILD_OK"
            echo "time : $(date -u)"
            echo "from : published from run ${{ steps.get.outputs.run_id }}"
            echo "apk  : app-debug.apk"
            echo "url  : https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag }}/app-debug.apk"
          } > ci-ok.txt
          git config user.email "ci@workbuddy.local"
          git config user.name "CI Diagnostic Bot"
          git add ci-ok.txt
          git commit -q -m "ci: apk published" || true
          git push origin HEAD:ci-ok --force && echo "[ok] ci-ok updated"
  repack:
    if: ${{ startsWith(github.ref_name, 'repack-') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'repack') }}
    concurrency:
      group: repack-apk
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      # 判据（scripts/verify-runtime-elf.sh）要随 main 演进：repack-* tag 上那份脚本
      # 可能是历史版本，用它校验等于用旧尺子量新产物。
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve source run id
        id: src
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUN_ID="${{ inputs.source_run_id }}"

          # tag 触发：repack-<run_id>
          if [ -z "$RUN_ID" ] && [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            REF_TAG="${GITHUB_REF_NAME:-}"
            echo "== 由 tag 触发: $REF_TAG =="
            CAND="${REF_TAG#repack-}"
            if printf '%s' "$CAND" | grep -qE '^[0-9]+$'; then
              RUN_ID="$CAND"
            fi
          fi

          if [ -z "$RUN_ID" ]; then
            echo "== 未指定，自动查找最近一次成功的 Build APK =="
            RUN_ID="$(gh run list \
                        --repo '${{ github.repository }}' \
                        --workflow 'build-apk.yml' \
                        --status success --limit 1 \
                        --json databaseId --jq '.[0].databaseId')"
          fi
          [ -n "$RUN_ID" ] && [ "$RUN_ID" != "null" ] || { echo "[error] 找不到源 run"; exit 1; }
          echo "源 run: $RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download source artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUN_ID="${{ steps.src.outputs.run_id }}"
          rm -rf /tmp/dl && mkdir -p /tmp/dl
          gh run download "$RUN_ID" \
            --repo '${{ github.repository }}' \
            --name android-node-container-apk \
            --dir /tmp/dl
          APK="$(bash scripts/pick.sh pin-src-apk /tmp/dl -name '*.apk' -type f)"
          echo "源 APK: $APK ($(du -h "$APK" | cut -f1))"
          cp "$APK" /tmp/app-src.apk

      - name: Inject libc++_shared.so
        run: |
          set -euo pipefail
          # 从 NDK 里取 libc++_shared.so（arm64-v8a）
          # --allow-empty：这两条是「先试 A、空了再试 B」的探测链，判空由块尾那条硬失败负责。
          # 原来用裸 `find … | head -1`：A 不存在时 find 非零 → pipefail 直接中止 step，
          # B 那一路永远轮不到，兜底是假的。
          LIBCXX="$(bash scripts/pick.sh --allow-empty libcxx-ndk "$ANDROID_NDK_LATEST_HOME" -path '*sysroot/usr/lib/aarch64-linux-android/libc++_shared.so' -type f)"
          if [ -z "$LIBCXX" ]; then
            # 兜底：从 runner 上已安装的任意 NDK 里找。这一根下会有多个 NDK 版本目录、
            # 各自一份 libc++_shared.so 且内容不同 —— 命中天然歧义，按版本取末位（= 最新 NDK），
            # 不能让它走默认的「歧义即红」，否则 runner 装了几个 NDK 就成了随机红点。
            LIBCXX="$(bash scripts/pick.sh --allow-empty --last libcxx-any-ndk /usr/local/lib/android/sdk/ndk -path '*sysroot/usr/lib/aarch64-linux-android/libc++_shared.so' -type f)"
          fi
          [ -n "$LIBCXX" ] || { echo "[error] 找不到 libc++_shared.so"; exit 1; }
          echo "libc++_shared.so: $LIBCXX ($(stat -c%s "$LIBCXX") 字节)"

          python3 scripts/inject-libcxx-into-apk.py \
            --apk /tmp/app-src.apk \
            --out /tmp/app-injected.apk \
            --libcxx "$LIBCXX"
          ls -la /tmp/app-injected.apk

      - name: Verify injected APK
        run: |
          set -euo pipefail
          cat > /tmp/verify.py <<'PY'
          import zipfile, sys
          z = zipfile.ZipFile('/tmp/app-injected.apk')
          names = [i.filename for i in z.infolist()]
          for want in ('lib/arm64-v8a/libnode.so', 'lib/arm64-v8a/libc++_shared.so'):
              if want not in names:
                  sys.exit('[error] 缺少 %s' % want)
              print('[ok] %s' % want)
          if any('node-bin' in n for n in names):
              sys.exit('[error] 仍存在旧的 assets/node-bin 条目')
          bad = z.testzip()
          if bad:
              sys.exit('[error] CRC 校验失败: %s' % bad)
          print('[ok] CRC 全部通过')
          PY
          python3 /tmp/verify.py

          # 上面的 verify.py 只回答「条目在不在、CRC 好不好」——那是**打包**层面的完整性。
          # 装到真机上跑不跑得起来是另一件事：libnode.so 依赖同目录的 libc++_shared.so，
          # 而 dsh run_code 从空环境起子进程，补不到 LD_LIBRARY_PATH，
          # 本体必须自带含 $ORIGIN 的 DT_RUNPATH。repack 完全可能被人拿来重签一个
          # 「修复之前」的包 —— 那种包条目齐全、CRC 正确、签名也没问题，装上就是 CANNOT LINK。
          # 判据与构建期/打包期/pin 同源（scripts/verify-runtime-elf.sh），这里不再自己写一份。
          echo "== 依赖自解析门禁（DT_RUNPATH 含 \$ORIGIN）=="
          bash scripts/ensure-tool.sh readelf binutils
          rm -rf /tmp/repack-libs && mkdir -p /tmp/repack-libs
          python3 - <<'PY'
          import os, zipfile
          z = zipfile.ZipFile('/tmp/app-injected.apk')
          out = '/tmp/repack-libs'
          n = 0
          for i in z.infolist():
              if i.filename.startswith('lib/arm64-v8a/') and i.filename.endswith('.so'):
                  with open(os.path.join(out, os.path.basename(i.filename)), 'wb') as f:
                      f.write(z.read(i))
                  n += 1
          print('[ok] 解出 %d 个 arm64-v8a 原生库' % n)
          PY
          bash scripts/verify-runtime-elf.sh /tmp/repack-libs

      - name: Sign APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # repack 的默认发布目标就是 apk-latest（下一步）——那是存量设备的更新通道。
          # 一次性 debug 密钥重签的包会把稳定签名的装机群打成 INSTALL_FAILED_UPDATE_INCOMPATIBLE，
          # 所以这里**没有兜底**：缺 keystore = 判红。原先的「debug 签名足够」是 repack
          # 还只用于自测、没接发布通道时代的遗物（2026-09-26 收口，与 fast-apk 的
          # 「配了 keystore 却出 debug 签名 → 硬红」同一判据方向）。
          #
          # 解码 + keytool 核验 + 锚点导出收口到 scripts/inject-apk-keystore.sh（与另两条链路
          # 同一份实现）。这里额外解决的是 secret 的落点：以前四个 secret 的表达式是直接内插进
          # 【步骤正文】的，GitHub 会把展开后的整段脚本打回日志（secret 掩码只护得住已登记值），
          # 现在 secret 只进步骤 env，脚本按环境变量名读取。
          # apksigner 那一侧仍用 pass: —— 它的 env:/file: 形态本仓没有可查证的先例，
          # 不拿发布链路去猜（猜错的代价是 repack 整条路红，且只有真跑过才知道）。
          rc=0
          bash scripts/inject-apk-keystore.sh "$RUNNER_TEMP/keys" || rc=$?
          if [ "$rc" = 10 ]; then
            echo "::error title=未配置 ANDROID_KEYSTORE_BASE64::repack 会发布到 apk-latest，禁止临时 debug 签名兜底"
            exit 1
          fi
          [ "$rc" = 0 ] || exit 1
          KS="$RUNNER_TEMP/keys/release.keystore"
          echo "== 使用仓库配置的 keystore =="

          APKSIGNER="$(bash scripts/pick.sh --last apksigner "$ANDROID_HOME/build-tools" -name apksigner -type f)"
          "$APKSIGNER" sign \
            --ks "$KS" --ks-pass "pass:$KS_PASS" \
            --ks-key-alias "${KS_ALIAS:-dsh}" --key-pass "pass:$KS_KEYPASS" \
            --min-sdk-version 24 --max-sdk-version 35 \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out /tmp/app-signed.apk /tmp/app-injected.apk

          "$APKSIGNER" verify --verbose /tmp/app-signed.apk
          # 签完再走同一道身份门禁：重签出来的包必须与注入锚点逐指纹一致，且不得是 debug
          # 身份。以前这里只有 `verify --verbose`（它只回答「签名结构有效吗」，不回答
          # 「是哪把 key 签的」），别名取错或 keystore 换过都会照常投给存量设备。
          bash scripts/verify-apk-signing.sh /tmp/app-signed.apk \
            --require-stable --cert "$RUNNER_TEMP/keys/release.cert"
          ls -la /tmp/app-signed.apk

      - name: Publish to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          [ -n "$TAG" ] || TAG="apk-latest"
          echo "== 发布到 tag: $TAG =="

          # ── 版本门禁（VERSION-GATE 4/4：判据 scripts/verify-apk-version-gate.sh）───────
          # repack 改的是包内字节（注入 libc++_shared.so）但**不换版本号**，所以这里比较的是
          # 「来源 run 那份清单」与线上：同版本在显式通道放行正是本条链路的正当用法（重投修复过的包），
          # 而把 latest 换成一个更旧的号仍然判红。清单同批同步，理由与 publish 模式那条一样。
          MANIFEST=""
          if [ "$TAG" = "apk-latest" ]; then
            VG_SRC_DIR=/tmp/repack-manifest \
              bash scripts/check-apk-release-version.sh version.json "$TAG" explicit "${{ steps.src.outputs.run_id }}"
            MANIFEST=/tmp/repack-manifest/version.json
          fi

          # repack 换的是包内字节，但投出去必须用设备真正去读的那个**资产名**：
          # gh 的资产名取 file 的 basename（`#` 后面只是 label）—— 旧写法把
          # /tmp/app-signed.apk 投成了 app-signed.apk、还把 app-debug.apk 先删了，
          # latest 的下载地址当场 404。所以先改名进临时目录再交出去，
          # 「线上真有了这个名字、字节也对」由宿主事后回读确认。
          STAGE="$(mktemp -d)"
          cp /tmp/app-signed.apk "$STAGE/app-debug.apk"
          EXTRA=("$STAGE/app-debug.apk")
          if [ -n "$MANIFEST" ]; then
            EXTRA+=("$MANIFEST")
            echo "[version] latest 清单将与重签包同批覆盖（来源 run ${{ steps.src.outputs.run_id }}）"
          fi
          bash scripts/gh-release-upload.sh "$TAG" \
            --title "Node Container APK ($TAG)" \
            --notes "repack from run ${{ steps.src.outputs.run_id }}：注入 libc++_shared.so，修复 cannot locate symbol。" \
            "${EXTRA[@]}"
          rm -rf "$STAGE"

      - name: Report to ci-ok
        if: always()
        env:
          GH_TOKEN: >-
            ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          # 把「产物指纹」上报到 ci-ok 分支。
          # 为什么这么做：维护环境（沙箱）无法直连 github.com / objects.githubusercontent.com
          # 下载 Release 附件，只能靠 CI 自报指纹来远程确认「发出去的包里到底有什么」。
          # 所以这里必须报告【可验证的事实】，而不是一句"成功"。
          {
            echo "REPACK_REPORT"
            echo "time : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "from : run ${{ steps.src.outputs.run_id }}"
            echo "job  : ${{ job.status }}"
            echo "note : 注入 libc++_shared.so，修复 cannot locate symbol"
            echo
            echo "=== APK 指纹 (/tmp/app-signed.apk) ==="
            if [ -f /tmp/app-signed.apk ]; then
              echo "size  : $(stat -c%s /tmp/app-signed.apk) 字节"
              echo "sha256: $(sha256sum /tmp/app-signed.apk | cut -d' ' -f1)"
              echo "md5   : $(md5sum /tmp/app-signed.apk | cut -d' ' -f1)"
            else
              echo "(APK 不存在 —— 前面某步失败了)"
            fi
            echo
            echo "=== lib/ 内容 ==="
            if [ -f /tmp/app-signed.apk ]; then
              # 同一条审计的唯一实现（--report = 永不判红，这里只取它的 lib/ 段）
              bash scripts/verify-apk-native.sh /tmp/app-signed.apk arm64-v8a --report 2>/dev/null \
                | sed -n '/lib\/ 下的条目/,/^$/p' | sed 's/^/  /' || echo "(unzip 读不出条目清单)"
            fi
            echo
            echo "=== 签名方案 ==="
            if [ -f /tmp/app-signed.apk ]; then
              # --allow-empty：这是报告通道，「没有 apksigner」必须写成一行报告。
              # 少了判空，下面的 "$APKSIGNER" verify 会以空命令串失败，再被 || true 咽掉 ——
              # 报告里那一节就变成一句噪音，看不出是「没装工具」还是「签名方案有问题」。
              APKSIGNER="$(bash scripts/pick.sh --allow-empty --last apksigner "$ANDROID_HOME/build-tools" -name apksigner -type f)"
              if [ -n "$APKSIGNER" ]; then
                "$APKSIGNER" verify --verbose /tmp/app-signed.apk 2>&1 || true
              else
                echo "(runner 上没找到 apksigner —— 本节无数据)"
              fi
            fi
            echo
            echo "=== Release 里的附件 ==="
            gh release view "${{ inputs.tag || 'apk-latest' }}" \
              --repo '${{ github.repository }}' --json assets \
              --jq '.assets[] | "  \(.name)  \(.size) bytes  digest=\(.digest // "n/a")"' 2>/dev/null || true
          } > /tmp/ci-ok.txt

          cat /tmp/ci-ok.txt

          git config user.name  'CI Reporter' || true
          git config user.email 'ci@workbuddy.local' || true
          git checkout --orphan ci-ok-tmp 2>/dev/null || git checkout ci-ok-tmp
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/ci-ok.txt ci-ok.txt
          git add -f ci-ok.txt
          git commit -m "repack report (run ${{ steps.src.outputs.run_id }}, ${{ job.status }})" || true
          git push -f origin HEAD:ci-ok
  pin:
    if: ${{ startsWith(github.ref_name, 'pin-node-') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'pin') }}
    runs-on: ubuntu-latest
    # 纯搬运，几分钟足够。给 30 分钟余量（要下载 ~50MB artifact）。
    timeout-minutes: 30

    steps:
      # 校验器脚本来自仓库，不在下载的 artifact 里。取 main 那份而非触发 ref：
      # pin-node-* tag 上没有这些脚本，而且「什么算合格产物」的判据应当随 main 演进。
      - name: Checkout validator scripts
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve source run and inputs
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          RUN_ID="${{ inputs.run_id }}"
          VERSION="${{ inputs.version }}"
          ABI="${{ inputs.abi }}"

          # tag 触发解析：pin-node-<run_id> 或 pin-node-latest
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            REF_TAG="${GITHUB_REF_NAME:-}"
            echo "== 由 tag 触发: $REF_TAG =="
            CAND="${REF_TAG#pin-node-}"
            if [ "$CAND" != "latest" ] && printf '%s' "$CAND" | grep -qE '^[0-9]+$'; then
              RUN_ID="$CAND"
              echo "从 tag 解析出 run_id=$RUN_ID"
            else
              echo "tag 未指定 run_id，改为自动查找最近一次成功运行。"
            fi
          fi

          if [ -z "$RUN_ID" ]; then
            echo "== 自动查找最近一次成功的构建运行 =="
            # build-node.yml（Node 专用构建）是拆分计划里的名字，从未落地；
            # 实际的一体化 Node 构建就是 build-apk.yml —— 它的产物同样是
            # 完好的，可直接固化 —— 这正是本次固化要做的事。
            for WF in build-apk.yml; do
              RUN_ID="$(gh run list \
                          --repo '${{ github.repository }}' \
                          --workflow "$WF" \
                          --status success \
                          --limit 1 \
                          --json databaseId \
                          --jq '.[0].databaseId' 2>/dev/null || true)"
              if [ -n "$RUN_ID" ] && [ "$RUN_ID" != "null" ]; then
                echo "命中 workflow: $WF  (run $RUN_ID)"
                break
              fi
            done
          fi
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "[error] 找不到成功的 build-apk 运行。"
            echo "        先手动跑一次 'Build Android Node Container APK'，再固化。"
            exit 1
          fi

          # 版本号缺省时，尝试从该 run 的 ci-ok/ci-last 自报里取；取不到用默认值。
          if [ -z "$VERSION" ]; then VERSION="24.21.0"; fi
          if [ -z "$ABI" ]; then ABI="arm64-v8a"; fi

          echo "源 run  : $RUN_ID"
          echo "版本    : $VERSION"
          echo "ABI     : $ABI"

          {
            echo "run_id=$RUN_ID"
            echo "version=$VERSION"
            echo "abi=$ABI"
          } >> "$GITHUB_OUTPUT"

          echo
          echo "== 该 run 的 artifact 列表 =="
          gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}/artifacts" \
            --jq '.artifacts[] | "\(.name)  (\(.size_in_bytes) bytes, expired=\(.expired))"'

      - name: Download artifact and extract .so files
        id: extract
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUN_ID="${{ steps.resolve.outputs.run_id }}"

          rm -rf /tmp/pin && mkdir -p /tmp/pin/dl /tmp/pin/out

          # 该 run 挂着的 artifact 就是那个 APK（build-apk.yml 的 upload 步只投
          # android-node-container-apk，裸 .so 从 APK 的 lib/arm64-v8a/ 里取）。
          # 这里下载全部 artifact 再按文件名挑，比按 artifact 名硬编码更稳：
          # 名字一旦调整，这里不会静默漏文件，而是走到「找不到 libnode.so」判红。
          echo "== 下载 artifact 列表 =="
          gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}/artifacts" \
            --jq '.artifacts[].name' | tee /tmp/pin/artifact-names.txt

          while IFS= read -r NAME; do
            [ -z "$NAME" ] && continue
            echo "--- 下载: $NAME ---"
            mkdir -p "/tmp/pin/dl/$NAME"
            gh run download "$RUN_ID" \
              --repo '${{ github.repository }}' \
              --name "$NAME" \
              --dir "/tmp/pin/dl/$NAME" || echo "[warn] $NAME 下载失败，跳过"
          done < /tmp/pin/artifact-names.txt

          echo
          echo "== 下载内容总览 =="
          # 纯列表：head 提前关管道会让上游吃 SIGPIPE 判非零 —— pipefail 下这不该中止固化
          { find /tmp/pin/dl -type f -printf '%s  %p\n' | sort -rn | head -20 || true; }

          # 找出两个 .so。用 find 而非固定路径，容忍 artifact 内部的目录层级差异。
          # --allow-empty：下面两块是「先找裸 .so，空了从 APK 里解」的探测链，
          # 判空由块尾那两条 [ -z ] 硬失败负责（它们才是真结论）。
          NODE_SO="$(bash scripts/pick.sh --allow-empty pin-libnode /tmp/pin/dl -type f -name 'libnode.so*')"
          CXX_SO="$(bash scripts/pick.sh --allow-empty pin-libcxx /tmp/pin/dl -type f -name 'libc++_shared.so*')"

          # 兜底：某些 artifact 可能只含 APK。那就从 APK 的 lib/ 里取。
          if [ -z "$NODE_SO" ]; then
            APK="$(bash scripts/pick.sh --allow-empty pin-apk /tmp/pin/dl -type f -name '*.apk')"
            if [ -n "$APK" ]; then
              echo "== 未找到裸 .so，改从 APK 中提取 =="
              mkdir -p /tmp/pin/unzip
              unzip -o -q "$APK" 'lib/arm64-v8a/*' -d /tmp/pin/unzip
              NODE_SO="$(bash scripts/pick.sh --allow-empty pin-libnode-unzipped /tmp/pin/unzip -type f -name 'libnode.so*')"
              CXX_SO="$(bash scripts/pick.sh --allow-empty pin-libcxx-unzipped /tmp/pin/unzip -type f -name 'libc++_shared.so*')"
            fi
          fi

          if [ -z "$NODE_SO" ]; then
            echo "[error] 在 run $RUN_ID 的产物里找不到 libnode.so。"
            echo "        artifact 内容见上（已按大小排序）。"
            exit 1
          fi
          if [ -z "$CXX_SO" ]; then
            echo "[error] 找不到 libc++_shared.so —— 它是 node 的运行期依赖，"
            echo "        缺它打出的包在真机上会报 cannot locate symbol。拒绝固化。"
            exit 1
          fi

          cp -f "$NODE_SO" /tmp/pin/out/libnode.so
          cp -f "$CXX_SO"  /tmp/pin/out/libc++_shared.so
          chmod +x /tmp/pin/out/libnode.so /tmp/pin/out/libc++_shared.so

          echo
          echo "== 提取结果 =="
          ls -la /tmp/pin/out/

      - name: Verify extracted binaries (fail loudly, never pin a bad runtime)
        run: |
          set -euo pipefail
          cd /tmp/pin/out

          # readelf / file 由 binutils/file 提供。"工具没装"与"产物不合格"分开处置的
          # 判据已收口到唯一宿主 scripts/ensure-tool.sh（门禁法①），这里只声明缺什么装什么。
          bash "$GITHUB_WORKSPACE/scripts/ensure-tool.sh" readelf binutils
          bash "$GITHUB_WORKSPACE/scripts/ensure-tool.sh" file file

          echo "=== 1) ELF 架构 ==="
          file libnode.so libc++_shared.so

          # 必须是 AArch64 ELF。架构错了装到真机上就是 exec format error。
          if ! file libnode.so | grep -q 'ARM aarch64'; then
            echo "[error] libnode.so 不是 ARM aarch64 ELF，拒绝固化。"
            exit 1
          fi
          echo "[ok] 架构正确：ARM aarch64"

          echo
          echo "=== 2) 解释器必须指向 Android linker64 ==="
          readelf -W -l libnode.so 2>/dev/null | grep -i interpreter || true
          if ! readelf -W -l libnode.so 2>/dev/null | grep -qi 'linker64'; then
            echo "[error] 未找到 /system/bin/linker64 解释器。"
            echo "        这说明它是用 glibc 工具链链接的，不是 Android bionic —— "
            echo "        真机上无法 exec。拒绝固化。"
            exit 1
          fi
          echo "[ok] 解释器正确"

          echo
          echo "=== 3) 16KB 页对齐（Android 15+ 要求；不满足则新设备无法加载）==="
          # 两点注意（第一次跑时都踩到了）：
          #   a) 必须用 readelf -W（wide）。默认模式在输出非终端时会把超 80 列的
          #      Program Headers 表折行，同一个 LOAD 段的字段被拆到两行 —— 于是
          #      awk 取的 $NF 不再是对齐值，这项校验就会【误报失败】。
          #   b) 判据用「是否存在 0x4000 对齐的 LOAD 段」而非「全部段都必须是」。
          #      后者看起来更严格，但 ELF 里段的对齐值本就允许不同（如最后一个
          #      RW 段），拿它当硬门槛是在校验一个 ELF 规范并不要求的东西，
          #      只会制造假失败。真正的目的是确认「这份产物支持 16KB 页设备」。
          readelf -W -l libnode.so 2>/dev/null | grep -E '^  LOAD' || true
          if readelf -W -l libnode.so 2>/dev/null | grep -qE '0x4000'; then
            echo "[ok] 检出 16KB (0x4000) 对齐的 LOAD 段"
          else
            echo "[error] 未检出 16KB 对齐的 LOAD 段。"
            echo "        Android 15+ 在 16KB 页设备上会返回 ELIBBAD / Exec format error。"
            echo "        NDK r27+ 默认应满足；若是旧 NDK 编出的产物，拒绝固化。"
            exit 1
          fi

          echo
          echo "=== 4) 动态依赖闭环 ==="
          # 遍历 DT_NEEDED，除 bionic 提供的系统库外，其余必须由随包文件提供。
          NEEDED="$({ readelf -d libnode.so 2>/dev/null || true; } | awk '/NEEDED/ {gsub(/[\[\]]/,"",$5); print $5}')"
          # 空清单 = 下面的闭环循环一条都不跑就走到 [ok]，那是空转放行。读不出来就拒绝固化。
          [ -n "$NEEDED" ] || { echo "[error] 读不出 libnode.so 的 DT_NEEDED，依赖闭环无从进行，拒绝固化。"; exit 1; }
          echo "NEEDED 列表："
          echo "$NEEDED" | sed 's/^/  /'
          MISSING=""
          while IFS= read -r lib; do
            [ -z "$lib" ] && continue
            case "$lib" in
              libc.so|libm.so|libdl.so|liblog.so|libz.so|libandroid.so|\
              libGLESv2.so|libEGL.so|libnativewindow.so|libsync.so|\
              libatomic.so|libstdc++.so)
                echo "  [ok] $lib （bionic/系统提供）" ;;
              *)
                if [ -f "./$lib" ]; then
                  echo "  [ok] $lib （已随包提供）"
                else
                  echo "  [MISSING] $lib"
                  MISSING="$MISSING $lib"
                fi ;;
            esac
          done <<< "$NEEDED"
          if [ -n "$MISSING" ]; then
            echo "[error] 以下依赖既不在系统里、也没随包提供：$MISSING"
            echo "        固化了也跑不起来，拒绝。"
            exit 1
          fi
          echo "[ok] 依赖闭环完整"

          echo
          echo "=== 5) 同目录依赖能否自解析（DT_RUNPATH 含 \$ORIGIN）==="
          # 依赖闭环只回答「库在不在」，这一问回答「linker 找不找得到它」。
          # dsh run_code 从空环境起子进程，继承不到我们主进程设的 LD_LIBRARY_PATH，
          # 所以没有 $ORIGIN RUNPATH 的产物在真机上是死的 —— 而它在 CI 里看起来完全正常。
          # 装机后无法补救，只能在固化前拦住。判据实现在脚本里，三处（构建/固化/打包）共用。
          bash "$GITHUB_WORKSPACE/scripts/verify-runtime-elf.sh" .

          echo
          echo "=== 6) 记录指纹 ==="
          sha256sum libnode.so libc++_shared.so | tee /tmp/pin/out/SHA256SUMS

      - name: Publish as immutable release
        id: pub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.resolve.outputs.version }}"
          ABI="${{ steps.resolve.outputs.abi }}"
          TAG="node-runtime-${VERSION}-${ABI}"

          cd /tmp/pin/out

          # 生成 manifest：fast-apk.yml 靠它决定"下载什么、校验什么"。
          # 把校验和写进 manifest 而不是让下游自己算，是为了让"用了哪个二进制"
          # 这件事可追溯 —— 出问题时能一眼看出 APK 里装的是哪份产物。
          NODE_SHA="$(sha256sum libnode.so | awk '{print $1}')"
          NODE_SIZE="$(stat -c%s libnode.so)"
          CXX_SHA="$(sha256sum libc++_shared.so | awk '{print $1}')"
          CXX_SIZE="$(stat -c%s libc++_shared.so)"

          # 用 python 生成 manifest，而不是 heredoc 或内联多行脚本。
          # 原因：YAML 块标量里嵌 heredoc 极易因缩进破坏结构（这里踩过）。
          # 单行 python -c 最稳。
          python3 -c "import json,datetime,sys; v,a,r,ns,nz,cs,cz=sys.argv[1:8]; m={'schema':1,'version':v,'abi':a,'source_run':r,'created_at':datetime.datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ'),'files':{'libnode.so':{'sha256':ns,'size':int(nz)},'libc++_shared.so':{'sha256':cs,'size':int(cz)}}}; json.dump(m,open('manifest.json','w'),indent=2,ensure_ascii=False); print(json.dumps(m,indent=2,ensure_ascii=False))" \
            "$VERSION" "$ABI" "${{ steps.resolve.outputs.run_id }}" \
            "$NODE_SHA" "$NODE_SIZE" "$CXX_SHA" "$CXX_SIZE"

          echo "TAG=$TAG" >> "$GITHUB_ENV"

          # 这一格只负责【政策告警】：固化 tag 的语义是不可变，已存在就该提升版本而不是重传。
          # 「不存在就创建 / 存在就覆盖 / 传完回读确认」是判据，住 scripts/gh-release-upload.sh。
          if gh release view "$TAG" --repo '${{ github.repository }}' >/dev/null 2>&1; then
            echo "::warning title=固化 tag 已存在::$TAG 的语义是【不可变】—— 同一版本+ABI 的二进制不应被替换，否则已发布的 APK 与它所依赖的运行时版本就对不上；如需固化的新产物请提升 version。本次仅更新资产内容以备重发。"
          fi
          # 注意：--notes 的值必须写成【单行】。
          # YAML 块标量（run: |）里出现跨行字符串时，续行一旦顶格就会破坏
          # YAML 结构（本文件在这一点上踩过坑：报 "could not find expected ':'"）。
          # 需要换行就用 \n 转义，交给 shell 展开。
          NOTES="预编译的 Node ${VERSION} 安卓原生运行时（bionic 链接，arm64-v8a）。\n\n"
          NOTES="${NOTES}来源：build-apk 运行 ${{ steps.resolve.outputs.run_id }}\n\n"
          NOTES="${NOTES}包含：\n"
          NOTES="${NOTES}- libnode.so —— Node 可执行文件（经 jniLibs 通道落盘到 nativeLibraryDir）\n"
          NOTES="${NOTES}- libc++_shared.so —— 运行期动态依赖，符号由它提供\n"
          NOTES="${NOTES}- manifest.json / SHA256SUMS —— 校验与溯源\n\n"
          NOTES="${NOTES}本资产为不可变引用：fast-apk.yml 按此 tag 下载，不再重编 Node。"
          bash scripts/gh-release-upload.sh "$TAG" \
            --title "Node ${VERSION} runtime for Android ${ABI} (prebuilt)" \
            --notes "$(printf '%b' "$NOTES")" \
            libnode.so libc++_shared.so manifest.json SHA256SUMS

      - name: Report to ci-ok
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory '*'
          rm -rf /tmp/pinok && mkdir -p /tmp/pinok && cd /tmp/pinok
          git clone --quiet \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" . || {
              echo "[warn] clone 失败，跳过上报"; exit 0; }

          TAG="${{ env.TAG }}"
          {
            echo "NODE_PINNED"
            echo "time    : $(date -u)"
            echo "tag     : $TAG"
            echo "version : ${{ steps.resolve.outputs.version }}"
            echo "abi     : ${{ steps.resolve.outputs.abi }}"
            echo "run     : ${{ steps.resolve.outputs.run_id }}"
            echo
            echo "== 资产 =="
            # 子 shell：花括号组不隔目录，这里 cd 出去会把本步的 cwd 带走，
            # 后面的 git config 就落在 /tmp/pin/out 上（实测 fatal: not in a git directory，
            # 于是 pin 成功也报红 run）。
            ( cd /tmp/pin/out && sha256sum libnode.so libc++_shared.so )
          } > ci-ok.txt

          git config user.email "ci@workbuddy.local"
          git config user.name "CI Diagnostic Bot"
          git add ci-ok.txt
          git commit -q -m "ci: node runtime pinned ($TAG)" || true
          git push origin HEAD:ci-ok --force && echo "[ok] ci-ok 已更新"
